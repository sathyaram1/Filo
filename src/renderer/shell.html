<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Filo</title>
  <link rel="stylesheet" href="filo://shell/shell.css" />
</head>
<body>
  <header class="shell">
    <div class="tab-row">
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="tab-new" id="tab-new" title="Nuova scheda (Ctrl+T)" aria-label="Nuova scheda"></button>
      <div class="tab-drag-spacer"></div>
      <div class="window-controls">
        <button class="win-btn" id="win-min" title="Minimizza" aria-label="Minimizza"></button>
        <button class="win-btn" id="win-max" title="Massimizza" aria-label="Massimizza"></button>
        <button class="win-btn win-close" id="win-close" title="Chiudi" aria-label="Chiudi"></button>
      </div>
    </div>
    <nav class="addr">
      <button class="nav-btn" id="nav-back" title="Indietro" aria-label="Indietro"></button>
      <button class="nav-btn" id="nav-forward" title="Avanti" aria-label="Avanti"></button>
      <button class="nav-btn" id="nav-reload" title="Ricarica" aria-label="Ricarica"></button>
      <input id="addr" type="text" spellcheck="false" placeholder="Cerca o inserisci un indirizzo" />
      <button class="nav-btn" id="nav-home" title="Home (filo://newtab)" aria-label="Home"></button>
      <button class="nav-btn" id="nav-settings" title="Impostazioni" aria-label="Impostazioni"></button>
      <button class="nav-btn" id="nav-apps" title="App" aria-label="App"></button>
    </nav>
  </header>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shell/shell.js"></script>
</body>
</html>
