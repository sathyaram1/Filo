<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Filo</title>
  <link rel="stylesheet" href="filo://shell/shell.css" />
  <link rel="stylesheet" href="filo://shell/avvisi.css" />
</head>
<body>
  <header class="shell">
    <div class="tab-row">
      <button class="barra-maniglia" id="barra-maniglia" aria-label="Barra laterale"></button>
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="tab-new" id="tab-new" data-tip="Nuova scheda" aria-label="Nuova scheda"></button>
      <div class="tab-drag-spacer"></div>
      <span class="incognito-badge" id="incognito-badge" hidden data-tip="Sessione incognito: niente cronologia né dati salvati su questo computer" aria-label="Finestra incognito"></span>
      <!-- Timer/sveglia che sta suonando: sta QUI perché la fila di tab è l'unica striscia mai coperta
         dalla view della pagina, e una scadenza coglie l'utente su una scheda qualunque. -->
      <button class="ring-indicator" id="ring-indicator" hidden data-tip="Ferma la suoneria" aria-label="Ferma la suoneria">
        <span class="ring-ind-icon" id="ring-ind-icon"></span>
        <span class="ring-ind-label" id="ring-ind-label"></span>
      </button>
      <!-- Indicatore dei download: compare con almeno un download in elenco, fuori dalla home (#1112), e il
         click apre il pannello con i singoli download. -->
      <button class="dl-indicator" id="dl-indicator" hidden data-tip="Download" aria-label="Download">
        <span class="dl-ind-icon" id="dl-ind-icon"></span>
        <span class="dl-ind-count" id="dl-ind-count" hidden></span>
        <span class="dl-ind-bar"><span class="dl-ind-fill" id="dl-ind-fill"></span></span>
      </button>
      <div class="window-controls">
        <button class="win-btn" id="win-min" data-tip="Minimizza" aria-label="Minimizza"></button>
        <button class="win-btn" id="win-max" data-tip="Massimizza" aria-label="Massimizza"></button>
        <button class="win-btn win-close" id="win-close" data-tip="Chiudi" aria-label="Chiudi"></button>
      </div>
    </div>
    <!-- Barra indirizzi sempre nascosta (vedi applyChrome): gli elementi restano nel DOM perché shell.js ne
       aggancia i gestori, ma le icone visibili sono altrove. -->
    <nav class="addr">
      <button class="nav-btn" id="nav-back" data-tip="Indietro" aria-label="Indietro"></button>
      <button class="nav-btn" id="nav-forward" data-tip="Avanti" aria-label="Avanti"></button>
      <button class="nav-btn" id="nav-reload" data-tip="Ricarica" aria-label="Ricarica"></button>
      <div class="addr-spacer"></div>
      <button class="nav-btn" id="nav-home" data-tip="Home" aria-label="Home"></button>
      <button class="nav-btn" id="nav-settings" data-tip="Impostazioni" aria-label="Impostazioni"></button>
      <button class="nav-btn" id="nav-apps" data-tip="App" aria-label="App"></button>
      <button class="nav-btn nav-account" id="nav-account" data-tip="Accedi" aria-label="Accedi"></button>
    </nav>
  </header>
  <!-- Sta FUORI da .shell così il filtro brightness della penombra non la tocca e i tratti restano a piena
     luminosità. Nascosta finché non si annota. -->
  <canvas id="feedback-draw" hidden></canvas>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/tasti.js"></script>
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/tabColor.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/sounds.js"></script>
  <script src="filo://shared/avvisiTempo.js"></script>
  <script src="filo://shared/nomiSito.js"></script>
  <script src="filo://shared/eseguibili.js"></script>
  <script src="filo://shared/nomiFile.js"></script>
  <script src="filo://shared/righeVive.js"></script>
  <script src="filo://shell/shell.js"></script>
</body>
</html>
