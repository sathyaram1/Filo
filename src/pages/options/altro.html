<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Altro</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/tasti.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/confirmUi.js"></script>
</head>
<body>
  <main class="sn-page" id="page">
    <p style="margin: 0 0 4px;">
      <a id="backToModels" href="options.html" class="sn-muted"></a>
    </p>
    <h1 id="title"></h1>

    <section>
      <h2 id="h-blocklist"></h2>
      <p class="sn-muted">Domini su cui l'estensione è disabilitata (uno per riga).</p>
      <textarea id="blocklist"></textarea>
    </section>

    <section>
      <h2 id="h-categories"></h2>
      <p class="sn-muted">Le categorie create dall'AI quando salvi una scheda. Puoi rinominarle o eliminarle.</p>
      <div id="categoriesList" class="sn-cat-list"></div>
      <p id="categoriesEmpty" class="sn-muted" hidden></p>
    </section>

    <section>
      <h2 id="h-shortcuts"></h2>
      <ul id="shortcutsList" class="sn-muted" style="line-height:1.7"></ul>
    </section>

    <div class="sn-toolbar" style="margin-top: 24px;">
      <span id="savedHint" class="sn-saved-indicator"></span>
      <button class="sn-btn sn-btn-secondary" id="openHome">Aperti per dopo</button>
      <button class="sn-btn sn-btn-secondary" id="openHistory">Cronologia AI</button>
      <button class="sn-btn sn-btn-secondary" id="openArchive">Cronologia</button>
      <button class="sn-btn sn-btn-secondary" id="openSpellcheck">Gestisci correttore</button>
    </div>
  </main>

  <script src="altro.js"></script>
</body>
</html>
