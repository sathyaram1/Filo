<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Cronologia AI</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/storage.js"></script>
</head>
<body>
  <main class="sn-page">
    <h1 id="title"></h1>

    <div class="sn-toolbar">
      <input type="search" id="search" />
      <select id="filter">
        <option value="">Tutte</option>
        <option value="explain">Spiega</option>
        <option value="translate_selection">Traduci selezione</option>
        <option value="translate_page">Traduci pagina</option>
        <option value="help">Aiuto</option>
      </select>
      <button class="sn-btn sn-btn-secondary" id="clear"></button>
      <button class="sn-btn sn-btn-secondary" id="openHome">Aperti per dopo</button>
      <button class="sn-btn sn-btn-secondary" id="openOptions">Opzioni</button>
    </div>

    <div id="list" class="sn-history-list"></div>
    <div id="empty" class="sn-empty" hidden></div>
  </main>

  <script src="history.js"></script>
</body>
</html>
