<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Bacheca</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/feedback.js"></script>
  <script src="filo://shared/manageReview.js"></script>
  <style>
    /* La bacheca è la superficie utente (NON owner): mostra solo i fix già in
       produzione, in chiave positiva. Niente info di sicurezza, niente stati. */
    .bd-head { margin: 0 0 6px; }
    .bd-head h1 { font-size: 22px; margin: 0 0 4px; }
    .bd-head p { margin: 0; color: var(--sn-muted); font-size: 13px; }

    /* Barra accesso (login per votare). Anonimi leggono; per votare serve login. */
    .bd-auth {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 10px 0 16px; font-size: 13px; color: var(--sn-muted);
    }
    .bd-auth button {
      font: inherit; font-weight: 600; cursor: pointer;
      border: 1px solid var(--sn-border); border-radius: 8px;
      padding: 6px 12px; background: var(--sn-card); color: var(--sn-fg);
    }
    .bd-auth button:hover { border-color: var(--sn-accent); }

    .bd-loading, .bd-empty { color: var(--sn-muted); font-size: 14px; padding: 24px 4px; }

    .bd-list { display: flex; flex-direction: column; gap: 10px; }

    .bd-card {
      border: 1px solid var(--sn-border); border-radius: 12px;
      background: var(--sn-card); padding: 14px 16px;
      display: flex; align-items: center; gap: 14px; justify-content: space-between;
    }
    .bd-card-main { min-width: 0; flex: 1 1 auto; }
    .bd-card-title {
      font-size: 15px; font-weight: 600; color: var(--sn-fg);
      overflow-wrap: anywhere;
    }
    .bd-card-sub { margin-top: 3px; font-size: 12px; color: var(--sn-muted); }

    /* Voti: due pulsanti funziona/non-funziona + conteggi. La PERSISTENZA del
       voto e la ricompensa in crediti arrivano con DC2: qui i pulsanti sono la
       superficie "votabile" (riflettono il conteggio e la scelta locale). */
    .bd-vote { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .bd-vote-btn {
      font: inherit; cursor: pointer; display: inline-flex; align-items: center;
      gap: 6px; border: 1px solid var(--sn-border); border-radius: 999px;
      padding: 6px 12px; background: transparent; color: var(--sn-fg);
      font-size: 13px; font-weight: 600;
    }
    .bd-vote-btn:hover { border-color: var(--sn-accent); }
    .bd-vote-btn[aria-pressed="true"].bd-vote-works {
      background: rgba(39, 174, 96, 0.15); border-color: #27ae60; color: #1e8449;
    }
    .bd-vote-btn[aria-pressed="true"].bd-vote-broken {
      background: rgba(192, 57, 43, 0.15); border-color: #c0392b; color: #c0392b;
    }
    .bd-vote-count { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="sn-page">
    <header class="bd-head">
      <h1>Bacheca</h1>
      <p>I miglioramenti già rilasciati. Provali e dicci se funzionano.</p>
    </header>

    <div class="bd-auth">
      <span id="bdAuthMsg">Accedi per votare i miglioramenti.</span>
      <button id="bdSignIn" type="button">Accedi</button>
    </div>

    <div id="bdLoading" class="bd-loading">Caricamento…</div>
    <div id="bdEmpty" class="bd-empty" hidden>Nessun miglioramento da verificare per ora.</div>
    <div id="bdList" class="bd-list" hidden></div>
  </main>

  <script src="filo://board/board.js"></script>
</body>
</html>
