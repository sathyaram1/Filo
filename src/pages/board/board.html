<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Bacheca</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/contenutoEsterno.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/feedback.js"></script>
  <script src="filo://shared/feedbackTransitions.js"></script>
  <script src="filo://shared/feedbackStatus.js"></script>
  <script src="filo://shared/chatErrors.js"></script>
  <script src="filo://shared/manageReview.js"></script>
  <style>
    /* La bacheca è la superficie utente (NON owner): mostra solo i fix già in
       produzione, in chiave positiva. Niente info di sicurezza, niente stati. */
    .bd-head { margin: 0 0 6px; }
    .bd-head h1 { font-size: 22px; margin: 0 0 4px; }
    .bd-head p { margin: 0; color: var(--sn-muted); font-size: 13px; }

    .bd-auth {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 10px 0 16px; font-size: 13px; color: var(--sn-muted);
    }
    .bd-auth button {
      font: inherit; font-weight: 600; cursor: pointer;
      border: 1px solid var(--sn-border); border-radius: 8px;
      padding: 6px 12px; background: var(--sn-card); color: var(--sn-fg);
    }
    .bd-auth button:hover { border-color: var(--sn-accent); }
    .bd-auth .bd-auth-ko { color: var(--sn-error); }
    .bd-auth .bd-auth-lascia { background: transparent; }

    .bd-loading, .bd-empty { color: var(--sn-muted); font-size: 14px; padding: 24px 4px; }
    /* Quando non si può stimare il tempo, una rotella: la pagina non deve restare muta a "Caricamento…". */
    .bd-loading { display: flex; align-items: center; gap: 10px; }
    /* Un `display` in una classe batte il `display: none` di `[hidden]`, e `el.hidden = true` non nasconde più:
       una riga per OGNI classe. patterns/una-classe-che-scrive-display-deve-lasciarsi-nascondere.md */
    .bd-auth[hidden], .bd-loading[hidden], .bd-error[hidden], .bd-retry[hidden], .bd-list[hidden],
    .bd-more[hidden], .bd-card[hidden], .bd-vote[hidden], .bd-vote-btn[hidden],
    .bd-reopen-actions[hidden], .bd-spinner[hidden] { display: none; }
    .bd-spinner {
      width: 16px; height: 16px; flex: 0 0 auto; border-radius: 50%;
      border: 2px solid var(--sn-border); border-top-color: var(--sn-accent);
      animation: bdSpin 0.8s linear infinite;
    }
    @keyframes bdSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .bd-spinner { animation-duration: 2s; } }

    /* Se il caricamento fallisce la bacheca lo DICE e offre un modo per riprovare, invece di fingere che non
       ci sia nulla da votare. */
    .bd-error {
      display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      padding: 20px; margin-top: 4px;
      border: 1px solid var(--sn-border); border-radius: 12px; background: var(--sn-card);
    }
    .bd-error-msg { margin: 0; color: var(--sn-fg); font-size: 14px; line-height: 1.5; }
    .bd-retry {
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--sn-border); border-radius: 8px; padding: 7px 14px;
      background: var(--sn-card); color: var(--sn-fg);
    }
    .bd-retry:hover { border-color: var(--sn-accent); }
    .bd-retry[disabled] { opacity: .6; cursor: default; }

    .bd-list { display: flex; flex-direction: column; gap: 10px; }

    /* Fondo della lista: dice che le altre schede stanno arrivando. Colori dai
       token, così vale in chiaro come in scuro. */
    .bd-more {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 4px; color: var(--sn-muted); font-size: 13px;
    }

    .bd-card {
      border: 1px solid var(--sn-border); border-radius: 12px;
      background: var(--sn-card); padding: 14px 16px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between;
    }
    .bd-card-main { min-width: 0; flex: 1 1 auto; }
    .bd-card-title {
      font-size: 15px; font-weight: 600; color: var(--sn-fg);
      overflow-wrap: anywhere;
    }
    .bd-card-sub { margin-top: 3px; font-size: 12px; color: var(--sn-muted); }

    /* I conteggi riflettono il tally reale su Firestore, non solo la scelta locale dell'utente. */
    .bd-vote { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .bd-vote-btn[disabled] { opacity: .6; cursor: default; }
    .bd-vote-btn {
      font: inherit; cursor: pointer; display: inline-flex; align-items: center;
      gap: 6px; border: 1px solid var(--sn-border); border-radius: 999px;
      padding: 6px 12px; background: transparent; color: var(--sn-fg);
      font-size: 13px; font-weight: 600;
    }
    .bd-vote-btn:hover { border-color: var(--sn-accent); }
    /* Il voto già dato prende i colori dai token del tema: scritti a mano, sul fondo scuro il
       conteggio scendeva sotto il contrasto minimo e spariva proprio dopo aver votato. */
    .bd-vote-btn[aria-pressed="true"].bd-vote-works {
      background: color-mix(in srgb, var(--sn-success) 15%, transparent);
      border-color: var(--sn-success);
      color: var(--sn-success);
    }
    .bd-vote-btn[aria-pressed="true"].bd-vote-broken {
      background: color-mix(in srgb, var(--sn-error) 15%, transparent);
      border-color: var(--sn-error);
      color: var(--sn-error);
    }
    .bd-vote-count { font-variant-numeric: tabular-nums; }

    /* Form inline in stile Filo, mai un window.prompt nativo (PATTERNS.md). */
    .bd-reopen { flex: 1 1 100%; }
    .bd-reopen-link {
      font: inherit; font-size: 12px; color: var(--sn-muted); cursor: pointer;
      background: none; border: none; padding: 2px 0; text-decoration: underline;
    }
    .bd-reopen-link:hover { color: var(--sn-fg); }
    .bd-reopen-done { font-size: 12px; color: var(--sn-muted); flex: 1 1 100%; }
    .bd-reopen-form {
      margin-top: 8px; padding: 10px; border: 1px solid var(--sn-border);
      border-radius: 10px; background: var(--sn-bg);
    }
    .bd-reopen-hint { margin: 0 0 6px; font-size: 12px; color: var(--sn-muted); }
    .bd-reopen-text {
      width: 100%; min-height: 60px; resize: vertical; font: inherit; font-size: 13px;
      border: 1px solid var(--sn-border); border-radius: 8px; padding: 8px;
      background: var(--sn-card); color: var(--sn-fg); box-sizing: border-box;
    }
    .bd-reopen-text:focus { outline: none; border-color: var(--sn-accent); }
    .bd-reopen-actions { display: flex; gap: 8px; margin-top: 8px; }
    .bd-reopen-actions button {
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--sn-border); border-radius: 8px; padding: 6px 12px;
      background: var(--sn-card); color: var(--sn-fg);
    }
    .bd-reopen-actions button:hover { border-color: var(--sn-accent); }
    .bd-reopen-actions button[disabled] { opacity: .6; cursor: default; }
    .bd-reopen-cancel { background: transparent; }
    .bd-reopen-err { margin: 6px 0 0; font-size: 12px; color: var(--sn-error); }
    /* L'esito di un gesto sta sulla sua scheda, a tutta riga: un voto rifiutato in rosso, una riapertura
       partita in verde. Dai token, così si legge in chiaro come in scuro. */
    .bd-card-msg { flex: 1 1 100%; margin: 0; font-size: 12px; color: var(--sn-error); }
    .bd-card-msg-info { color: var(--sn-muted); }
    .bd-reopen-ok { flex: 1 1 100%; margin: 0; font-size: 12px; color: var(--sn-success); }

    /* «Le tue segnalazioni» (#986): righe più basse delle schede dei miglioramenti, lo stato come pastiglia. */
    .bd-mie[hidden], .bd-h2[hidden], .bd-mie-vuoto[hidden], .bd-mie-altre[hidden], .bd-mia-corpo[hidden],
    .bd-mia-testo[hidden], .bd-mia-allegati[hidden], .bd-mia-risposta[hidden] { display: none; }
    .bd-mie { display: flex; flex-direction: column; }
    .sn-page h2.bd-h2 { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 10px; }
    .bd-conto { font-size: 13px; font-weight: 600; color: var(--sn-muted); font-variant-numeric: tabular-nums; }
    .bd-mie-lista { display: flex; flex-direction: column; gap: 6px; }
    .bd-mie-vuoto { margin: 0; color: var(--sn-muted); font-size: 13px; }
    .bd-mia {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
      border: 1px solid var(--sn-border); border-radius: 10px; background: var(--sn-card);
      padding: 4px 6px 4px 4px; transition: border-color .15s;
    }
    .bd-mia:hover, .bd-mia.bd-mia-aperta { border-color: color-mix(in srgb, var(--sn-accent) 45%, var(--sn-border)); }
    .bd-mia-testa {
      flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      font: inherit; text-align: left; cursor: pointer; color: var(--sn-fg);
      background: none; border: none; border-radius: 7px; padding: 6px 8px;
    }
    .bd-mia-testa:hover { background: var(--sn-hover); }
    .bd-mia-titolo {
      max-width: 100%; font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bd-mia-aperta .bd-mia-titolo { white-space: normal; overflow-wrap: anywhere; }
    .bd-mia-sub { font-size: 12px; color: var(--sn-muted); }
    .bd-mia-stato {
      flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
      color: var(--sn-muted); background: color-mix(in srgb, var(--sn-muted) 14%, transparent);
    }
    .bd-mia-stato[data-stato="inviata"] { color: var(--sn-accent); background: color-mix(in srgb, var(--sn-accent) 14%, transparent); }
    .bd-mia-stato[data-stato="risolta"] { color: var(--sn-success); background: color-mix(in srgb, var(--sn-success) 15%, transparent); }
    .bd-mia-stato[data-stato="non_partita"] { color: var(--sn-error); background: color-mix(in srgb, var(--sn-error) 14%, transparent); }
    .bd-mia-togli {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      min-width: 30px; height: 30px; padding: 0 8px; cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 600; color: var(--sn-muted);
      background: transparent; border: 1px solid transparent; border-radius: 8px;
    }
    .bd-mia-togli:hover { color: var(--sn-fg); background: var(--sn-hover); border-color: var(--sn-border); }
    .bd-mia-togli.bd-mia-togli-conferma { color: var(--sn-error); border-color: var(--sn-error); }
    .bd-mia-togli[disabled] { opacity: .6; cursor: default; }
    .bd-mia-corpo { flex: 1 1 100%; padding: 2px 8px 8px; }
    .bd-mia-corpo p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .bd-mia-testo { white-space: pre-wrap; color: var(--sn-fg); }
    .bd-mia-allegati { color: var(--sn-muted); }
    .bd-mia-risposta { color: var(--sn-fg); padding-left: 10px; border-left: 2px solid var(--sn-success); }
    .bd-mie-altre {
      align-self: flex-start; margin-top: 8px; font: inherit; font-size: 13px; cursor: pointer;
      color: var(--sn-muted); background: none; border: none; padding: 2px 0; text-decoration: underline;
    }
    .bd-mie-altre:hover { color: var(--sn-fg); }
  </style>
</head>
<body>
  <main class="sn-page">
    <header class="bd-head">
      <h1>Bacheca</h1>
      <p>I miglioramenti già rilasciati. Provali e dicci se funzionano.</p>
    </header>

    <section id="bdMie" class="bd-mie" aria-labelledby="bdMieTitolo" hidden>
      <h2 id="bdMieTitolo" class="bd-h2">Le tue segnalazioni <span id="bdMieConto" class="bd-conto"></span></h2>
      <div id="bdMieLista" class="bd-mie-lista"></div>
      <p id="bdMieVuoto" class="bd-mie-vuoto" hidden>Da questo computer non hai ancora mandato segnalazioni.</p>
      <button id="bdMieAltre" class="bd-mie-altre" type="button" hidden></button>
    </section>
    <h2 id="bdMiglioramentiTitolo" class="bd-h2" hidden>Miglioramenti rilasciati</h2>

    <div class="bd-auth">
      <span id="bdAuthSpin" class="bd-spinner" aria-hidden="true" hidden></span>
      <span id="bdAuthMsg" role="status">Accedi per votare i miglioramenti.</span>
      <button id="bdSignIn" type="button">Accedi</button>
      <button id="bdAuthLascia" class="bd-auth-lascia" type="button" hidden>Lascia stare</button>
    </div>

    <div id="bdLoading" class="bd-loading"><span class="bd-spinner" aria-hidden="true"></span><span>Caricamento…</span></div>
    <div id="bdEmpty" class="bd-empty" hidden>Nessun miglioramento da verificare per ora.</div>
    <div id="bdError" class="bd-error" hidden>
      <p id="bdErrorMsg" class="bd-error-msg"></p>
      <button id="bdRetry" type="button" class="bd-retry">↻ Riprova</button>
    </div>
    <div id="bdList" class="bd-list" hidden></div>
  </main>

  <script src="filo://board/board.js"></script>
  <script src="filo://board/board-segnalazioni.js"></script>
</body>
</html>
