<!DOCTYPE html>
<html lang="it" data-sn-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Editor</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pannelloDestro.css" />
  <link rel="stylesheet" href="editor.css" />
  <link rel="stylesheet" href="filo://style/voce.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/avvisiTempo.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/politicaModelli.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/contenutoEsterno.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/chatErrors.js"></script>
  <script src="filo://shared/tasti.js"></script>
  <script src="filo://shared/pannelliApp.js"></script>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/caselleAlSicuro.js"></script>
  <script src="filo://shared/editorStore.js"></script>
  <script src="filo://shared/editorVersions.js"></script>
  <script src="filo://shared/filoContesto.js"></script>
  <script src="filo://shared/editorSummary.js"></script>
  <script src="filo://shared/pannelloDestro.js"></script>
</head>
<body>
  <div class="ed-root" id="root">
    <section class="ed-text-pane" id="textPane">
      <!-- Selettore documento: nome del file attivo e menu per creare, aprire, rinominare ed eliminare. -->
      <div class="ed-docbar" id="docbar">
        <button class="ed-doc-switch" id="docSwitch" aria-haspopup="listbox" aria-expanded="false" title="Documenti">
          <span class="ed-doc-title" id="docTitle">Documento senza titolo</span>
          <span class="ed-doc-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="ed-doc-pop" id="docPop" role="listbox" hidden></div>
      </div>

      <header class="ed-topbar">
        <div class="ed-topbar-spacer"></div>
        <span class="ed-save-state" id="saveState" title="Stato salvataggio"></span>
      </header>

      <div class="ed-doc-wrap" id="docWrap">
        <div class="ed-doc" id="doc" contenteditable="true" spellcheck="true"></div>
      </div>
    </section>
  </div>

  <div class="ed-overlay" id="overlay" hidden>
    <div class="ed-overlay-box" id="overlayBox"></div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
