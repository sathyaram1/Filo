<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Pagina non raggiungibile</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/nomiSito.js"></script>
  <script src="filo://shared/netError.js"></script>
  <style>
    /* Layout centrato, sobrio: solo token di tema, niente colori sparsi. */
    html, body { height: 100%; }
    body { margin: 0; display: flex; align-items: center; justify-content: center; }
    .err-wrap {
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
    }
    .err-icon {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      color: var(--sn-muted);
    }
    .err-icon svg { width: 100%; height: 100%; }
    .err-icon .err-icon-blocked, .err-blocked .err-icon .err-icon-net { display: none; }
    .err-blocked .err-icon .err-icon-blocked { display: block; }
    .err-blocked .err-icon { color: var(--sn-accent, var(--sn-muted)); }
    .err-wrap h1 { font-size: 20px; margin: 0 0 10px; }
    .err-host {
      color: var(--sn-muted);
      font-size: 13px;
      margin: 0 0 14px;
      word-break: break-all;
    }
    .err-hint { font-size: 14px; margin: 0 0 24px; color: var(--sn-fg, inherit); }
    .err-detail {
      margin-top: 22px;
      font-size: 11px;
      color: var(--sn-muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="sn-page err-wrap" id="page">
    <div class="err-icon" aria-hidden="true">
      <svg class="err-icon-net" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3.6 9h16.8M3.6 15h16.8"></path>
        <path d="M12 3a13.5 13.5 0 0 1 0 18M12 3a13.5 13.5 0 0 0 0 18"></path>
        <line x1="4" y1="20" x2="20" y2="4"></line>
      </svg>
      <svg class="err-icon-blocked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="18" height="6" rx="1.5"></rect>
        <path d="M7 9l-3 6M12 9l-3 6M17 9l-3 6M21 10.5L19.5 15"></path>
        <path d="M5 15v5M19 15v5M5 9V6M19 9V6"></path>
      </svg>
    </div>
    <h1 id="err-title"></h1>
    <p class="err-host" id="err-host"></p>
    <p class="err-hint" id="err-hint"></p>
    <button type="button" class="sn-btn" id="err-retry">Riprova</button>
    <p class="err-detail" id="err-detail"></p>
  </main>
  <script src="error.js"></script>
</body>
</html>
