<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Sicurezza</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/confirmUi.js"></script>
</head>
<body>
  <main class="sn-page" id="page">
    <h1 id="title"></h1>

    <section id="sec-security">
      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-protect-ip" />
          <span id="sec-protect-ip-label"></span>
        </label>
        <span class="sn-muted" id="sec-protect-ip-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-block-popups" />
          <span id="sec-block-popups-label"></span>
        </label>
        <span class="sn-muted" id="sec-block-popups-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-adblock" />
          <span id="sec-adblock-label"></span>
        </label>
        <span class="sn-muted" id="sec-adblock-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-siteblock" />
          <span id="sec-siteblock-label"></span>
        </label>
        <span class="sn-muted" id="sec-siteblock-desc"></span>
        <div id="sec-siteblock-sub" style="margin-top: 8px;">
          <label style="display: block; margin-bottom: 6px;">
            <input type="checkbox" id="sec-siteblock-lists" />
            <span id="sec-siteblock-lists-label"></span>
          </label>
          <label class="sn-muted" id="sec-siteblock-blacklist-label" for="sec-siteblock-blacklist" style="display: block; margin-bottom: 4px;"></label>
          <textarea id="sec-siteblock-blacklist" rows="4" style="width: 100%;"></textarea>
          <div id="sec-siteblock-blacklist-error" role="alert" aria-live="polite" style="display:none;color:var(--sn-error);font-size:12px;margin-top:6px"></div>
        </div>
      </div>

      <div class="sn-info-box" id="sec-p2p-box">
        <div class="sn-info-box-title" id="sec-p2p-box-title"></div>
        <div id="sec-p2p-box-body"></div>
      </div>

      <div class="sn-info-box" id="sec-proxy-box">
        <div class="sn-info-box-title" id="sec-proxy-box-title"></div>
        <div id="sec-proxy-box-body"></div>
        <div class="sn-muted" id="sec-proxy-box-provider" style="margin-top:8px;display:none"></div>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-safebrowse" />
          <span id="sec-safebrowse-label"></span>
        </label>
        <span class="sn-muted" id="sec-safebrowse-desc"></span>
      </div>

      <div id="sec-safebrowse-sub" style="margin-left:26px">
        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-network" />
            <span id="sec-safebrowse-network-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-network-desc"></span>
        </div>

        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-llm" />
            <span id="sec-safebrowse-llm-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-llm-desc"></span>
        </div>

        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-sandbox" />
            <span id="sec-safebrowse-sandbox-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-sandbox-desc"></span>
        </div>

        <div class="sn-toggle-row" style="display:block">
          <span class="sn-muted" id="sec-safebrowse-key-managed" style="display:block"></span>
        </div>
      </div>

      <div class="sn-toggle-row" style="margin-top:16px">
        <label>
          <input type="checkbox" id="sec-auto-feedback" />
          <span id="sec-auto-feedback-label"></span>
        </label>
        <span class="sn-muted" id="sec-auto-feedback-desc"></span>
      </div>

      <section id="sec-cookies" style="margin-top:28px">
        <h2 id="sec-cookies-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <p class="sn-muted" id="sec-cookies-desc" style="margin-top:0"></p>

        <div class="sn-cookie-modes" role="radiogroup" aria-labelledby="sec-cookies-title">
          <label class="sn-cookie-mode">
            <input type="radio" name="cookie-mode" id="cookie-mode-manual" value="manual" />
            <span>
              <span class="sn-cookie-mode-label" id="cookie-mode-manual-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="cookie-mode-manual-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="cookie-mode" id="cookie-mode-default" value="default" />
            <span>
              <span class="sn-cookie-mode-label" id="cookie-mode-default-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="cookie-mode-default-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="cookie-mode" id="cookie-mode-privacy" value="privacy" />
            <span>
              <span class="sn-cookie-mode-label" id="cookie-mode-privacy-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="cookie-mode-privacy-desc"></span>
            </span>
          </label>
        </div>

        <div id="sec-cookies-whitelist" style="margin-top:18px">
          <div class="sn-info-box-title" id="sec-cookies-wl-title"></div>
          <div class="sn-muted" id="sec-cookies-wl-desc" style="margin-bottom:8px"></div>
          <div class="sn-muted" id="sec-cookies-trusted-note" style="margin-bottom:8px;display:none"></div>
          <div class="sn-cookie-wl-add" style="display:flex;gap:8px;margin-bottom:6px">
            <input type="text" id="cookie-wl-input" />
            <button type="button" class="sn-btn sn-btn-secondary" id="cookie-wl-add-btn"></button>
          </div>
          <div id="cookie-wl-error" role="alert" aria-live="polite" style="display:none;color:var(--sn-error);font-size:12px;margin-bottom:10px"></div>
          <ul id="cookie-wl-list" style="list-style:none;padding:0;margin:0"></ul>
        </div>
      </section>

      <section id="sec-fingerprint" style="margin-top:28px">
        <h2 id="sec-fp-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <p class="sn-muted" id="sec-fp-desc" style="margin-top:0"></p>

        <div class="sn-cookie-modes" role="radiogroup" aria-labelledby="sec-fp-title">
          <label class="sn-cookie-mode">
            <input type="radio" name="fp-mode" id="fp-mode-off" value="off" />
            <span>
              <span class="sn-cookie-mode-label" id="fp-mode-off-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="fp-mode-off-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="fp-mode" id="fp-mode-default" value="default" />
            <span>
              <span class="sn-cookie-mode-label" id="fp-mode-default-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="fp-mode-default-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="fp-mode" id="fp-mode-privacy" value="privacy" />
            <span>
              <span class="sn-cookie-mode-label" id="fp-mode-privacy-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="fp-mode-privacy-desc"></span>
            </span>
          </label>
        </div>
      </section>

      <section id="sec-clipboard" style="margin-top:28px">
        <h2 id="sec-clip-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <p class="sn-muted" id="sec-clip-desc" style="margin-top:0"></p>
        <div class="sn-muted" id="sec-clip-empty" style="display:none"></div>
        <div class="sn-clip-search" id="sec-clip-search-row" style="display:none">
          <input type="text" id="sec-clip-search" autocomplete="off" spellcheck="false">
        </div>
        <div id="sec-clip-list" class="sn-clip-list"></div>
        <div class="sn-muted sn-clip-noresults" id="sec-clip-noresults" style="display:none"></div>
        <div class="sn-clip-actions" id="sec-clip-actions">
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-clip-clear"></button>
          <span class="sn-saved-indicator" id="sec-clip-hint"></span>
        </div>
      </section>

      <div class="sn-toggle-row" id="sec-export-row" style="margin-top:28px">
        <div>
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-export-btn"></button>
          <span class="sn-muted" id="sec-export-desc" style="display:block;margin-top:6px"></span>
        </div>
        <span class="sn-saved-indicator" id="sec-export-hint"></span>
      </div>

      <div class="sn-toggle-row" id="sec-import-row" style="margin-top:18px">
        <div>
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-import-btn"></button>
          <span class="sn-muted" id="sec-import-desc" style="display:block;margin-top:6px"></span>
        </div>
        <span class="sn-saved-indicator" id="sec-import-hint"></span>
      </div>
    </section>

    <span id="savedHint" class="sn-saved-indicator"></span>
  </main>

  <script src="security.js"></script>
</body>
</html>
