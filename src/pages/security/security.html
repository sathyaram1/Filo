<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Sicurezza</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/storage.js"></script>
</head>
<body>
  <main class="sn-page" id="page">
    <h1 id="title"></h1>

    <section id="sec-security">
      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-protect-ip" />
          <span id="sec-protect-ip-label"></span>
        </label>
        <span class="sn-muted" id="sec-protect-ip-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-block-popups" />
          <span id="sec-block-popups-label"></span>
        </label>
        <span class="sn-muted" id="sec-block-popups-desc"></span>
      </div>

      <div class="sn-info-box" id="sec-p2p-box">
        <div class="sn-info-box-title" id="sec-p2p-box-title"></div>
        <div id="sec-p2p-box-body"></div>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-safebrowse" />
          <span id="sec-safebrowse-label"></span>
        </label>
        <span class="sn-muted" id="sec-safebrowse-desc"></span>
      </div>

      <div id="sec-safebrowse-sub" style="margin-left:26px">
        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-network" />
            <span id="sec-safebrowse-network-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-network-desc"></span>
        </div>

        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-llm" />
            <span id="sec-safebrowse-llm-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-llm-desc"></span>
        </div>

        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-sandbox" />
            <span id="sec-safebrowse-sandbox-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-sandbox-desc"></span>
        </div>

        <div class="sn-toggle-row" style="display:block">
          <span class="sn-muted" id="sec-safebrowse-key-managed" style="display:block"></span>
        </div>
      </div>

      <div class="sn-toggle-row" id="sec-export-row">
        <div>
          <button type="button" id="sec-export-btn"></button>
          <span class="sn-muted" id="sec-export-desc" style="display:block;margin-top:6px"></span>
        </div>
        <span class="sn-saved-indicator" id="sec-export-hint"></span>
      </div>
    </section>

    <span id="savedHint" class="sn-saved-indicator"></span>
  </main>

  <script src="security.js"></script>
</body>
</html>
