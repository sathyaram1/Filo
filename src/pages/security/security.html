<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Sicurezza</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/politicaModelli.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/contenutoEsterno.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <!-- #256 — cronologia appunti: chiave di una voce, etichetta e testo della
       conferma, gli stessi che usa il menu "Incolla" del tasto destro. -->
  <script src="filo://shared/clipboardHistory.js"></script>
  <!-- Icone di Filo: serve il ripiego dell'immagine copiata che non si riesce a
       disegnare, lo stesso che usa il menu "Incolla". -->
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/nomiSito.js"></script>
  <!-- #876 — «stesso sito» con la Public Suffix List: i siti fidati si salvano come li usa Filo. -->
  <script src="filo://shared/pslIcann.js"></script>
  <script src="filo://src/vendor/public-suffix-list/privata.js"></script>
  <script src="filo://shared/stessoSito.js"></script>
  <script src="filo://shared/dominiGoogle.js"></script>
  <script src="filo://shared/eseguibili.js"></script>
  <script src="filo://shared/confirmUi.js"></script>
  <script src="filo://shared/caselleAlSicuro.js"></script>
  <script src="filo://shared/vociImpostazioni.js"></script>
</head>
<body>
  <main class="sn-page" id="page">
    <h1 id="title"></h1>

    <section id="sec-security">
      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-protect-ip" />
          <span id="sec-protect-ip-label"></span>
        </label>
        <span class="sn-muted" id="sec-protect-ip-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-block-popups" />
          <span id="sec-block-popups-label"></span>
        </label>
        <span class="sn-muted" id="sec-block-popups-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-adblock" />
          <span id="sec-adblock-label"></span>
        </label>
        <span class="sn-muted" id="sec-adblock-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-adskip" />
          <span id="sec-adskip-label"></span>
        </label>
        <span class="sn-muted" id="sec-adskip-desc"></span>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-siteblock" />
          <span id="sec-siteblock-label"></span>
        </label>
        <span class="sn-muted" id="sec-siteblock-desc"></span>
        <div id="sec-siteblock-sub" style="margin-top: 8px;">
          <label style="display: block; margin-bottom: 6px;">
            <input type="checkbox" id="sec-siteblock-lists" />
            <span id="sec-siteblock-lists-label"></span>
          </label>
          <label class="sn-muted" id="sec-siteblock-blacklist-label" for="sec-siteblock-blacklist" style="display: block; margin-bottom: 4px;"></label>
          <textarea id="sec-siteblock-blacklist" rows="4" spellcheck="false" style="width: 100%;"></textarea>
          <div id="sec-siteblock-blacklist-error" role="alert" aria-live="polite" style="display:none;color:var(--sn-error);font-size:12px;margin-top:6px"></div>
        </div>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-dl-exe" />
          <span id="sec-dl-exe-label"></span>
        </label>
        <span class="sn-muted" id="sec-dl-exe-desc"></span>
        <div id="sec-dl-exe-sub" style="margin-top: 8px;">
          <label class="sn-muted" id="sec-dl-trusted-label" for="sec-dl-trusted" style="display: block; margin-bottom: 4px;"></label>
          <textarea id="sec-dl-trusted" rows="3" spellcheck="false" style="width: 100%;"></textarea>
          <div id="sec-dl-trusted-error" role="alert" aria-live="polite" style="display:none;color:var(--sn-error);font-size:12px;margin-top:6px;white-space:pre-line"></div>
        </div>
      </div>

      <div class="sn-info-box" id="sec-p2p-box">
        <div class="sn-info-box-title" id="sec-p2p-box-title"></div>
        <div id="sec-p2p-box-body"></div>
      </div>

      <div class="sn-info-box" id="sec-proxy-box" hidden>
        <div class="sn-info-box-title" id="sec-proxy-box-title"></div>
        <div id="sec-proxy-box-body"></div>
        <div class="sn-muted" id="sec-proxy-box-provider" style="margin-top:8px" hidden></div>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-safebrowse" />
          <span id="sec-safebrowse-label"></span>
        </label>
        <span class="sn-muted" id="sec-safebrowse-desc"></span>
      </div>

      <div id="sec-safebrowse-sub" style="margin-left:26px">
        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-network" />
            <span id="sec-safebrowse-network-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-network-desc"></span>
        </div>

        <div class="sn-toggle-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-llm" />
            <span id="sec-safebrowse-llm-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-llm-desc"></span>
        </div>

        <div class="sn-toggle-row" id="sec-safebrowse-sandbox-row">
          <label>
            <input type="checkbox" id="sec-safebrowse-sandbox" />
            <span id="sec-safebrowse-sandbox-label"></span>
          </label>
          <span class="sn-muted" id="sec-safebrowse-sandbox-desc"></span>
        </div>

        <div class="sn-toggle-row" style="display:block">
          <span class="sn-muted" id="sec-safebrowse-key-managed" style="display:block"></span>
        </div>
      </div>

      <div id="sec-safebrowse-fidati" style="margin:14px 0 0 26px" hidden>
        <div class="sn-info-box-title" id="sec-safebrowse-fidati-title"></div>
        <div class="sn-muted" id="sec-safebrowse-fidati-desc" style="margin-bottom:8px"></div>
        <ul id="sec-safebrowse-fidati-list" style="list-style:none;padding:0;margin:0"></ul>
      </div>

      <div class="sn-toggle-row" style="margin-top:16px">
        <label>
          <input type="checkbox" id="sec-delicate" />
          <span id="sec-delicate-label"></span>
        </label>
        <span class="sn-muted" id="sec-delicate-desc"></span>
        <div id="sec-delicate-sub" style="margin-top: 8px; margin-left: 24px;">
          <label class="sn-muted" id="sec-delicate-sites-label" for="sec-delicate-sites" style="display: block; margin-bottom: 4px;"></label>
          <textarea id="sec-delicate-sites" rows="3" spellcheck="false" style="width: 100%;"></textarea>
          <div id="sec-delicate-sites-error" role="alert" aria-live="polite" style="display:none;color:var(--sn-error);font-size:12px;margin-top:6px"></div>
          <div id="sec-delicate-campi" style="margin-top:12px" hidden>
            <div class="sn-muted" id="sec-delicate-campi-title" style="margin-bottom:4px"></div>
            <ul id="sec-delicate-campi-list" style="list-style:none;padding:0;margin:0"></ul>
          </div>
        </div>
      </div>

      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="sec-auto-feedback" />
          <span id="sec-auto-feedback-label"></span>
        </label>
        <span class="sn-muted" id="sec-auto-feedback-desc"></span>
      </div>

      <section id="sec-cookies" style="margin-top:28px">
        <h2 id="sec-cookies-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <p class="sn-muted" id="sec-cookies-desc" style="margin-top:0"></p>

        <div class="sn-cookie-modes" role="radiogroup" aria-labelledby="sec-cookies-title">
          <label class="sn-cookie-mode">
            <input type="radio" name="cookie-mode" id="cookie-mode-manual" value="manual" />
            <span>
              <span class="sn-cookie-mode-label" id="cookie-mode-manual-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="cookie-mode-manual-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="cookie-mode" id="cookie-mode-default" value="default" />
            <span>
              <span class="sn-cookie-mode-label" id="cookie-mode-default-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="cookie-mode-default-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="cookie-mode" id="cookie-mode-privacy" value="privacy" />
            <span>
              <span class="sn-cookie-mode-label" id="cookie-mode-privacy-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="cookie-mode-privacy-desc"></span>
            </span>
          </label>
        </div>

        <div class="sn-toggle-row" id="sec-riquadri-modello-row" style="margin-top:14px">
          <label>
            <input type="checkbox" id="sec-riquadri-modello" />
            <span id="sec-riquadri-modello-label"></span>
          </label>
          <span class="sn-muted" id="sec-riquadri-modello-desc"></span>
        </div>

        <div id="sec-cookies-whitelist" style="margin-top:18px">
          <div class="sn-info-box-title" id="sec-cookies-wl-title"></div>
          <div class="sn-muted" id="sec-cookies-wl-desc" style="margin-bottom:8px"></div>
          <div class="sn-muted" id="sec-cookies-trusted-note" style="margin-bottom:8px;display:none"></div>
          <div class="sn-cookie-wl-add" style="display:flex;gap:8px;margin-bottom:6px">
            <input type="text" id="cookie-wl-input" />
            <button type="button" class="sn-btn sn-btn-secondary" id="cookie-wl-add-btn"></button>
          </div>
          <div id="cookie-wl-error" role="alert" aria-live="polite" style="display:none;color:var(--sn-error);font-size:12px;margin-bottom:10px"></div>
          <ul id="cookie-wl-list" style="list-style:none;padding:0;margin:0"></ul>
        </div>

        <div id="sec-cookies-banners" style="margin-top:18px" hidden>
          <div class="sn-info-box-title" id="sec-cookies-banners-title"></div>
          <ul id="cookie-banners-list" style="list-style:none;padding:0;margin:0"></ul>
        </div>

        <div id="sec-cookies-accessi" style="margin-top:18px" hidden>
          <div class="sn-info-box-title" id="sec-cookies-accessi-title"></div>
          <div class="sn-muted" id="sec-cookies-accessi-desc" style="margin-bottom:8px"></div>
          <ul id="cookie-accessi-list" style="list-style:none;padding:0;margin:0"></ul>
        </div>

        <div id="sec-cookies-riquadri" style="margin-top:18px" hidden>
          <div class="sn-info-box-title" id="sec-cookies-riquadri-title"></div>
          <div class="sn-muted" id="sec-cookies-riquadri-desc" style="margin-bottom:8px"></div>
          <ul id="cookie-riquadri-list" style="list-style:none;padding:0;margin:0"></ul>
        </div>

        <div id="sec-cookies-done" style="margin-top:18px" hidden>
          <div class="sn-info-box-title" id="sec-cookies-done-title"></div>
          <ul id="cookie-done-list" style="list-style:none;padding:0;margin:0"></ul>
        </div>
      </section>

      <section id="sec-fingerprint" style="margin-top:28px">
        <h2 id="sec-fp-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <p class="sn-muted" id="sec-fp-desc" style="margin-top:0"></p>

        <div class="sn-cookie-modes" role="radiogroup" aria-labelledby="sec-fp-title">
          <label class="sn-cookie-mode">
            <input type="radio" name="fp-mode" id="fp-mode-off" value="off" />
            <span>
              <span class="sn-cookie-mode-label" id="fp-mode-off-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="fp-mode-off-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="fp-mode" id="fp-mode-default" value="default" />
            <span>
              <span class="sn-cookie-mode-label" id="fp-mode-default-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="fp-mode-default-desc"></span>
            </span>
          </label>
          <label class="sn-cookie-mode">
            <input type="radio" name="fp-mode" id="fp-mode-privacy" value="privacy" />
            <span>
              <span class="sn-cookie-mode-label" id="fp-mode-privacy-label"></span>
              <span class="sn-muted sn-cookie-mode-desc" id="fp-mode-privacy-desc"></span>
            </span>
          </label>
        </div>
      </section>

      <section id="sec-site-perms" style="margin-top:28px">
        <h2 id="sec-site-perms-title" style="font-size:1.05rem;margin-bottom:8px"></h2>
        <ul id="sec-perm-list" style="list-style:none;padding:0;margin:0"></ul>
      </section>

      <section id="sec-visite" style="margin-top:28px">
        <h2 id="sec-visite-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <span class="sn-muted" id="sec-visite-desc" style="display:block;margin-bottom:10px"></span>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-visite-ora" data-periodo="ultima_ora"></button>
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-visite-oggi" data-periodo="oggi"></button>
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-visite-tutto" data-periodo="tutto"></button>
          <span class="sn-saved-indicator" id="sec-visite-hint"></span>
        </div>
      </section>

      <section id="sec-clipboard" style="margin-top:28px">
        <h2 id="sec-clip-title" style="font-size:1.05rem;margin-bottom:4px"></h2>
        <p class="sn-muted" id="sec-clip-desc" style="margin-top:0"></p>
        <div class="sn-muted" id="sec-clip-empty" style="display:none"></div>
        <div class="sn-clip-search" id="sec-clip-search-row" style="display:none">
          <input type="text" id="sec-clip-search" autocomplete="off" spellcheck="false">
        </div>
        <div id="sec-clip-list" class="sn-clip-list"></div>
        <div class="sn-muted sn-clip-noresults" id="sec-clip-noresults" style="display:none"></div>
        <!-- Voci copiate col puntatore sulla lista: aspettano qui, SOTTO e mai sopra,
             perché una riga in cima sposterebbe quelle sotto la mano. -->
        <div class="sn-muted sn-clip-pending" id="sec-clip-pending" style="display:none"></div>
        <div class="sn-clip-actions" id="sec-clip-actions">
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-clip-clear"></button>
          <span class="sn-saved-indicator" id="sec-clip-hint"></span>
        </div>
      </section>

      <div class="sn-toggle-row" id="sec-export-row" style="margin-top:28px">
        <div>
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-export-btn"></button>
          <span class="sn-muted" id="sec-export-desc" style="display:block;margin-top:6px"></span>
        </div>
        <span class="sn-saved-indicator" id="sec-export-hint"></span>
      </div>
      <!-- #905: senza la spunta l'archivio esce senza chiavi; la riga c'è solo se ci sono chiavi da portare. -->
      <div class="sn-toggle-row" id="sec-export-keys-row" hidden>
        <label><input type="checkbox" id="sec-export-keys"><span id="sec-export-keys-label"></span></label>
        <span class="sn-muted" id="sec-export-keys-desc"></span>
      </div>

      <div class="sn-toggle-row" id="sec-import-row" style="margin-top:18px">
        <div>
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-import-btn"></button>
          <span class="sn-muted" id="sec-import-desc" style="display:block;margin-top:6px"></span>
        </div>
        <span class="sn-saved-indicator" id="sec-import-hint"></span>
      </div>

      <!-- #850: la conferma sta sotto il tasto, aperta da lui; cosa sparisce e la parola scritta prima del sì. -->
      <div class="sn-toggle-row" id="sec-wipe-row" style="margin-top:18px">
        <div>
          <button type="button" class="sn-btn sn-btn-danger" id="sec-wipe-btn" aria-expanded="false" aria-controls="sec-wipe-box"></button>
          <span class="sn-muted" id="sec-wipe-desc" style="display:block;margin-top:6px"></span>
        </div>
      </div>
      <div class="sn-info-box sn-wipe-box" id="sec-wipe-box" role="group" aria-labelledby="sec-wipe-btn" hidden>
        <p class="sn-wipe-par" id="sec-wipe-export-text"></p>
        <div class="sn-row">
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-wipe-export"></button>
          <span class="sn-saved-indicator" id="sec-wipe-export-hint"></span>
        </div>
        <div class="sn-toggle-row" id="sec-wipe-export-keys-row" hidden>
          <label><input type="checkbox" id="sec-wipe-export-keys"><span id="sec-wipe-export-keys-label"></span></label>
          <span class="sn-muted" id="sec-wipe-export-keys-desc"></span>
        </div>
        <div class="sn-info-box-title sn-wipe-title" id="sec-wipe-list-title"></div>
        <p class="sn-wipe-par" id="sec-wipe-list"></p>
        <p class="sn-wipe-par sn-muted" id="sec-wipe-server"></p>
        <div class="sn-toggle-row" id="sec-wipe-identity-row" hidden>
          <label><input type="checkbox" id="sec-wipe-identity"><span id="sec-wipe-identity-label"></span></label>
          <span class="sn-muted" id="sec-wipe-identity-desc"></span>
        </div>
        <label class="sn-wipe-word-label" for="sec-wipe-word" id="sec-wipe-word-label"></label>
        <input type="text" id="sec-wipe-word" class="sn-wipe-word" autocomplete="off" spellcheck="false">
        <div class="sn-row sn-wipe-actions">
          <button type="button" class="sn-btn sn-btn-secondary" id="sec-wipe-cancel"></button>
          <button type="button" class="sn-btn sn-btn-danger" id="sec-wipe-go" disabled></button>
        </div>
        <span class="sn-saved-indicator sn-wipe-hint" id="sec-wipe-hint" role="status"></span>
      </div>
    </section>

    <span id="savedHint" class="sn-saved-indicator"></span>
  </main>

  <script src="security.js"></script>
</body>
</html>
