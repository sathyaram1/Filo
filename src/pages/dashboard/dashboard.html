<!DOCTYPE html>
<html lang="it" data-sn-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Nuova scheda</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/aestheticRefiner.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/urlNav.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/filoMarkdown.js"></script>
  <script src="filo://shared/timeFormat.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/confirmUi.js"></script>
  <script src="filo://shared/filoMemory.js"></script>
  <script src="filo://shared/filoState.js"></script>
</head>
<body data-state="home">
  <!-- Controlli del browser spostati dentro la home (la barra in alto di Filo è
       stata tolta): home, impostazioni, app e profilo, in alto a destra. Ogni
       icona aziona il comando reale della shell via MSG.SHELL_ACTION. -->
  <nav class="dash-controls" id="dashControls" aria-label="Controlli Filo"></nav>
  <main class="dash" id="dash">
    <!-- Le fusioni in attesa del via libera dell'owner NON vivono più qui:
         stanno in cima ai Ricevuti della dashboard di gestione, insieme alle
         altre cose che aspettano una sua decisione (scelta owner 2026-08-26). -->

    <!-- Left column: suggested actions -->
    <aside class="dash-left" id="left">
      <ul class="dash-suggestions" id="suggestions"></ul>
      <button class="dash-expand-btn" id="expandBtn" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
        <span>Mostra tutti</span>
      </button>
    </aside>

    <!-- Center: home message OR conversation -->
    <section class="dash-center" id="center">
      <!-- Home state -->
      <div class="dash-home" id="homeView">
        <p class="dash-home-msg" id="homeMessage">…</p>
      </div>

      <!-- Conversation state -->
      <div class="dash-thread" id="threadView" hidden>
        <div class="dash-bubbles" id="bubbles" role="log" aria-live="polite"></div>
      </div>
    </section>

    <!-- Right column: live state -->
    <aside class="dash-right" id="right">
      <div class="dash-live" id="live"></div>
    </aside>

    <!-- Input bar -->
    <form class="dash-input-wrap" id="inputForm" autocomplete="off">
      <div class="dash-dir" id="dashDir" hidden></div>
      <div class="dash-img-previews" id="imgPreviews" hidden></div>
      <textarea
        class="dash-input"
        id="input"
        rows="1"
        placeholder="Chiedi qualsiasi cosa…"
        autofocus
        aria-label="Scrivi a Filo"
      ></textarea>
      <button class="dash-send" id="sendBtn" type="submit" aria-label="Invia">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12l14-7-4 14-3-6-7-1z"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
