<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Crediti</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <link rel="stylesheet" href="credits.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/icons.js"></script>
  <script src="filo://shared/storage.js"></script>
</head>
<body>
  <main class="sn-page">
    <h1 id="title">Crediti</h1>

    <section class="sn-credits-hero">
      <span class="sn-credits-coin" id="coin"></span>
      <div class="sn-credits-balance">
        <span class="sn-credits-amount" id="balance">—</span>
        <span class="sn-credits-unit">crediti</span>
      </div>
    </section>

    <p class="sn-muted" id="refillHint">Ricevi +100 crediti ogni giorno a mezzanotte.</p>
    <p class="sn-muted" id="offlineHint" hidden>
      Accedi col tuo account per sincronizzare i crediti su tutti i dispositivi.
    </p>

    <!-- Crediti sul server (#598): si entra con un codice d'invito. Finché non
         c'è un portafoglio si vede il campo; dopo, i propri codici da dare. -->
    <section class="sn-wallet" id="wallet" hidden>
      <form class="sn-wallet-redeem" id="redeemForm" autocomplete="off" hidden>
        <label for="inviteCode">Hai un codice d’invito?</label>
        <div class="sn-wallet-redeem-row">
          <input type="text" id="inviteCode" maxlength="16" placeholder="ABCD-EFGH" autocomplete="off" spellcheck="false" />
          <button type="submit" class="sn-btn" id="redeemBtn">Riscatta</button>
        </div>
        <p class="sn-wallet-msg" id="redeemMsg" role="status" hidden></p>
      </form>
      <p class="sn-muted sn-wallet-note" id="walletNote" role="status" hidden></p>
      <section id="invitesSection" hidden>
        <h2>I tuoi inviti</h2>
        <ul id="invites" class="sn-wallet-invites"></ul>
      </section>
    </section>

    <section class="sn-credits-usage" id="usageSection" hidden>
      <h2>Come hai usato i crediti</h2>
      <div class="sn-credits-chart-row">
        <svg id="chart" class="sn-credits-chart" viewBox="0 0 220 220" aria-hidden="true"></svg>
        <ul id="legend" class="sn-credits-legend"></ul>
      </div>
    </section>

    <p class="sn-muted" id="usageEmpty" hidden>Non hai ancora consumato crediti.</p>

    <section class="sn-credits-moves" id="movesSection" hidden>
      <h2>Movimenti recenti</h2>
      <ul id="moves" class="sn-credits-moves-list"></ul>
    </section>
  </main>

  <script src="credits.js"></script>
</body>
</html>
