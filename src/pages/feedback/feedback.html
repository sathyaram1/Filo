<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Feedback alpha</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/feedback.js"></script>
  <style>
    .fb-list { display: flex; flex-direction: column; gap: 16px; }
    .fb-card {
      border: 1px solid var(--sn-border);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--sn-overlay-bg);
    }
    .fb-meta { font-size: 11px; color: var(--sn-muted); margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
    .fb-meta a { color: inherit; text-decoration: underline; }
    .fb-text { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.5; }
    .fb-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .fb-imgs img { max-width: 220px; max-height: 220px; border: 1px solid var(--sn-border); border-radius: 6px; cursor: zoom-in; object-fit: cover; }
    .fb-empty { color: var(--sn-muted); text-align: center; padding: 60px 0; }
    .fb-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .fb-search { flex: 1; }
    .fb-count { font-size: 12px; color: var(--sn-muted); }
    .fb-lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out; z-index: 100;
    }
    .fb-lightbox img { max-width: 95vw; max-height: 95vh; }
    .fb-lightbox.open { display: flex; }
    .fb-actions { margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px; }
    .fb-card--done { opacity: 0.65; }
    .fb-notes-label { display: block; margin-top: 10px; font-size: 12px; color: var(--sn-muted); }
    .fb-notes { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; font: inherit; font-size: 13px; background: var(--sn-bg, transparent); color: inherit; border: 1px solid var(--sn-border); border-radius: 6px; resize: vertical; }
    .fb-notes-readonly { margin-top: 8px; padding: 6px 10px; font-size: 13px; border-left: 2px solid var(--sn-border); color: var(--sn-muted); white-space: pre-wrap; }
    .fb-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--sn-border); }
    .fb-tab {
      background: transparent; border: 0; padding: 8px 14px;
      color: var(--sn-muted); cursor: pointer; font: inherit;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .fb-tab--active { color: var(--sn-text, inherit); border-bottom-color: currentColor; }
  </style>
</head>
<body>
  <main class="sn-page">
    <h1>Feedback alpha</h1>
    <p class="sn-muted">Tutti i feedback inviati dagli alpha tester.</p>

    <div class="fb-tabs" id="tabs">
      <button type="button" class="fb-tab fb-tab--active" data-tab="inbox">Ricevuti</button>
      <button type="button" class="fb-tab" data-tab="draft">Bozze</button>
      <button type="button" class="fb-tab" data-tab="todo">Da risolvere</button>
      <button type="button" class="fb-tab" data-tab="done">Risolti</button>
      <button type="button" class="fb-tab" data-tab="verified">Verificati</button>
    </div>

    <div class="fb-toolbar">
      <input type="search" id="search" class="fb-search" placeholder="Cerca per testo, URL, clientId…" />
      <button class="sn-btn sn-btn-secondary" id="refresh">Aggiorna</button>
      <span class="fb-count" id="count"></span>
    </div>

    <div id="list" class="fb-list"></div>
    <div id="empty" class="fb-empty" hidden>Nessun feedback ricevuto.</div>
  </main>

  <div class="fb-lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

  <script src="feedback.js"></script>
</body>
</html>
