<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Feedback alpha</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/feedback.js"></script>
  <script src="filo://shared/feedbackThread.js"></script>
  <script src="filo://shared/chatErrors.js"></script>
  <style>
    .fb-list { display: flex; flex-direction: column; gap: 16px; }
    .fb-card {
      border: 1px solid var(--sn-border);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--sn-overlay-bg);
    }
    .fb-meta { font-size: 11px; color: var(--sn-muted); margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
    .fb-meta a { color: inherit; text-decoration: underline; }
    .fb-text { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.5; }
    .fb-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .fb-imgs img { max-width: 220px; max-height: 220px; border: 1px solid var(--sn-border); border-radius: 6px; cursor: zoom-in; object-fit: cover; }
    /* Segnaposto mentre il main decifra l'allegato (S1.2). */
    .fb-imgs img.fb-img-loading {
      width: 140px; height: 100px; object-fit: contain; cursor: default;
      background: var(--sn-surface-2, rgba(127,127,127,.08));
      animation: fbImgPulse 1.2s ease-in-out infinite;
    }
    @keyframes fbImgPulse { 0%,100% { opacity: .55; } 50% { opacity: .85; } }
    .fb-img-broken {
      width: 220px; height: 80px;
      border: 1px dashed var(--sn-border); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--sn-muted); font-size: 12px; font-style: italic;
    }
    .fb-files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .fb-file {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 240px; padding: 6px 10px;
      border: 1px solid var(--sn-border); border-radius: 6px;
      background: var(--sn-bg); color: inherit; text-decoration: none;
      font-size: 12px;
    }
    .fb-file:hover { border-color: var(--sn-accent, var(--sn-border)); }
    .fb-file svg { flex: 0 0 auto; color: var(--sn-muted); }
    .fb-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-empty { color: var(--sn-muted); text-align: center; padding: 60px 0; }
    /* Stato d'errore del caricamento: frase per l'utente (mai il messaggio grezzo
       dell'eccezione) + un modo per riprovare, invece di "Errore: Failed to fetch". */
    .fb-load-error-msg { margin: 0 auto 14px; max-width: 420px; color: var(--sn-fg); font-size: 14px; line-height: 1.5; }
    .fb-load-retry {
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--sn-border); border-radius: 8px; padding: 7px 14px;
      background: var(--sn-card, transparent); color: var(--sn-fg);
    }
    .fb-load-retry:hover { border-color: var(--sn-accent); }
    .fb-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .fb-search { flex: 1; }
    .fb-count { font-size: 12px; color: var(--sn-muted); }
    .fb-lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out; z-index: 100;
    }
    .fb-lightbox img { max-width: 95vw; max-height: 95vh; }
    .fb-lightbox.open { display: flex; }
    .fb-actions { margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px; }
    .fb-card--done { opacity: 0.65; }
    .fb-notes-label { display: block; margin-top: 10px; font-size: 12px; color: var(--sn-muted); }
    .fb-notes { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; font: inherit; font-size: 13px; background: var(--sn-bg, transparent); color: inherit; border: 1px solid var(--sn-border); border-radius: 6px; resize: vertical; }
    .fb-usernote-label { display: block; margin-top: 10px; font-size: 12px; color: var(--sn-muted); }
    .fb-usernote { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; font: inherit; font-size: 13px; background: var(--sn-bg, transparent); color: inherit; border: 1px solid var(--sn-border); border-radius: 6px; }
    .fb-notes-readonly { margin-top: 8px; padding: 6px 10px; font-size: 13px; border-left: 2px solid var(--sn-border); color: var(--sn-muted); white-space: pre-wrap; }
    /* Conversazione a turni (#108): segnalazione, risposte di Filo e risposte
       dell'utente in BOLLE diverse invece che in un unico blocco di note. */
    .fb-thread { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .fb-bubble {
      max-width: 88%; padding: 8px 12px; border-radius: 12px;
      border: 1px solid var(--sn-border); background: var(--sn-bg, transparent);
    }
    .fb-bubble-head {
      display: flex; gap: 8px; align-items: baseline;
      font-size: 11px; color: var(--sn-muted); margin-bottom: 3px;
    }
    .fb-bubble-who { font-weight: 600; }
    .fb-bubble-body { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.5; }
    /* La segnalazione iniziale è il "soggetto" della card: piena larghezza. */
    .fb-bubble--report { max-width: 100%; }
    /* Filo (modello) a sinistra, neutra; l'utente a destra, tinta d'accento. */
    .fb-bubble--model { align-self: flex-start; border-bottom-left-radius: 4px; }
    .fb-bubble--user {
      align-self: flex-end; border-bottom-right-radius: 4px;
      background: color-mix(in srgb, var(--sn-accent) 12%, var(--sn-bg, transparent));
      border-color: color-mix(in srgb, var(--sn-accent) 32%, var(--sn-border));
    }
    .fb-bubble--report.fb-bubble--user { align-self: stretch; }
    /* Tinta della bolla-segnalazione per ORIGINE del feedback (vedi legenda
       card più sotto). Più specifica di --model/--user, così vince sul tint
       neutro/accento di default: arancione = tester esterno, verde = invio
       dell'owner, blu = audit di una routine, accento = agente esploratore. */
    .fb-bubble--report.fb-bubble--origin-user {
      background: color-mix(in srgb, #e08e0b 12%, var(--sn-bg, transparent));
      border-color: color-mix(in srgb, #e08e0b 34%, var(--sn-border));
    }
    .fb-bubble--report.fb-bubble--origin-owner {
      background: color-mix(in srgb, #2e9e5b 13%, var(--sn-bg, transparent));
      border-color: color-mix(in srgb, #2e9e5b 36%, var(--sn-border));
    }
    .fb-bubble--report.fb-bubble--origin-routine {
      background: color-mix(in srgb, #5b6ee0 12%, var(--sn-bg, transparent));
      border-color: color-mix(in srgb, #5b6ee0 34%, var(--sn-border));
    }
    .fb-bubble--report.fb-bubble--origin-agent {
      background: color-mix(in srgb, var(--sn-accent) 10%, var(--sn-bg, transparent));
      border-color: color-mix(in srgb, var(--sn-accent) 32%, var(--sn-border));
    }
    /* Sessione locale di Claude (viola): senza una tinta sua ricadrebbe sul
       neutro e sembrerebbe una segnalazione senza provenienza. */
    .fb-bubble--report.fb-bubble--origin-local {
      background: color-mix(in srgb, #8b5cd6 12%, var(--sn-bg, transparent));
      border-color: color-mix(in srgb, #8b5cd6 34%, var(--sn-border));
    }
    /* Le immagini/allegati vivono dentro la bolla della segnalazione. */
    .fb-bubble .fb-imgs, .fb-bubble .fb-files { margin-top: 8px; }
    /* Composer "Rispondi" del tab Chiarimenti (e riapertura): stesso look. */
    .fb-reply { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .fb-reply-text {
      width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; font-size: 13px;
      background: var(--sn-bg, transparent); color: inherit; border: 1px solid var(--sn-border);
      border-radius: 6px; resize: vertical;
    }
    .fb-reply-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    /* Compositore allegati nei commenti (#190.3): incolla/trascina/allega
       immagini e file mentre si scrive una nota/risposta. Gli allegati si
       ancorano al turno (vivono come marcatori dentro le note). */
    .fb-attach-mount { margin-top: 6px; }
    .fb-attach-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
    .fb-attach-thumbs:not(:empty) { margin-bottom: 6px; }
    .fb-attach-thumb { position: relative; }
    .fb-attach-thumb img {
      width: 64px; height: 64px; object-fit: cover;
      border: 1px solid var(--sn-border); border-radius: 6px; cursor: zoom-in; display: block;
    }
    .fb-attach-chip {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 220px; padding: 5px 8px; padding-right: 24px; position: relative;
      border: 1px solid var(--sn-border); border-radius: 6px;
      background: var(--sn-bg, transparent); font-size: 12px;
    }
    .fb-attach-ic { display: inline-flex; color: var(--sn-muted); flex: 0 0 auto; }
    .fb-attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fb-attach-x {
      position: absolute; top: -7px; right: -7px;
      width: 18px; height: 18px; padding: 0; line-height: 16px;
      border-radius: 50%; border: 1px solid var(--sn-border);
      background: var(--sn-bg, #fff); color: var(--sn-text, inherit);
      cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
    }
    .fb-attach-chip .fb-attach-x { top: 50%; right: 4px; transform: translateY(-50%); }
    .fb-attach-x:hover { border-color: var(--sn-accent); color: var(--sn-accent); }
    .fb-attach-bar { display: flex; align-items: center; gap: 10px; }
    .fb-attach-btn { padding: 4px 10px; font-size: 12px; }
    .fb-attach-status { font-size: 12px; color: var(--sn-muted); }
    /* Feedback visivo quando si trascina un file sopra una textarea-composer. */
    .fb-drop-hover { outline: 2px dashed var(--sn-accent); outline-offset: -2px; }
    .fb-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--sn-border); }
    .fb-tab {
      background: transparent; border: 0; padding: 8px 14px;
      color: var(--sn-muted); cursor: pointer; font: inherit;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .fb-tab--active { color: var(--sn-text, inherit); border-bottom-color: currentColor; }
    .fb-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .fb-num { color: var(--sn-muted); font-weight: 600; }
    .fb-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .fb-badge {
      font-size: 11px; padding: 1px 7px; border-radius: 999px;
      border: 1px solid var(--sn-border); color: var(--sn-muted);
    }
    .fb-badge--model { color: var(--sn-accent); border-color: var(--sn-accent); }
    .fb-badge--high { background: #c0392b; color: #fff; border-color: #c0392b; }
    .fb-badge--medium { background: #e08e0b; color: #fff; border-color: #e08e0b; }
    .fb-badge--low { color: var(--sn-muted); }
    /* "In lavorazione": una routine ha preso in carico il feedback (semaforo). */
    .fb-claim {
      font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
      background: #e08e0b22; color: #b9770a; border: 1px solid #e08e0b88;
    }
    /* Badge col branch git del fix in attesa di verifica (stati review/blocked). */
    .fb-branch {
      font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #6e7bd622; color: #4a57c0; border: 1px solid #6e7bd688;
    }
    .fb-card--agent { border-left: 3px solid var(--sn-accent); }
    /* Bordo a sinistra colorato per ORIGINE del feedback, leggibile a colpo
       d'occhio in ogni tab. Legenda: arancione = alpha tester esterno, verde =
       invio manuale dell'owner (admin loggato), blu = audit automatico di una
       routine cloud, accento = agente esploratore LLM. Le regole d'origine
       seguono .fb-card--agent così, a parità di specificità, vincono (una card
       d'audit-routine resta blu invece dell'accento). */
    .fb-card--origin-user { border-left: 3px solid #e08e0b; }
    .fb-card--origin-owner { border-left: 3px solid #2e9e5b; }
    .fb-card--origin-routine { border-left: 3px solid #5b6ee0; }
    .fb-card--origin-agent { border-left: 3px solid var(--sn-accent); }
    .fb-reopen-form { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .fb-reopen-text { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; font-size: 13px; background: var(--sn-bg, transparent); color: inherit; border: 1px solid var(--sn-border); border-radius: 6px; resize: vertical; }
    .fb-reopen-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .fb-priority { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }
    .fb-dot {
      width: 13px; height: 13px; padding: 0; border-radius: 50%;
      border: 1px solid var(--sn-muted); background: transparent;
      cursor: pointer; box-sizing: border-box; transition: background 0.1s, border-color 0.1s;
    }
    .fb-dot:hover { border-color: var(--sn-accent); }
    .fb-dot--on { background: var(--sn-accent); border-color: var(--sn-accent); }
    /* Pallini in sola lettura (utente non admin): nessun puntatore/hover. */
    .fb-dot--readonly { cursor: default; }
    .fb-dot--readonly:hover { border-color: var(--sn-muted); }
    .fb-admin-banner {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; padding: 10px 14px;
      border: 1px solid var(--sn-border); border-radius: 8px;
      background: var(--sn-overlay-bg); font-size: 13px; color: var(--sn-muted);
    }
    .fb-admin-banner button { margin-left: auto; }
    /* `display: flex` qui sopra vince sull'attributo `hidden` (regola UA
       [hidden]{display:none}, meno specifica di una regola d'autore): senza
       questa riga il banner "sola lettura" restava visibile ANCHE per gli
       admin, che lo vedevano pur potendo gestire i feedback. */
    .fb-admin-banner[hidden] { display: none; }
    /* Box dell'interruttore automazione (owner-only): stesso contorno morbido
       del banner admin, così si legge come "zona proprietario". */
    .fb-automation {
      margin-bottom: 16px; padding: 4px 14px 12px;
      border: 1px solid var(--sn-border); border-radius: 8px;
      background: var(--sn-overlay-bg);
    }
    .fb-automation[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="sn-page">
    <h1>Feedback alpha</h1>
    <p class="sn-muted">Tutti i feedback inviati dagli alpha tester.</p>

    <div class="fb-admin-banner" id="adminBanner" hidden>
      <span id="adminBannerText">Sei in sola lettura. Accedi con un account amministratore per gestire i feedback (spostare di stato, priorità, note).</span>
      <button type="button" class="sn-btn" id="adminSignIn">Accedi</button>
    </div>

    <!-- Interruttore master dell'auto-miglioramento (owner-only). Visibile solo
         agli admin (lo smaschera feedback.js). Default OFF = autonomia spenta:
         ogni feedback, anche sicuro, passa da te. Vedi filo-security DESIGN §2. -->
    <div class="fb-automation" id="automationRow" hidden>
      <div class="sn-toggle-row">
        <label>
          <input type="checkbox" id="automationToggle" />
          <span>Gestione automatica dei feedback</span>
        </label>
        <span class="sn-muted" id="automationDesc"></span>
      </div>
    </div>

    <div class="fb-tabs" id="tabs">
      <button type="button" class="fb-tab fb-tab--active" data-tab="inbox">Ricevuti</button>
      <button type="button" class="fb-tab" data-tab="agent">Agente</button>
      <button type="button" class="fb-tab" data-tab="draft">Bozze</button>
      <button type="button" class="fb-tab" data-tab="todo">Da risolvere</button>
      <button type="button" class="fb-tab" data-tab="review">In revisione</button>
      <button type="button" class="fb-tab" data-tab="blocked">Bloccati</button>
      <button type="button" class="fb-tab" data-tab="clarify">Chiarimenti</button>
      <button type="button" class="fb-tab" data-tab="done">Risolti</button>
      <button type="button" class="fb-tab" data-tab="verified">Verificati</button>
    </div>

    <div class="fb-toolbar">
      <input type="search" id="search" class="fb-search" placeholder="Cerca per testo, URL, clientId…" />
      <button class="sn-btn sn-btn-secondary" id="refresh">Aggiorna</button>
      <span class="fb-count" id="count"></span>
    </div>

    <div id="list" class="fb-list"></div>
    <div id="empty" class="fb-empty" hidden>Nessun feedback ricevuto.</div>
  </main>

  <div class="fb-lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

  <script src="feedback.js"></script>
</body>
</html>
