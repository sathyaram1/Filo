<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Modelli predefiniti</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/modelCaps.js"></script>
  <script src="filo://shared/modelUsage.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/comboBox.js"></script>
  <script src="filo://shared/modelChainEditor.js"></script>
</head>
<body>
  <main class="sn-page" id="page">
    <h1 id="title"></h1>

    <!-- Mostrato se l'utente non è admin (DEFAULTS_GET ritorna !ok). -->
    <section id="sec-denied" hidden>
      <p class="sn-muted" id="denied-msg"></p>
    </section>

    <div id="editor" hidden>
      <p class="sn-muted" id="intro"></p>

      <section id="sec-keys">
        <h2 id="h-keys"></h2>
        <p class="sn-muted" id="keys-desc"></p>

        <label for="apiKey">OpenRouter API key <span class="sn-muted" id="apiKey-state"></span></label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" />


        <label for="apiKeyTavily" style="margin-top: 12px;">Tavily API key <span class="sn-muted" id="apiKeyTavily-state"></span></label>
        <input type="password" id="apiKeyTavily" placeholder="tvly-..." autocomplete="off" />

        <label for="apiKeySafebrowse" style="margin-top: 12px;" id="apiKeySafebrowse-label">Google Safe Browsing API key <span class="sn-muted" id="apiKeySafebrowse-state"></span></label>
        <input type="password" id="apiKeySafebrowse" placeholder="AIza..." autocomplete="off" />
        <p class="sn-muted" id="apiKeySafebrowse-desc" style="margin-top: 4px;"></p>
      </section>

      <section id="sec-model-registry">
        <h2 id="h-model-registry"></h2>
        <p class="sn-muted" id="model-registry-desc"></p>
        <div id="modelRegistryList"></div>
        <div class="sn-row" style="margin-top: 10px;">
          <button class="sn-btn sn-btn-secondary" id="addModelRow" type="button"></button>
        </div>
        <!-- Combobox per la "stringa modello": una datalist per provider,
             popolata dal main con le chiavi predefinite (la pagina non le vede). -->
        <datalist id="models-list-openrouter"></datalist>
      </section>

      <section id="sec-models">
        <h2 id="h-models"></h2>
        <p class="sn-muted" id="models-desc"></p>
        <div class="sn-grid-2" id="modelsGrid"></div>
        <datalist id="nicknames-list"></datalist>
      </section>

      <section id="sec-excluded">
        <h2 id="h-excluded"></h2>
        <p class="sn-muted" id="excluded-desc"></p>
        <div id="excludedList"></div>
        <div class="sn-row" style="margin-top: 10px;">
          <button class="sn-btn sn-btn-secondary" id="addExcludedRow" type="button"></button>
        </div>
        <!-- Compare solo se questa lista NON copre voci escluse dal codice:
             la lista salvata qui sostituisce quella di build, e senza avviso
             un'esclusione aggiunta col codice resterebbe lettera morta. -->
        <div class="sn-info-box" id="excludedDrift" hidden>
          <div class="sn-info-box-title" id="excludedDriftTitle"></div>
          <p id="excludedDriftText" style="margin: 0 0 8px;"></p>
          <button class="sn-btn sn-btn-secondary" id="excludedDriftFix" type="button"></button>
        </div>
      </section>

      <div class="sn-toolbar" style="margin-top: 24px;">
        <button class="sn-btn" id="saveBtn" type="button"></button>
        <span id="saveStatus" class="sn-muted"></span>
      </div>
    </div>
  </main>

  <script src="admin-defaults.js"></script>
</body>
</html>
