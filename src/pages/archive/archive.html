<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Filo — Cronologia</title>
  <link rel="icon" href="filo://asset/icons/icon-32.png" />
  <link rel="stylesheet" href="filo://style/theme.css" />
  <link rel="stylesheet" href="filo://style/pages.css" />
  <script src="filo://shared/themeTokens.js"></script>
  <script src="filo://shared/pageBootstrap.js"></script>
  <script src="filo://shared/constants.js"></script>
  <script src="filo://shared/messages.js"></script>
  <script src="filo://shared/i18n.js"></script>
  <script src="filo://shared/storage.js"></script>
  <script src="filo://shared/confirmUi.js"></script>
  <style>
    /* §3.3 — la cronologia come "diario visivo": UN giorno per RIGA (mai a capo),
       dentro ogni giorno le schede in ordine cromatico rese come le tab in alto —
       sfondo tinto col colore identità del sito, larghezza variabile che riempie
       tutta la riga; se sono troppe per starci al minimo la riga SCORRE in
       orizzontale (come la barra delle tab) invece di andare a capo. Le azioni
       (riapri/elimina) stanno nel menu contestuale (tasto destro), non in bottoni
       sempre visibili — coerente con l'estetica minimale. */
    .arc-day { margin: 22px 0 8px; }
    .arc-day-label {
      font-size: 13px; font-weight: 600; color: var(--sn-muted);
      text-transform: capitalize; padding-bottom: 6px;
      border-bottom: 1px solid var(--sn-border);
    }
    /* Una sola riga per giorno: niente wrap. Le chip crescono (flex:1) per
       riempire la larghezza; quando sono troppe scorrono in orizzontale —
       stessa logica della barra delle tab in alto (rotellina verticale →
       scroll orizzontale, vedi archive.js). A differenza della barra chrome in
       alto qui la scrollbar NON è nascosta: la Cronologia è una pagina che si
       consulta, non un elemento di chrome sempre presente, quindi lasciamo la
       scrollbar sottile globale (theme.css) come affordance trascinabile col
       mouse — compare solo quando c'è davvero overflow (overflow-x:auto). */
    .arc-tabs {
      display: flex; flex-wrap: nowrap; gap: 3px; margin-top: 10px;
      overflow-x: auto; overflow-y: hidden;
      padding-bottom: 2px;
    }
    .arc-tab {
      display: inline-flex; align-items: center; gap: 7px;
      /* Larghezza variabile che sfrutta tutta la riga (nessun max-width qui:
         poche schede si allargano fino a riempire lo spazio disponibile). Il
         min-width tiene la chip LEGGIBILE anche quando sono tante: sotto questa
         soglia il titolo si riduceva a una sola lettera ("S…"). Oltre la
         soglia la riga scorre invece di comprimere ancora. */
      flex: 1 1 0; min-width: 132px;
      padding: 7px 12px; border-radius: var(--sn-radius);
      border: 1px solid color-mix(in srgb, var(--arc-color, var(--sn-border)) 40%, var(--sn-border));
      /* Sfondo = tinta identità del sito (attenuata, calcolata in JS) mescolata
         al neutro di superficie, come le tab in alto (§1.2). Le schede senza
         colore ricadono sul solo neutro. */
      background: color-mix(in srgb, var(--arc-tint, var(--sn-hover)) 55%, var(--sn-hover));
      color: var(--sn-fg);
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .arc-tab:hover, .arc-tab:focus-visible {
      background: color-mix(in srgb, var(--arc-tint, var(--sn-hover)) 55%, var(--sn-bg));
    }
    .arc-tab:focus-visible { outline: 2px solid var(--sn-accent); outline-offset: 1px; }
    /* Risultati della ricerca semantica: lista piatta ordinata per pertinenza →
       chip compatte che vanno a capo (non una riga infinita da scorrere). */
    .arc-results { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .arc-results .arc-tab { flex: 0 0 auto; max-width: 320px; }
    .arc-fav {
      width: 14px; height: 14px; flex: 0 0 14px; border-radius: 3px;
      background-size: cover; background-position: center;
      background-color: var(--arc-color, var(--sn-border));
    }
    .arc-title {
      font-size: 13px; color: var(--sn-fg);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .arc-score {
      font-size: 10px; color: var(--sn-muted); flex: 0 0 auto;
    }
    /* Menu contestuale (tasto destro): stesse classi .sn-select-pop/-option del
       resto di Filo, ma posizionato "fixed" alle coordinate del click (non
       ancorato a un host relative come i dropdown normali) — resetta
       right/top ereditati da .sn-select-pop, che JS imposta esplicitamente. */
    .arc-ctxmenu { position: fixed; right: auto; top: auto; min-width: 140px; }
  </style>
</head>
<body>
  <main class="sn-page">
    <h1>Cronologia</h1>

    <div class="sn-toolbar">
      <input type="search" id="search" placeholder="Cerca… (Invio = cerca nei contenuti)" />
      <button class="sn-btn" id="semantic">🔎 Cerca nei contenuti</button>
      <button class="sn-btn sn-btn-secondary" id="clear">Svuota archivio</button>
      <button class="sn-btn sn-btn-secondary" id="openHistory">Cronologia AI</button>
    </div>
    <p id="searchNote" class="sn-muted" style="margin:-6px 0 12px;" hidden></p>

    <div id="list"></div>
    <div id="empty" class="sn-empty" hidden>Nessuna tab archiviata, per ora.</div>
  </main>

  <script src="archive.js"></script>
</body>
</html>
