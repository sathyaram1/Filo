# Gli unit sul risultato della fusione di un ramo con main, chiesti dal server (#1207): il server legge l'esito di questa
# corsa per la coppia di commit e solo con quello porta il lavoro a L5 e alla fusione. Esegue il codice di un ramo che
# può venire da un feedback non fidato: niente segreti, token in sola lettura, nessuna credenziale lasciata nei checkout.
# Garanzie: tests/unit/unitFusioneAzione.test.mjs.

name: Unit sulla fusione

# repository_dispatch accende solo la versione di questo file che sta su main: un ramo non la cambia per la propria corsa.
on:
  repository_dispatch:
    types: [unit-fusione]

# Il server cerca la corsa da questo titolo; i due sha interi li conferma la riga dell'esito.
run-name: unit-fusione ${{ github.event.client_payload.corsa }}

permissions:
  contents: read

# Linux e Windows provano la coppia in parallelo e passano l'esito a `unit`, l'unico lavoro che scrive la riga per il
# server (#2225): un rosso solo di Windows nasceva su main e fermava la pubblicazione.
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      campo: ${{ steps.prova.outputs.campo }}
    # La coppia arriva solo come variabile: dentro `run:` un'espressione diventerebbe codice della shell.
    env:
      GIT_TERMINAL_PROMPT: '0'
      RAMO: ${{ github.event.client_payload.ramo }}
      MAIN: ${{ github.event.client_payload.main }}
    steps:
      - name: La coppia da provare
        run: |
          if [[ ! "$RAMO" =~ ^[0-9a-f]{40}$ || ! "$MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "coppia non valida: servono due sha interi"
            exit 2
          fi

      # Reporter e decisione vengono da main, il commit di questa corsa: il ramo provato non li sceglie.
      - name: Strumenti di main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: strumenti
          persist-credentials: false

      - name: Il ramo, con la storia di main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMO }}
          path: prova
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Le dipendenze del ramo, come la macchina che provava prima: un ramo che ne aggiunge una non esce rosso per quello.
      - name: Dipendenze del ramo
        working-directory: prova
        run: node ../strumenti/scripts/npm-ci-ritenta.mjs

      - name: Unit sulla fusione
        id: prova
        run: node strumenti/scripts/unit-fusione-azione.mjs --root prova --ramo "$RAMO" --main "$MAIN" --parte linux --unit tutti

  # Di default solo gli unit che il ramo tocca (pochi minuti, dentro la corsa Linux); `tutti` costa una ventina di
  # minuti di cancello in più, `spento` toglie la parte. Lo sceglie il server nella richiesta.
  windows:
    if: github.event.client_payload.windows != 'spento'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      campo: ${{ steps.prova.outputs.campo }}
    env:
      GIT_TERMINAL_PROMPT: '0'
      RAMO: ${{ github.event.client_payload.ramo }}
      MAIN: ${{ github.event.client_payload.main }}
      MODO: ${{ github.event.client_payload.windows }}
    steps:
      - name: La coppia da provare
        run: |
          if [[ ! "$RAMO" =~ ^[0-9a-f]{40}$ || ! "$MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "coppia non valida: servono due sha interi"
            exit 2
          fi

      - name: Strumenti di main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: strumenti
          persist-credentials: false

      - name: Il ramo, con la storia di main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RAMO }}
          path: prova
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dipendenze del ramo
        working-directory: prova
        run: node ../strumenti/scripts/npm-ci-ritenta.mjs

      - name: Unit sulla fusione su Windows
        id: prova
        run: node strumenti/scripts/unit-fusione-azione.mjs --root prova --ramo "$RAMO" --main "$MAIN" --parte windows --unit "$MODO"

  # Gira anche con una parte caduta: senza riga il server riaccenderebbe la corsa invece di leggere perché.
  unit:
    needs: [linux, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAMO: ${{ github.event.client_payload.ramo }}
      MAIN: ${{ github.event.client_payload.main }}
      CAMPO_LINUX: ${{ needs.linux.outputs.campo }}
      RISULTATO_LINUX: ${{ needs.linux.result }}
      CAMPO_WINDOWS: ${{ needs.windows.outputs.campo }}
      RISULTATO_WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Strumenti di main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: strumenti
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: L'esito per il server
        run: node strumenti/scripts/unit-fusione-azione.mjs --unisci linux,windows --ramo "$RAMO" --main "$MAIN"
