# Le prove importanti, la catena degli aggiornamenti e gli unit test su Windows, a ogni fusione su main: la pubblicazione
# (release.yml) prende il commit più nuovo con questa corsa verde (#2501). Su main un rosso apre il suo feedback.
# Garanzie: tests/unit/releaseSuite.test.mjs e, per i segreti, tests/unit/catenaPubblicazione.test.mjs.

name: Prove importanti

on:
  push:
    branches: [main]
  # Per provare un ramo: gh workflow run importanti.yml --ref <ramo>
  workflow_dispatch:

# Una corsa partita finisce; le fusioni arrivate intanto si raccolgono nell'ultima in attesa.
concurrency:
  group: importanti-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # I cammini principali su un avvio solo, come nel contenitore delle routine: rossi anche sopra il tetto di durata.
  importanti:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del commit da provare
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        run: node scripts/npm-ci-ritenta.mjs

      - name: Binario di Electron
        run: node scripts/ensure-electron.mjs

      - name: Schermo virtuale (xvfb)
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      - name: Prove importanti
        id: prove
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a node scripts/test-importanti.mjs --chiavi chiavi-importanti.txt --reporter=list 2>&1 | tee importanti.log

      - name: Rossi delle prove importanti come annotazioni
        if: always() && steps.prove.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          grep -E '✘|DURATA SOPRA|Error:|Prove importanti:' importanti.log > importanti-rossi.txt 2>/dev/null || tail -n 40 importanti.log > importanti-rossi.txt
          node scripts/annotazioni-github.mjs importanti-rossi.txt "Prove importanti rosse"

      - name: Conserva registro e chiavi (7 giorni)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: importanti-registro
          path: |
            importanti.log
            chiavi-importanti.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Prove importanti rosse - la corsa resta rossa
        if: always() && !cancelled() && (steps.prove.outcome == 'failure' || failure())
        shell: bash
        run: |
          echo "::error::Prove importanti rosse (o sopra il tetto di durata) su ${GITHUB_REF}. Su main il commit non verra pubblicato, e il feedback lo apre il lavoro avviso."
          exit 1

  # La catena intera degli aggiornamenti non sta nel tetto delle prove importanti: gira qui, prima della pubblicazione.
  aggiornamenti:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout del commit da provare
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        run: node scripts/npm-ci-ritenta.mjs

      - name: Binario di Electron
        run: node scripts/ensure-electron.mjs

      - name: Schermo virtuale (xvfb)
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      - name: Catena degli aggiornamenti
        id: catena
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a node scripts/test-importanti.mjs --catena --chiavi chiavi-catena.txt --reporter=list 2>&1 | tee catena.log

      - name: Rossi della catena come annotazioni
        if: always() && steps.catena.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          grep -E '✘|Error:|Catena degli aggiornamenti:' catena.log > catena-rossi.txt 2>/dev/null || tail -n 40 catena.log > catena-rossi.txt
          node scripts/annotazioni-github.mjs catena-rossi.txt "Catena degli aggiornamenti rossa"

      - name: Conserva registro e chiavi (7 giorni)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: catena-registro
          path: |
            catena.log
            chiavi-catena.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Catena rossa - la corsa resta rossa
        if: always() && !cancelled() && (steps.catena.outcome == 'failure' || failure())
        shell: bash
        run: |
          echo "::error::Catena degli aggiornamenti rossa su ${GITHUB_REF}. Su main il commit non verra pubblicato, e il feedback lo apre il lavoro avviso."
          exit 1

  # Il cancello di pubblicazione (release.yml) rifà gli unit test su Windows: un commit rosso lì non uscirà mai, quindi
  # non è verde nemmeno qui. Senza, la pubblicazione sceglieva un verde che il cancello rifiutava a ogni giro (#1184).
  # Niente `if:` né `continue-on-error` sul lavoro: saltato o tollerato, la corsa sarebbe verde senza averlo passato.
  unit-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout del commit da provare (con la storia, come il cancello di pubblicazione)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        shell: bash
        run: node scripts/npm-ci-ritenta.mjs

      # Lo stesso comando del cancello di pubblicazione, sulla stessa macchina. Senza la riprova dei rossi un flaky
      # buttava un verde, che arriva di rado.
      - name: Unit test su Windows
        id: unit
        continue-on-error: true
        shell: bash
        run: node scripts/unit-con-riprova.mjs --registro unit.log

      # Dalla cloud il registro non si scarica, le annotazioni sì.
      - name: Unit rossi come annotazioni
        if: always() && steps.unit.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          grep -E '^[[:space:]]*(not ok|location:)' unit.log > unit-rossi.txt 2>/dev/null || true
          if [ -s unit-rossi.txt ]; then node scripts/annotazioni-github.mjs unit-rossi.txt "Unit rossi su Windows"
          else
            # Nessun caso rosso: la corsa si è fermata prima (lanciatore caduto, tetto). Il perché sta in coda al registro.
            tail -n 60 unit.log > unit-coda.txt 2>/dev/null || true
            [ -s unit-coda.txt ] || echo "Nessun registro degli unit: il lanciatore non e partito." > unit-coda.txt
            node scripts/annotazioni-github.mjs unit-coda.txt "Unit senza esito su Windows (coda del registro)"
          fi

      # Su main lo legge `avviso`, che apre il feedback su un'altra macchina.
      - name: Conserva il registro degli unit (7 giorni)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-windows-registro
          path: unit.log
          if-no-files-found: warn
          retention-days: 7

      # Rosso su main e sui rami: su main il feedback lo apre `avviso`. I rossi in coda al registro: in mezzo a
      # trentamila righe non li trova nessuno.
      - name: Unit rossi su Windows - la corsa resta rossa
        if: always() && !cancelled() && (steps.unit.outcome == 'failure' || failure())
        shell: bash
        run: |
          echo "::error::Unit test rossi su Windows (o non partiti) su ${GITHUB_REF}. Su main il commit non verra pubblicato, e il feedback lo apre il lavoro avviso."
          grep -E '^[[:space:]]*(not ok|location:)' unit.log 2>/dev/null | head -80 || echo "(nessuna riga not ok: gli unit non sono partiti, guarda i passi sopra)"
          exit 1

  # Gli unit rossi rifatti su Windows sulla punta di main: una fusione arrivata intanto può averli già corretti, e il
  # feedback chiederebbe un lavoro fatto (#2148, come il cancello di pubblicazione per #1185). Qui gira il codice della
  # punta: niente segreti. Senza esito (lavoro rosso, registro assente) l'avviso apre come prima.
  unit-windows-punta:
    needs: [unit-windows]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.unit-windows.result == 'failure'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      punta: ${{ steps.rifai.outputs.punta }}
      gia_verdi: ${{ steps.rifai.outputs.gia_verdi }}
      tutti: ${{ steps.rifai.outputs.tutti }}
    steps:
      # Con la storia intera, come la prima corsa: in una copia corta un unit che legge la storia si salta e passa.
      - name: Checkout della punta di main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Punta di main
        id: punta
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Main fermo sul commit provato: i rossi sono già stati rifatti una volta dalla riprova, qui non c'è niente di nuovo.
      - name: Setup Node
        if: steps.punta.outputs.sha != github.sha
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        if: steps.punta.outputs.sha != github.sha
        shell: bash
        run: node scripts/npm-ci-ritenta.mjs

      - name: Registro degli unit del commit provato
        if: steps.punta.outputs.sha != github.sha
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-windows-registro
          path: esiti-unit

      - name: Rifai i rossi sulla punta
        id: rifai
        if: steps.punta.outputs.sha != github.sha
        continue-on-error: true
        env:
          PUNTA: ${{ steps.punta.outputs.sha }}
        shell: bash
        run: |
          if [ ! -s esiti-unit/unit.log ]; then echo "Nessun registro degli unit: niente da rifare."; exit 0; fi
          if VERDI=$(node scripts/rossi-sulla-punta.mjs esiti-unit/unit.log); then TUTTI=true; else TUTTI=false; fi
          { echo "punta=$PUNTA"; echo "gia_verdi=$(echo $VERDI)"; echo "tutti=$TUTTI"; } >> "$GITHUB_OUTPUT"

  # I feedback dei rossi su main, in un lavoro a parte: la parola della costruzione sta solo qui, nell'ambiente fisso,
  # lontano da npm ci e dalle prove (gli strumenti dell'avviso usano solo moduli di Node). Su un ramo il lavoro si salta
  # prima di arrivare all'ambiente, che lo respingerebbe (#1504).
  avviso:
    needs: [importanti, aggiornamenti, unit-windows, unit-windows-punta]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.importanti.result != 'success' || needs.aggiornamenti.result != 'success' || needs.unit-windows.result != 'success')
    runs-on: ubuntu-latest
    environment: rilascio
    timeout-minutes: 20
    # Dalla cloud delle routine gli artifact non si scaricano (#2313): il feedback dice la strada che passa.
    env:
      REGISTRI_DALLA_CLOUD: "Dalla cloud delle routine gli artifact di questa esecuzione non si scaricano (il loro indirizzo di scaricamento sta fuori dalla rete delle routine); i registri dei lavori si: gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs elenca i lavori col loro id, gh api repos/${{ github.repository }}/actions/jobs/<id>/logs stampa il registro intero di uno."
    steps:
      - name: Checkout del commit provato (con la storia, per l'elenco dei commit dell'avviso)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registro delle prove importanti
        if: always() && !cancelled() && needs.importanti.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: importanti-registro
          path: esiti-importanti

      - name: Registro della catena degli aggiornamenti
        if: always() && !cancelled() && needs.aggiornamenti.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: catena-registro
          path: esiti-catena

      # Una chiave per guasto (prove rosse, durata, catena): lo stesso rosso su due fusioni apre un feedback solo.
      - name: Prove importanti rosse su main - apri un feedback
        if: always() && !cancelled() && (needs.importanti.result != 'success' || needs.aggiornamenti.result != 'success')
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_PROVATO: ${{ github.sha }}
        shell: bash
        run: |
          PREMESSA="Le prove importanti (i cammini principali di Filo, npm run test:importanti, e la catena intera degli aggiornamenti) sono rosse su questo commit del ramo principale, o hanno passato il tetto di durata di quattro minuti: il commit NON verra pubblicato, e la pubblicazione resta sull ultimo commit con le prove importanti verdi. Capisci quale modifica le ha rotte (i commit entrati dopo l ultimo verde sono elencati sotto) e sistemala. Se il rosso e la durata, accorcia il cammino lento: il tetto non si alza, e l elenco dei cammini lo cambiano solo l owner e il manutentore. ${REGISTRI_DALLA_CLOUD} Esecuzione: ${ESECUZIONE}"
          CHIAVI=()
          for f in esiti-importanti/chiavi-importanti.txt esiti-catena/chiavi-catena.txt; do
            [ -s "$f" ] && while read -r k; do [ -n "$k" ] && CHIAVI+=(--chiave "$k"); done < "$f"
          done
          [ ${#CHIAVI[@]} -gt 0 ] || CHIAVI=(--chiave importanti:rosse)
          CODA_IMP=$(tail -c 3000 esiti-importanti/importanti.log 2>/dev/null || true)
          CODA_CAT=$(tail -c 3000 esiti-catena/catena.log 2>/dev/null || true)
          VERDE=$(node scripts/ultima-suite-verde.mjs --stampa 2>/dev/null || true)
          if [ -n "$VERDE" ]; then
            DOPO_VERDE="Commit entrati su main dopo l ultimo verde (${VERDE}):
          $(git log --first-parent --format='%h %s' "${VERDE}..HEAD" 2>/dev/null | head -40)"
          else
            DOPO_VERDE="Nessun commit verde su main fra le ultime cento corse riuscite: da quale commit parta il guasto non si sa da qui."
          fi
          TESTO="${PREMESSA}

          ${DOPO_VERDE}

          Coda delle prove importanti:
          ${CODA_IMP:-(verdi, o senza registro)}

          Coda della catena degli aggiornamenti:
          ${CODA_CAT:-(verde, o senza registro)}"
          node scripts/build-alarm.mjs "Prove importanti rosse su main: commit non pubblicabile" "$TESTO" "${CHIAVI[@]}" --commit "$COMMIT_PROVATO" || { echo "::error::Allarme delle prove importanti non consegnato: nessun feedback per questo rosso."; exit 1; }

      - name: Registro degli unit su Windows
        if: always() && !cancelled() && needs.unit-windows.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-windows-registro
          path: esiti-unit

      # Le chiavi sono quelle del cancello (`unit:<file>`): lo stesso rosso visto qui e là apre un feedback solo.
      - name: Unit rossi su Windows in main - apri un feedback
        if: always() && !cancelled() && needs.unit-windows.result != 'success'
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_PROVATO: ${{ github.sha }}
          PUNTA: ${{ needs.unit-windows-punta.outputs.punta }}
          GIA_VERDI: ${{ needs.unit-windows-punta.outputs.gia_verdi }}
          TUTTI_GIA_VERDI: ${{ needs.unit-windows-punta.outputs.tutti }}
        shell: bash
        run: |
          # Il commit resta non pubblicabile (la corsa e' rossa); il rosso che una fusione dopo non avesse corretto lo
          # riapre la corsa sulla punta.
          if [ "$TUTTI_GIA_VERDI" = "true" ]; then
            echo "::warning::Gli unit rossi su Windows di ${COMMIT_PROVATO:0:10} sono gia' verdi sulla punta di main (${PUNTA:0:10}): nessun feedback."
            { echo "## Unit rossi gia' corretti su main"; echo; echo "Rossi su ${COMMIT_PROVATO:0:10}, verdi su Windows sulla punta ${PUNTA:0:10}:"; printf -- '- %s\n' $GIA_VERDI; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SULLA_PUNTA=""
          if [ -n "$GIA_VERDI" ]; then
            SULLA_PUNTA="

          Gia verdi su Windows sulla punta di main (${PUNTA:0:10}), da non correggere: ${GIA_VERDI}"
          fi
          PREMESSA="Gli unit test, rifatti su Windows a ogni fusione sul ramo principale come li rifa il cancello di pubblicazione, sono rossi su questo commit anche rifatti una volta: il commit NON verra pubblicato, e la pubblicazione resta sull ultimo commit con le prove importanti e gli unit verdi finche un commit dopo questo non torna verde. Su Linux (contenitore delle routine, cancello di fusione) gli stessi test possono essere verdi: il rosso e di Windows (percorsi, fine riga, piattaforma presunta invece che iniettata, tempi). Capisci quale modifica li ha rotti (i commit entrati dopo l ultimo verde sono elencati sotto) e sistemala. Il registro del lavoro degli unit su Windows ha l errore di ogni rosso. ${REGISTRI_DALLA_CLOUD} Esecuzione: ${ESECUZIONE}"
          ROSSI_TUTTE=$(grep -E '^[[:space:]]*(not ok|location:)' esiti-unit/unit.log 2>/dev/null || true)
          ROSSI=$(printf '%s\n' "$ROSSI_TUTTE" | head -80)
          N_TUTTE=$(printf '%s\n' "$ROSSI_TUTTE" | grep -c . || true)
          if [ "${N_TUTTE:-0}" -gt 80 ]; then
            ROSSI="${ROSSI}
          … elenco tagliato: altre $((N_TUTTE - 80)) righe di test rossi stanno nel registro del lavoro degli unit su Windows"
          fi
          VERDE=$(node scripts/ultima-suite-verde.mjs --stampa 2>/dev/null || true)
          if [ -n "$VERDE" ]; then
            COMMIT_TUTTI=$(git log --first-parent --format='%h %s' "${VERDE}..HEAD" 2>/dev/null || true)
            COMMIT=$(printf '%s\n' "$COMMIT_TUTTI" | head -40)
            N_COMMIT=$(printf '%s\n' "$COMMIT_TUTTI" | grep -c . || true)
            if [ "${N_COMMIT:-0}" -gt 40 ]; then
              COMMIT="${COMMIT}
          … elenco tagliato: altri $((N_COMMIT - 40)) commit, git log --first-parent ${VERDE}..HEAD"
            fi
            DOPO_VERDE="Commit entrati su main dopo l ultimo verde (${VERDE}), ${N_COMMIT:-0}:
          ${COMMIT}"
          else
            DOPO_VERDE="Nessun commit verde su main fra le ultime cento corse riuscite: da quale commit parta il guasto non si sa da qui."
          fi
          if [ -s esiti-unit/unit.log ]; then
            CODA=$(tail -c 2500 esiti-unit/unit.log)
            CHIAVI=(--chiavi-unit esiti-unit/unit.log)
          else
            CODA="Gli unit test NON sono partiti: e rosso un passo prima di loro (di norma l installazione delle dipendenze con npm ci, che ritenta gia da sola per qualche minuto). Guarda il registro di questa esecuzione."
            CHIAVI=(--chiave unit-windows:non-partiti)
          fi
          TESTO="${PREMESSA}

          Test rossi (${N_TUTTE:-0} righe):
          ${ROSSI:-(nessuna riga not ok: guarda la coda)}${SULLA_PUNTA}


          ${DOPO_VERDE}


          ${CODA}"
          node scripts/build-alarm.mjs "Unit test rossi su Windows: commit non pubblicabile" "$TESTO" "${CHIAVI[@]}" --commit "$COMMIT_PROVATO" || { echo "::error::Allarme degli unit su Windows non consegnato: nessun feedback per questo rosso."; exit 1; }
