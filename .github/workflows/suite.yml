# La suite Playwright completa (in parti, poi un verdetto solo) a ogni fusione su main: registra quali prove sono rosse
# (righe [registro-suite] nel registro del verdetto, lette dal lavoro settimanale), ma non apre feedback né decide la
# pubblicazione (#2501, quella la decide importanti.yml). Verde su main: la versione di quel commit si segna «stabile».
# Garanzie: tests/unit/releaseSuite.test.mjs e, per i segreti, tests/unit/catenaPubblicazione.test.mjs.

name: Suite Playwright completa

on:
  push:
    branches: [main]
  # Per provare un ramo: gh workflow run suite.yml --ref <ramo>. Con `commit`, da main, prova quel commit di main:
  # la pubblicazione la chiede per la versione appena uscita, che la suite può aver saltato.
  workflow_dispatch:
    inputs:
      commit:
        description: "Lo sha intero di un commit di main da provare (vuoto: la punta del ramo)"
        required: false
        default: ""

# Una suite gia' partita finisce (una corsa annullata non dice niente di nessun
# commit); le fusioni arrivate intanto si raccolgono nell'ultima in attesa.
# Quella chiesta per una versione ha un gruppo suo: una fusione dopo non la scavalca.
concurrency:
  group: suite-${{ github.ref }}-${{ inputs.commit || 'fusioni' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Linux senza schermo come il contenitore delle routine, in quattro parti su macchine diverse: in fila la suite
  # passava il tetto del passo (200 minuti, #1485) e cresceva ancora. Una parte in più si aggiunge alla matrice,
  # a `--shard` e a `--parti` del verdetto insieme (tests/unit/releaseSuite.test.mjs li confronta).
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - name: Checkout del commit da provare (con la storia)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dipendenze
        run: node scripts/npm-ci-ritenta.mjs

      # Se un giorno `npm ci` non scaricasse Electron, la suite sarebbe «rossa» per un motivo non del codice.
      - name: Binario di Electron
        run: node scripts/ensure-electron.mjs

      - name: Schermo virtuale (xvfb)
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      # Il verdetto lo dà il lavoro dopo, non Playwright, rosso anche per i soli rossi noti. Tre tetti: quello di
      # Playwright (140 minuti) chiude la parte lasciando l'esito dei casi girati; quello del passo ferma un Electron
      # che non si chiude; quello del lavoro, più largo, lascia caricare l'esito.
      - name: Suite Playwright completa (una parte)
        id: suite
        continue-on-error: true
        timeout-minutes: 150
        shell: bash
        # FILO_COPERTURA: ogni prova registra quali funzioni di src/ fa eseguire, per la mappa prova → file (#2502).
        run: FILO_COPERTURA=copertura ELECTRON_DISABLE_SANDBOX=1 PLAYWRIGHT_BLOB_OUTPUT_NAME=parte-${{ matrix.parte }}.zip xvfb-run -a npx playwright test --shard=${{ matrix.parte }}/4 --global-timeout=8400000 --reporter=list,blob

      # Un lancio di Electron per caso scrive due file: qui diventano un record per prova, e la mappa la fa il verdetto.
      - name: Registrazioni della parte in un file
        if: always()
        continue-on-error: true
        run: node scripts/mappa-prove.mjs unisci --registrazioni copertura --out copertura-parte-${{ matrix.parte }}.json

      - name: Conserva le registrazioni della parte
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-copertura-${{ matrix.parte }}
          path: copertura-parte-${{ matrix.parte }}.json
          if-no-files-found: warn
          retention-days: 7

      # Un esito che non si carica non fa verde niente: il verdetto conta la parte come senza esito.
      - name: Conserva l'esito della parte
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-esito-${{ matrix.parte }}
          path: blob-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Conserva le tracce della parte (7 giorni)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-tracce-${{ matrix.parte }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Il verdetto non è «tutto verde»: i rossi d'ambiente di tests/rossi-noti.json (contenitore.specs) non contano, e
  # nemmeno un flaky ripassato. Gira anche con una parte rossa: è proprio allora che serve.
  verdetto:
    needs: suite
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del commit provato
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dipendenze
        run: node scripts/npm-ci-ritenta.mjs

      - name: Gli esiti delle parti
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-esito-*
          path: blob-report
          merge-multiple: true

      - name: Unisci gli esiti in un JSON solo
        continue-on-error: true
        shell: bash
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=suite-risultati.json npx playwright merge-reports --reporter=json blob-report

      - name: Le registrazioni delle parti
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: suite-copertura-*
          path: copertura
          merge-multiple: true

      # La mappa prova → file (#2502) va nel registro, righe [mappa-prove]: dalla cloud gli allegati non si scaricano,
      # il registro sì (node scripts/mappa-prove.mjs la legge da lì). Una mappa che non nasce non tocca il verdetto.
      - name: Mappa prova → file
        continue-on-error: true
        env:
          SUITE_COMMIT: ${{ inputs.commit || github.sha }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: node scripts/mappa-prove.mjs costruisci --registrazioni copertura --rapporto suite-risultati.json --commit "$SUITE_COMMIT" --corsa "$CORSA" --out mappa-prove.json

      # Uscita 0 nessun rosso nuovo, 1 rossi nuovi, 2 suite (o una sua parte) non arrivata in fondo: NON è un verde.
      # Le righe [registro-suite] del suo registro sono quello che legge scripts/rossi-della-suite.mjs.
      - name: Verdetto (rossi nuovi fuori dai rossi noti del contenitore)
        id: verdetto
        continue-on-error: true
        env:
          SUITE_COMMIT: ${{ inputs.commit || github.sha }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/suite-verdict.mjs suite-risultati.json --out rossi-nuovi.txt --chiavi chiavi-allarme.txt --parti 4 --esiti blob-report --errori rossi-errori.txt 2>&1 | tee verdetto.log

      # Dalla cloud registro e allegati non si scaricano: l'elenco si legge dalle annotazioni, con l'API.
      - name: Rossi nuovi come annotazioni
        if: always() && steps.verdetto.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          if [ -s rossi-nuovi.txt ]; then node scripts/annotazioni-github.mjs rossi-nuovi.txt "Rossi nuovi della suite"
          else node scripts/annotazioni-github.mjs verdetto.log "Suite senza esito"; fi

      # Un passo suo: GitHub tiene dieci annotazioni per passo, e l'elenco dei rossi le sue non le cede.
      - name: Errori dei rossi nuovi come annotazioni
        if: always() && steps.verdetto.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          if [ -s rossi-errori.txt ]; then node scripts/annotazioni-github.mjs rossi-errori.txt "Errori dei rossi nuovi"; fi

      - name: Conserva esito e verdetto (7 giorni)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-playwright-${{ github.run_id }}
          path: |
            suite-risultati.json
            rossi-nuovi.txt
            rossi-errori.txt
            verdetto.log
            chiavi-allarme.txt
            mappa-prove.json
          if-no-files-found: warn
          retention-days: 7

      # Il colore della corsa E' il verdetto, su main e sui rami: un rosso qui non apre feedback (lo raccoglie il
      # lavoro settimanale), ma una suite rossa non segna nessuna versione stabile. `failure()`: anche un passo rosso
      # prima del verdetto.
      - name: Rossi nuovi - la corsa resta rossa
        if: always() && !cancelled() && (steps.verdetto.outcome == 'failure' || failure())
        shell: bash
        run: |
          echo "::error::Suite Playwright con rossi nuovi (o non arrivata in fondo) su ${GITHUB_REF}: l'elenco sta nel verdetto qui sopra, gli errori nelle annotazioni. Nessun feedback: li raccoglie il lavoro settimanale (scripts/rossi-della-suite.mjs)."
          exit 1

  # Suite verde su main: la versione costruita da questo commit, se c'è, si segna «stabile». Se esce dopo, la segna la
  # pubblicazione stessa (release.yml) se la suite di quel commit è già verde, altrimenti chiede qui una corsa su di lui.
  stabile:
    needs: [suite, verdetto]
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.suite.result == 'success' && needs.verdetto.result == 'success'
    runs-on: ubuntu-latest
    environment: rilascio
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Lo strumento è quello di main, col token che scrive: il commit chiesto a mano entra solo come dato.
      - name: Checkout di main (coi tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Segna stabile la versione di questo commit
        env:
          GH_TOKEN: ${{ github.token }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVATO: ${{ inputs.commit || github.sha }}
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$PROVATO" HEAD 2>/dev/null; then
            echo "::error::$PROVATO non sta nella storia di main: non segno niente."
            exit 1
          fi
          node scripts/segna-stabile.mjs --commit "$PROVATO" --corsa "$CORSA"
