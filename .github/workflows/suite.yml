# La suite Playwright completa, a ogni fusione su main: il lavoro di pubblicazione (release.yml) pubblica solo un
# commit la cui corsa qui e' verde. Avviata a mano su un ramo prova quel ramo e non apre feedback.
# Garanzie: tests/unit/releaseSuite.test.mjs.

name: Suite Playwright completa

on:
  push:
    branches: [main]
  # Per provare un ramo: gh workflow run suite.yml --ref <ramo>
  workflow_dispatch:

# Una suite gia' partita finisce (una corsa annullata non dice niente di nessun
# commit); le fusioni arrivate intanto si raccolgono nell'ultima in attesa.
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Linux senza schermo come il contenitore delle routine; il verdetto non è «tutto verde»: i rossi
  # d'ambiente di tests/rossi-noti.json (contenitore.specs) non contano, e nemmeno un flaky ripassato.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout del commit da provare (con la storia, per l'elenco dei commit dell'avviso)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        run: npm ci

      # Se un giorno `npm ci` non scaricasse Electron, la suite sarebbe «rossa» per un motivo non del codice.
      - name: Binario di Electron
        run: node scripts/ensure-electron.mjs

      - name: Schermo virtuale (xvfb)
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      # Il verdetto lo dà lo script dopo, non Playwright, rosso anche per i soli rossi noti. Tetto SUO, sotto
      # quello del job: col solo tetto del job un Electron appeso annullava il job prima del verdetto, muto.
      - name: Suite Playwright completa
        id: suite
        continue-on-error: true
        timeout-minutes: 200
        shell: bash
        run: ELECTRON_DISABLE_SANDBOX=1 PLAYWRIGHT_JSON_OUTPUT_NAME=suite-risultati.json xvfb-run -a npx playwright test --reporter=list,json

      # Uscita 0 nessun rosso nuovo, 1 rossi nuovi, 2 suite non partita (che NON è un verde).
      - name: Verdetto (rossi nuovi fuori dai rossi noti del contenitore)
        id: verdetto
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/suite-verdict.mjs suite-risultati.json --out rossi-nuovi.txt --chiavi chiavi-allarme.txt 2>&1 | tee verdetto.log

      - name: Conserva esito e tracce (7 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-playwright-${{ github.run_id }}
          path: |
            suite-risultati.json
            rossi-nuovi.txt
            verdetto.log
            test-results/
          if-no-files-found: warn
          retention-days: 7

      # Solo main: un ramo non ferma nessuna pubblicazione. `failure()`: anche un passo rosso PRIMA della suite
      # deve diventare un feedback, o la pubblicazione si ferma in silenzio.
      - name: Rosso nuovo su main - apri un feedback
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && (steps.verdetto.outcome == 'failure' || failure())
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          echo "::error::Suite Playwright con rossi nuovi (o non partita): questo commit non verra pubblicato."
          PREMESSA="La suite Playwright completa, che gira a ogni fusione sul ramo principale, ha trovato dei rossi NUOVI su questo commit (fuori dai rossi noti del contenitore in tests/rossi-noti.json): questo commit NON verra pubblicato, e la pubblicazione resta sull ultimo commit con la suite verde finche un commit dopo questo non torna verde. Capisci quale modifica li ha rotti (i commit entrati dopo l ultima suite verde sono elencati sotto) e sistemala; se invece e un rosso d ambiente del contenitore senza schermo, aggiungilo a tests/rossi-noti.json (contenitore.specs) col titolo esatto del test, il motivo e questo feedback. Il JSON dei risultati e le tracce dei rossi (screenshot, trace) stanno nell artifact di questa esecuzione, per sette giorni: ${ESECUZIONE}"
          # L'elenco intero sta in rossi-nuovi.txt (allegato): qui un tetto, e il taglio si DICE col numero.
          ROSSI_TUTTE=$(cat rossi-nuovi.txt 2>/dev/null || true)
          ROSSI=$(printf '%s\n' "$ROSSI_TUTTE" | head -80)
          N_TUTTE=$(printf '%s\n' "$ROSSI_TUTTE" | grep -c . || true)
          if [ "${N_TUTTE:-0}" -gt 80 ]; then
            ROSSI="${ROSSI}
          … elenco tagliato: altri $((N_TUTTE - 80)) casi rossi stanno in rossi-nuovi.txt, nell'artifact di questa esecuzione (Actions)"
          fi
          # I sospetti: i commit entrati su main dopo l'ultima suite verde.
          VERDE=$(node scripts/ultima-suite-verde.mjs --stampa 2>/dev/null || true)
          if [ -n "$VERDE" ]; then
            COMMIT_TUTTI=$(git log --first-parent --format='%h %s' "${VERDE}..HEAD" 2>/dev/null || true)
            COMMIT=$(printf '%s\n' "$COMMIT_TUTTI" | head -40)
            N_COMMIT=$(printf '%s\n' "$COMMIT_TUTTI" | grep -c . || true)
            if [ "${N_COMMIT:-0}" -gt 40 ]; then
              COMMIT="${COMMIT}
          … elenco tagliato: altri $((N_COMMIT - 40)) commit, git log --first-parent ${VERDE}..HEAD"
            fi
            DOPO_VERDE="Commit entrati su main dopo l ultima suite verde (${VERDE}), ${N_COMMIT:-0}:
          ${COMMIT}"
          else
            DOPO_VERDE="Nessuna suite verde su main fra le ultime cento corse riuscite: da quale commit parta il guasto non si sa da qui."
          fi
          VERDETTO=$(tail -c 2500 verdetto.log 2>/dev/null || echo "(nessun verdetto: la suite non e partita)")
          if [ "$SUITE_OUTCOME" != "success" ] && [ "$SUITE_OUTCOME" != "failure" ]; then
            # La suite non e' nemmeno partita: e' rosso un passo prima di lei.
            VERDETTO="La suite NON e partita: e rosso uno dei passi che la preparano (l installazione delle dipendenze con npm ci, il binario di Electron, lo schermo virtuale xvfb). Non e un rosso del codice di Filo: guarda il registro di questa esecuzione (Actions), sistema quel passo (un lockfile fuori sincrono, un download che non arriva) e la prossima corsa riprova.
          ${VERDETTO}"
          elif [ ! -f suite-risultati.json ]; then
            VERDETTO="La suite non ha lasciato il JSON dei risultati: o non e partita, oppure ha superato il tetto del passo (200 minuti, di norma un Electron rimasto appeso) ed e stata interrotta prima della fine. Guarda il registro del passo Suite Playwright completa in questa esecuzione (Actions).
          ${VERDETTO}"
          fi
          TESTO="${PREMESSA}

          Rossi nuovi (${N_TUTTE:-0}):
          ${ROSSI:-(nessun caso elencato: la suite non e partita o non ha lasciato un esito leggibile; guarda il verdetto)}


          ${DOPO_VERDE}


          Verdetto:
          ${VERDETTO}"
          # Senza il file delle chiavi (verdetto mai partito) il guasto e' la suite che non parte.
          if [ -s chiavi-allarme.txt ]; then CHIAVI=(--chiavi-da chiavi-allarme.txt); else CHIAVI=(--chiave suite:non-partita); fi
          node scripts/build-alarm.mjs "Suite Playwright rossa su main: commit non pubblicabile" "$TESTO" "${CHIAVI[@]}" || echo "::warning::allarme non consegnato"
          exit 1

      # Il colore della corsa E' il verdetto: il lavoro di pubblicazione sceglie
      # solo commit con una corsa riuscita, quindi un rosso non deve mai finire verde.
      - name: Rosso nuovo su un ramo - la corsa resta rossa
        if: always() && !cancelled() && github.ref != 'refs/heads/main' && (steps.verdetto.outcome == 'failure' || failure())
        shell: bash
        run: |
          echo "::error::Suite Playwright con rossi nuovi (o non partita) su ${GITHUB_REF}: nessun feedback, l'elenco sta nel verdetto qui sopra e nell'artifact."
          exit 1
