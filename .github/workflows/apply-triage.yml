# Applica la coda di triage dei feedback a Firestore — in automatico.
#
# COSA FA
#   Le routine cloud non possono più scrivere su Firestore (l'account robot è
#   stato bloccato): depositano la decisione come file `feedback-triage/<id>.json`
#   e la pushano su `main`. Questo workflow si sveglia a OGNI push che tocca quei
#   file, esegue `scripts/apply-triage.mjs` autenticandosi come SERVICE ACCOUNT
#   (non un account Google personale → nessun rischio di blocco), patcha i
#   feedback su Firestore e committa la rimozione dei file applicati.
#
#   Risultato: l'owner NON deve più fare niente (niente `npm start`, niente
#   token personale nel cloud). Latenza tipica: ~1-2 minuti dopo il push.
#
# AUTENTICAZIONE
#   Richiede il secret di repo `FILO_SA_KEY`: il contenuto JSON della chiave di
#   un service account con ruolo "Cloud Datastore User" sul progetto Firebase.
#   Vedi le istruzioni in fondo a feedback-triage/README.md.
#
# ANTI-LOOP
#   apply-triage.mjs committa la coda svuotata con `[skip ci]` nel messaggio,
#   quindi il suo stesso push NON ri-triggera questo workflow.

name: Applica coda feedback (triage → Firestore)

on:
  push:
    branches: [main]
    paths:
      - 'feedback-triage/*.json'
      - 'feedback-triage/claims/*.json'   # push di claim/release dei semafori routine
  workflow_dispatch: {}   # pulsante "Run workflow" manuale (svuota la coda ora)

permissions:
  contents: write          # committare/pushare la rimozione dei file applicati

concurrency:
  group: filo-apply-triage
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Applica la coda a Firestore (service account) e svuota
        env:
          FILO_SA_KEY: ${{ secrets.FILO_SA_KEY }}
        run: node scripts/apply-triage.mjs
