# Release automatica di Filo (Windows + Mac).
#
# COSA FA
#   A intervalli regolari (cron) controlla se su `main` ci sono commit nuovi
#   rispetto all'ultima release pubblicata. Se sì: CHIEDE AL SERVER il numero
#   della versione nuova, builda l'installer NSIS per Windows e lo pubblica come
#   nuova GitHub Release. L'auto-update dentro Filo (electron-updater) la vede e
#   aggiorna i tester. Se NON ci sono commit nuovi, non fa nulla (niente release
#   inutili).
#
# QUESTO LAVORO NON SCRIVE SU `main` (SPEC-RIDISEGNO-MAX.md §10)
#   Fino al 18/08/2026 alzava la patch version da sé e la pushava. Su `main`
#   adesso scrive UNA SOLA identità, quella del server di sicurezza: la ruleset
#   non lascia passare nessun altro, e questo lavoro gira su una macchina
#   qualunque con un token che eredita chiunque ci passi.
#   Quindi il numero lo chiede: `scripts/release-bump.mjs` bussa al server, che
#   legge il manifesto vero su `main`, calcola lui il numero successivo e
#   scrive lui il commit. Da qui non parte nessun `git push`, e non deve
#   tornarci: se un giorno serve cambiare qualcosa su `main`, si aggiunge al
#   server, non qui.
#
# AUTENTICAZIONE
#   · GITHUB_TOKEN effimero di Actions: crea e pubblica la Release. Le
#     "Workflow permissions" del repo devono essere su "Read and write"
#     (Settings -> Actions -> General).
#   · FILO_BUILD_PASSPHRASE: la parola d'ordine di scopo `build`, la stessa che
#     apre le chiavi di default e l'allarme. Apre SOLO quelle tre cose, e
#     l'aumento di versione non accetta da qui nessun numero e nessun
#     contenuto: li decide il server.
#
# AVVIO MANUALE
#   Si puo' lanciare a mano dalla tab "Actions" del repo (Run workflow),
#   utile per pubblicare subito senza aspettare il cron. Attenzione: il server
#   ha un freno anti-raffica sull'aumento di versione (un aumento ogni ~20
#   minuti, al massimo 12 al giorno), quindi due avvii a mano ravvicinati
#   trovano un rifiuto — voluto, non un guasto.

name: Release Filo (Windows + Mac)

on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore (UTC); modificabile
  workflow_dispatch: {}      # pulsante "Run workflow" manuale

permissions:
  contents: write            # creare e pubblicare la Release (non serve piu' per scrivere su main)

concurrency:
  group: filo-release
  cancel-in-progress: false  # non interrompere un publish a meta'

jobs:
  release:
    runs-on: windows-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.allinea.outputs.sha }}
    steps:
      - name: Checkout main (con storia e tag completi)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: C'e' qualcosa di nuovo da rilasciare?
        id: check
        shell: bash
        run: |
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "Nessun tag precedente -> si rilascia."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            AHEAD=$(git rev-list --count "${LAST_TAG}..HEAD")
            echo "Commit dopo $LAST_TAG: $AHEAD"
            if [ "$AHEAD" -gt 0 ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install dipendenze
        if: steps.check.outputs.should_release == 'true'
        run: npm ci

      # ─── CANCELLO PRIMA DELLA PUBBLICAZIONE ──────────────────────────────
      # Fino al 2026-08-07 questo lavoro prendeva il ramo principale COSI' COM'E'
      # ogni 6 ore, lo costruiva e lo pubblicava agli utenti SENZA eseguire un
      # solo test. Qualunque errore — di una routine o di una sessione locale —
      # arrivava a tutti senza incontrare nessun controllo lungo la strada; e
      # siccome le modifiche atterrano sul ramo principale una per una, la
      # fotografia poteva cogliere un lavoro a meta'.
      #
      # Gira PRIMA del bump di versione: se e' rosso non si consuma un numero di
      # versione e non si sporca la storia.
      - name: Controlli automatici (cancello di pubblicazione)
        if: steps.check.outputs.should_release == 'true'
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit.log
          echo "unit_ok=1" >> "$GITHUB_OUTPUT"

      # Rosso = NON si pubblica, e il guasto diventa un feedback in coda: al
      # prossimo giro una routine lo prende in carico come qualsiasi altro
      # lavoro, capisce cosa non funziona e lo risolve. Senza questo passo un
      # fallimento si limiterebbe a bloccare le pubblicazioni in silenzio.
      - name: Controlli falliti - apri un feedback e fermati
        if: steps.check.outputs.should_release == 'true' && steps.gate.outcome == 'failure'
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          echo "::error::Controlli automatici rossi: pubblicazione annullata."
          PREMESSA="Il cancello prima della pubblicazione ha trovato dei controlli automatici falliti sul ramo principale: la nuova versione NON e stata pubblicata e gli utenti restano sull ultima buona. Capisci quale modifica li ha rotti e sistemala; se invece il controllo e diventato obsoleto rispetto a come funziona oggi l app, aggiorna il controllo. Coda dell ultima esecuzione:"
          TAIL=$(tail -c 2500 unit.log 2>/dev/null || echo "(nessun output)")
          TESTO="${PREMESSA}

          ${TAIL}"
          node scripts/build-alarm.mjs "Controlli automatici rossi: nessuna versione pubblicata" "$TESTO" || echo "::warning::allarme non consegnato"
          exit 1

      - name: Incastona le chiavi di default nel build (bake)
        # Chiede al server di sicurezza l'override admin più recente (con una
        # parola d'ordine che apre SOLO quello) oppure usa i secret
        # FILO_DEFAULT_* del job, e scrive il file
        # generato che finisce dentro l'eseguibile. Così la rotazione chiavi
        # dell'admin si propaga a TUTTI gli utenti al prossimo build, anche senza
        # login. Non stampa mai i valori (solo presente/assente).
        #
        # È anche un CANCELLO: se non trova nessuna chiave da nessuna fonte si
        # ferma, perché una versione senza chiavi arriva agli utenti muta e
        # nessuno se ne accorge finché non prova a usarla. Per questo sta PRIMA
        # del bump, come l'altro cancello: un giro fermato non deve consumare un
        # numero di versione né lasciare sul ramo principale un "release: vX"
        # che non corrisponde a niente di pubblicato.
        if: steps.check.outputs.should_release == 'true'
        env:
          # Parola d'ordine che apre SOLO le chiavi di default, e nient'altro.
          # Prima qui c'era il token dell'account robot: una credenziale piena,
          # con cui si arrivava alle chiavi API a pagamento dell'owner.
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_OPENROUTER_KEY: ${{ secrets.FILO_DEFAULT_OPENROUTER_KEY }}
          FILO_DEFAULT_GEMINI_KEY: ${{ secrets.FILO_DEFAULT_GEMINI_KEY }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
        run: node scripts/bake-default-config.mjs

      # ─── IL NUMERO DI VERSIONE LO SCRIVE IL SERVER ───────────────────────
      # Prima qui si faceva `npm version patch` + `git push origin HEAD:main`.
      # Su `main` adesso scrive solo l'identità del server (ruleset), e questo
      # lavoro non deve poterci scrivere: chiede, e basta.
      #
      # Il server legge il manifesto vero su `main`, calcola lui il numero
      # successivo e scrive lui il commit `release: vX.Y.Z [skip ci]`. Da qui
      # non parte nessun numero e nessun contenuto.
      #
      # Codici d'uscita dello script: 0 fatto · 2 rifiutato (freno anti-raffica,
      # parola d'ordine, manifesto) · 3 server non raggiungibile. In tutti e tre
      # i casi diversi da zero il lavoro si ferma: costruire senza sapere quale
      # numero è su `main` pubblicherebbe sopra una release già esistente.
      - name: Chiedi al server il numero della versione nuova
        if: steps.check.outputs.should_release == 'true'
        id: bump
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          set -e
          VERSION=$(node scripts/release-bump.mjs)
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      # La copia di lavoro è rimasta a prima del commit del server: senza questa
      # lettura, electron-builder costruirebbe col numero VECCHIO e pubblicherebbe
      # sopra una release già esistente. È una lettura e basta — nessuna scrittura
      # su main parte da qui.
      - name: Allinea la copia di lavoro a main (lettura)
        if: steps.check.outputs.should_release == 'true'
        id: allinea
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          LOCALE=$(node -p "require('./package.json').version")
          ATTESA="${{ steps.bump.outputs.version }}"
          if [ "v${LOCALE}" != "$ATTESA" ]; then
            echo "::error::il manifesto qui dice v${LOCALE}, il server ha scritto ${ATTESA}: non costruisco alla cieca."
            exit 1
          fi
          # Il commit ESATTO che si sta costruendo. Serve alla meta' Mac, che
          # deve partire dallo stesso codice: il tag della release nasce solo
          # alla pubblicazione e punta a dove sta `main` in QUEL momento, che
          # dopo un merge nel frattempo non e' piu' questo commit.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Si costruisce ${ATTESA} da $(git rev-parse HEAD)."

      - name: Build e upload su GitHub Releases (come bozza)
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # app non firmata: salta la ricerca certificati
        run: npm run release

      - name: Pubblica la release (da bozza a pubblicata)
        # electron-builder crea la release come DRAFT. La rendiamo pubblica solo
        # ORA, a build+upload finiti, cosi' l'auto-update non vede mai una
        # release con asset incompleti. La marchiamo anche come "latest" perche'
        # l'URL .../releases/latest/download/Filo-Setup.exe punti a questa.
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release edit "${{ steps.bump.outputs.version }}" --draft=false --latest

      - name: Riepilogo
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: echo "Pubblicata ${{ steps.bump.outputs.version }}"
