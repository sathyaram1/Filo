# Release automatica di Filo (Windows + Mac + Linux).
#
# COSA FA
#   A intervalli regolari (cron) controlla se su `main` ci sono commit nuovi
#   rispetto all'ultima release pubblicata. Se sì: CHIEDE AL SERVER il numero
#   della versione nuova, builda l'installer NSIS per Windows e lo pubblica come
#   nuova GitHub Release. L'auto-update dentro Filo (electron-updater) la vede e
#   aggiorna i tester. Se NON ci sono commit nuovi, non fa nulla (niente release
#   inutili).
#
#   PRIMA della costruzione gira la suite Playwright completa (job `suite`, su
#   Linux senza schermo, come nel contenitore delle routine): dal 2026-09-15
#   nessun agente la lancia più a mano, gira solo qui. Verde (o solo rossi noti
#   del contenitore, tests/rossi-noti.json) → si pubblica; un rosso NUOVO → non
#   si pubblica, il rosso diventa un feedback e la patch salta un giro.
#   `solo_suite` (avvio a mano) fa girare la sola suite sul ramo scelto, senza
#   pubblicare: serve a provarla su un ramo.
#
# QUESTO LAVORO NON SCRIVE SU `main` (SPEC-RIDISEGNO-MAX.md §10)
#   Fino al 18/08/2026 alzava la patch version da sé e la pushava. Su `main`
#   adesso scrive UNA SOLA identità, quella del server di sicurezza: la ruleset
#   non lascia passare nessun altro, e questo lavoro gira su una macchina
#   qualunque con un token che eredita chiunque ci passi.
#   Quindi il numero lo chiede: `scripts/release-bump.mjs` bussa al server, che
#   legge il manifesto vero su `main`, calcola lui il numero successivo e
#   scrive lui il commit. Da qui non parte nessun `git push`, e non deve
#   tornarci: se un giorno serve cambiare qualcosa su `main`, si aggiunge al
#   server, non qui.
#
# AUTENTICAZIONE
#   · GITHUB_TOKEN effimero di Actions: crea e pubblica la Release. Le
#     "Workflow permissions" del repo devono essere su "Read and write"
#     (Settings -> Actions -> General).
#   · FILO_BUILD_PASSPHRASE: la parola d'ordine di scopo `build`, la stessa che
#     apre le chiavi di default e l'allarme. Apre SOLO quelle tre cose, e
#     l'aumento di versione non accetta da qui nessun numero e nessun
#     contenuto: li decide il server.
#
# AVVIO MANUALE
#   Si puo' lanciare a mano dalla tab "Actions" del repo (Run workflow),
#   utile per pubblicare subito senza aspettare il cron. Attenzione: il server
#   ha un freno anti-raffica sull'aumento di versione (un aumento ogni ~20
#   minuti, al massimo 12 al giorno), quindi due avvii a mano ravvicinati
#   trovano un rifiuto — voluto, non un guasto.

name: Release Filo (Windows + Mac + Linux)

on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore (UTC); modificabile
  workflow_dispatch:         # pulsante "Run workflow" manuale
    inputs:
      solo_suite:
        description: 'Solo la suite Playwright sul ramo scelto: non pubblica niente'
        type: boolean
        default: false

permissions:
  contents: write            # creare e pubblicare la Release (non serve piu' per scrivere su main)

concurrency:
  group: filo-release
  cancel-in-progress: false  # non interrompere un publish a meta'

jobs:
  # ─── PRIMA DI TUTTO: LA SUITE COMPLETA ─────────────────────────────────────
  # Dal 2026-09-15 la suite Playwright completa (~390 spec, ~1.600 casi) non la
  # lancia più nessun agente, né in locale né nelle routine: gira QUI, prima di
  # ogni pubblicazione, su una macchina Linux senza schermo come quella delle
  # routine. Per questo ELECTRON_DISABLE_SANDBOX=1 e xvfb-run -a: senza quei
  # due Electron non parte proprio (lo dice anche scripts/ensure-electron.mjs).
  # Un solo worker (Electron e le scorciatoie globali non reggono la
  # concorrenza): nel contenitore delle routine ci mette un'ora e un quarto.
  #
  # Il verdetto NON è «tutto verde»: nel contenitore senza schermo ci sono
  # rossi d'ambiente scritti in tests/rossi-noti.json (contenitore.specs) e
  # scripts/suite-verdict.mjs li toglie dal conto. Resta un rosso NUOVO? La
  # versione non esce, il rosso diventa un feedback (lo stesso allarme del
  # cancello unit qui sotto) e la patch salta un giro. Un flaky ripassato al
  # retry non conta: assorbirlo è già il compito dei retry.
  #
  # Esito e tracce (JSON dei risultati, screenshot e trace dei rossi) restano
  # allegati all'esecuzione per sette giorni: chi prende il feedback parte da
  # lì, non rilancia un'ora di suite per vedere cos'è successo.
  #
  # `solo_suite` (avvio a mano): fa girare SOLO questo lavoro, sempre, anche
  # senza niente di nuovo, sul RAMO da cui si è lanciato, e senza pubblicare né
  # aprire feedback: è il modo di provare la suite su un ramo.
  #   gh workflow run release.yml --ref <ramo> -f solo_suite=true
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      sha: ${{ steps.provato.outputs.sha }}
    steps:
      - name: Checkout (main, o il ramo scelto con solo_suite)
        uses: actions/checkout@v4
        with:
          # Con solo_suite si prova il ramo da cui si e' lanciato; altrimenti
          # quello che si sta per pubblicare, cioe' main. Su cron `inputs` e'
          # vuoto e si cade su main.
          ref: ${{ inputs.solo_suite && github.ref || 'main' }}
          fetch-depth: 0

      # Il commit che questa suite prova. La seconda meta' (release) lo
      # confronta con quello che sta per costruire: la suite dura un'ora e un
      # quarto, e in quell'ora su main possono entrare altre fusioni — codice
      # mai passato di qui, che senza il confronto uscirebbe agli utenti
      # (giro del 14/09, verifica). Si legge PRIMA del controllo "c'e'
      # qualcosa di nuovo", cosi' c'e' anche quando la suite non gira.
      - name: Il commit che la suite prova
        id: provato
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # STESSA logica del passo omonimo del lavoro Windows: se cambia una delle
      # due, cambia anche l'altra (la sentinella in tests/unit/releaseSuite
      # le confronta). In piu': con solo_suite si gira sempre.
      - name: C'e' qualcosa di nuovo da provare?
        id: check
        shell: bash
        run: |
          if [ "${{ inputs.solo_suite }}" = "true" ]; then
            echo "solo_suite: la suite gira comunque, e non si pubblica niente."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "Nessun tag precedente -> si prova."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            AHEAD=$(git rev-list --count "${LAST_TAG}..HEAD")
            echo "Commit dopo $LAST_TAG: $AHEAD"
            if [ "$AHEAD" -gt 0 ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Niente di nuovo dal tag: la suite non gira (uscita verde)."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install dipendenze
        if: steps.check.outputs.run == 'true'
        run: npm ci

      # `npm ci` scarica il binario di Electron da solo (qui github e'
      # raggiungibile); lo script e' idempotente e serve se un giorno non lo
      # facesse: senza binario nessuno spec parte, e la suite sarebbe «rossa»
      # per un motivo che non c'entra col codice.
      - name: Binario di Electron
        if: steps.check.outputs.run == 'true'
        run: node scripts/ensure-electron.mjs

      - name: Schermo virtuale (xvfb)
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      # Il JSON va in un file (PLAYWRIGHT_JSON_OUTPUT_NAME), la lista a schermo
      # per seguire l'esecuzione. `continue-on-error`: il verdetto lo da' lo
      # script dopo, non l'uscita di Playwright, che e' rossa anche per i soli
      # rossi noti.
      # Un tetto SUO, sotto quello del job: con il solo tetto del job un
      # Electron rimasto appeso faceva annullare il job PRIMA del verdetto,
      # cioe' senza feedback e senza una riga che lo dicesse (verifica del
      # giro 2). Scaduto questo, il passo e' rosso, il verdetto trova il JSON
      # mancante (uscita 2, non un verde) e l'allarme parte come per un rosso.
      - name: Suite Playwright completa
        if: steps.check.outputs.run == 'true'
        id: suite
        continue-on-error: true
        timeout-minutes: 200
        shell: bash
        run: ELECTRON_DISABLE_SANDBOX=1 PLAYWRIGHT_JSON_OUTPUT_NAME=suite-risultati.json xvfb-run -a npx playwright test --reporter=list,json

      # Uscita 0: nessun rosso nuovo. 1: rossi nuovi (elenco in rossi-nuovi.txt,
      # intero). 2: la suite non e' partita o non ha lasciato un esito
      # leggibile, che NON e' un verde.
      - name: Verdetto (rossi nuovi fuori dai rossi noti del contenitore)
        if: steps.check.outputs.run == 'true'
        id: verdetto
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/suite-verdict.mjs suite-risultati.json --out rossi-nuovi.txt 2>&1 | tee verdetto.log

      - name: Conserva esito e tracce (7 giorni)
        if: always() && steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: suite-playwright-${{ github.run_id }}
          path: |
            suite-risultati.json
            rossi-nuovi.txt
            verdetto.log
            test-results/
          if-no-files-found: warn
          retention-days: 7

      # Stesso allarme del cancello unit (stessa credenziale, stesso script):
      # il rosso diventa un feedback in coda e al prossimo giro una routine lo
      # prende in carico. Non con solo_suite: una prova su un ramo non e' una
      # pubblicazione fermata, e un feedback aperto per un ramo di lavoro
      # sarebbe rumore in coda (l'elenco resta nel registro e nell'artifact).
      #
      # Parte anche se e' rosso un passo PRIMA della suite (npm ci, il binario
      # di Electron, xvfb: `failure()`): fino al giro 5 della verifica quel
      # rosso fermava il lavoro prima del verdetto, senza feedback, e la
      # pubblicazione si fermava in silenzio. `always()` serve perche' dopo un
      # passo rosso i passi senza una funzione di stato vengono saltati.
      - name: Rosso nuovo - apri un feedback e fermati
        if: always() && !cancelled() && steps.check.outputs.run != 'false' && (steps.verdetto.outcome == 'failure' || failure())
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          SOLO_SUITE: ${{ inputs.solo_suite }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        shell: bash
        run: |
          echo "::error::Suite Playwright con rossi nuovi (o non partita): pubblicazione annullata."
          if [ "$SOLO_SUITE" = "true" ]; then
            echo "solo_suite: nessun feedback aperto, l'elenco dei rossi sta qui sopra e nell'artifact."
            exit 1
          fi
          PREMESSA="La suite Playwright completa, che gira prima di ogni pubblicazione, ha trovato dei rossi NUOVI sul ramo principale (fuori dai rossi noti del contenitore in tests/rossi-noti.json): la nuova versione NON e stata pubblicata e gli utenti restano sull ultima buona. Capisci quale modifica li ha rotti e sistemala; se invece e un rosso d ambiente del contenitore senza schermo, aggiungilo a tests/rossi-noti.json (contenitore.specs) col titolo esatto del test, il motivo e questo feedback. Il JSON dei risultati e le tracce dei rossi (screenshot, trace) stanno nell artifact di questa esecuzione (Actions), per sette giorni."
          # L'elenco intero sta in rossi-nuovi.txt (allegato): qui un tetto, e
          # il taglio si DICE col numero di quelli rimasti fuori. Un elenco
          # mozzato senza avviso fa credere di avere tutti i rossi.
          ROSSI_TUTTE=$(cat rossi-nuovi.txt 2>/dev/null || true)
          ROSSI=$(printf '%s\n' "$ROSSI_TUTTE" | head -80)
          N_TUTTE=$(printf '%s\n' "$ROSSI_TUTTE" | grep -c . || true)
          if [ "${N_TUTTE:-0}" -gt 80 ]; then
            ROSSI="${ROSSI}
          … elenco tagliato: altri $((N_TUTTE - 80)) casi rossi stanno in rossi-nuovi.txt, nell'artifact di questa esecuzione (Actions)"
          fi
          VERDETTO=$(tail -c 2500 verdetto.log 2>/dev/null || echo "(nessun verdetto: la suite non e partita)")
          # Senza il JSON la suite o non e partita o e stata interrotta dal
          # tetto del passo (un Electron rimasto appeso): lo si dice, perche
          # chi prende il feedback sappia cosa cercare nel registro.
          if [ "$SUITE_OUTCOME" != "success" ] && [ "$SUITE_OUTCOME" != "failure" ]; then
            # La suite non e' nemmeno partita: e' rosso un passo prima di lei.
            VERDETTO="La suite NON e partita: e rosso uno dei passi che la preparano (l installazione delle dipendenze con npm ci, il binario di Electron, lo schermo virtuale xvfb). Non e un rosso del codice di Filo: guarda il registro di questa esecuzione (Actions), sistema quel passo (un lockfile fuori sincrono, un download che non arriva) e la prossima corsa riprova.
          ${VERDETTO}"
          elif [ ! -f suite-risultati.json ]; then
            VERDETTO="La suite non ha lasciato il JSON dei risultati: o non e partita, oppure ha superato il tetto del passo (200 minuti, di norma un Electron rimasto appeso) ed e stata interrotta prima della fine. Guarda il registro del passo Suite Playwright completa in questa esecuzione (Actions).
          ${VERDETTO}"
          fi
          TESTO="${PREMESSA}

          Rossi nuovi (${N_TUTTE:-0}):
          ${ROSSI:-(nessun caso elencato: la suite non e partita o non ha lasciato un esito leggibile; guarda il verdetto)}


          Verdetto:
          ${VERDETTO}"
          node scripts/build-alarm.mjs "Suite Playwright rossa: nessuna versione pubblicata" "$TESTO" || echo "::warning::allarme non consegnato"
          exit 1

  release:
    needs: suite
    # Con solo_suite non si pubblica niente. Su cron `inputs` e' vuoto e la
    # condizione resta vera. `success()` (suite verde) e' scritto per esteso
    # invece di affidarsi al default implicito: a suite rossa qui non si parte.
    if: ${{ success() && !inputs.solo_suite }}
    runs-on: windows-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.allinea.outputs.sha }}
    steps:
      - name: Checkout main (con storia e tag completi)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: C'e' qualcosa di nuovo da rilasciare?
        id: check
        shell: bash
        run: |
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "Nessun tag precedente -> si rilascia."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            AHEAD=$(git rev-list --count "${LAST_TAG}..HEAD")
            echo "Commit dopo $LAST_TAG: $AHEAD"
            if [ "$AHEAD" -gt 0 ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          # ─── SI PUBBLICA SOLO IL COMMIT CHE LA SUITE HA PROVATO ────────
          # La suite ha provato main com'era un'ora e un quarto fa; se nel
          # frattempo su main e' entrato altro, questa corsa NON pubblica
          # (l'ultima riga vince) e non apre feedback: la prossima, sei ore
          # dopo, riprova sul main nuovo. Senza un commit provato non si
          # pubblica alla cieca.
          PROVATO="${{ needs.suite.outputs.sha }}"
          QUI=$(git rev-parse HEAD)
          if [ "$QUI" != "$PROVATO" ]; then
            echo "main e' a $QUI, la suite ha provato ${PROVATO:-(niente)}: questa corsa NON pubblica; la prossima riprova sul main nuovo."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            # Il riassunto del lavoro lo dice a chi guarda Actions: se main
            # riceve qualcosa durante OGNI corsa, nessuna versione esce e da
            # nessun'altra parte si vede (giro 6 della verifica, 16/09/2026:
            # scelta dell'owner non aprire un feedback, ma il caso va visto).
            {
              echo "## Pubblicazione ferma: main si e' mosso durante la suite"
              echo ""
              echo "La suite ha provato \`${PROVATO:-(niente)}\`; main ora e' a \`$QUI\`."
              echo "Questa corsa NON pubblica; la prossima, fra sei ore, riprova sul main nuovo."
              echo "Se succede a ogni corsa, nessuna versione esce: guardare la frequenza delle fusioni su main."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dipendenze
        if: steps.check.outputs.should_release == 'true'
        run: npm ci

      # ─── CANCELLO PRIMA DELLA PUBBLICAZIONE ──────────────────────────────
      # Fino al 2026-08-07 questo lavoro prendeva il ramo principale COSI' COM'E'
      # ogni 6 ore, lo costruiva e lo pubblicava agli utenti SENZA eseguire un
      # solo test. Qualunque errore — di una routine o di una sessione locale —
      # arrivava a tutti senza incontrare nessun controllo lungo la strada; e
      # siccome le modifiche atterrano sul ramo principale una per una, la
      # fotografia poteva cogliere un lavoro a meta'.
      #
      # Gira PRIMA del bump di versione: se e' rosso non si consuma un numero di
      # versione e non si sporca la storia.
      - name: Controlli automatici (cancello di pubblicazione)
        if: steps.check.outputs.should_release == 'true'
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit.log
          echo "unit_ok=1" >> "$GITHUB_OUTPUT"

      # Rosso = NON si pubblica, e il guasto diventa un feedback in coda: al
      # prossimo giro una routine lo prende in carico come qualsiasi altro
      # lavoro, capisce cosa non funziona e lo risolve. Senza questo passo un
      # fallimento si limiterebbe a bloccare le pubblicazioni in silenzio.
      - name: Controlli falliti - apri un feedback e fermati
        if: steps.check.outputs.should_release == 'true' && steps.gate.outcome == 'failure'
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          echo "::error::Controlli automatici rossi: pubblicazione annullata."
          PREMESSA="Il cancello prima della pubblicazione ha trovato dei controlli automatici falliti sul ramo principale: la nuova versione NON e stata pubblicata e gli utenti restano sull ultima buona. Capisci quale modifica li ha rotti e sistemala; se invece il controllo e diventato obsoleto rispetto a come funziona oggi l app, aggiorna il controllo. Coda dell ultima esecuzione:"
          # I test rossi stanno all'INIZIO del log (una riga «not ok» per
          # ciascuno), la coda porta solo il riepilogo: prima si elencano
          # quelli, poi la coda. Un allarme con la sola coda non diceva quali
          # test erano rossi, e chi lo prendeva doveva rifare tutta la suite.
          # La riga «not ok» porta il nome del test ma non il file (o, a
          # seconda della versione di Node, il file ma non il test, rientrata):
          # si prende con qualunque rientro, e con la riga «location:» che la
          # segue, che dice file e riga. Senza, con più di cento file di test,
          # chi prendeva l'allarme cercava il test per nome.
          # L'elenco ha un tetto (il testo dell'allarme viaggia in un feedback),
          # ma il taglio si DICE: un elenco mozzato senza avviso fa credere di
          # avere tutti i rossi, e con un modulo condiviso rotto sono cento.
          ROSSI_TUTTE=$(grep -E '^[[:space:]]*(not ok|location:)' unit.log 2>/dev/null || true)
          ROSSI=$(printf '%s\n' "$ROSSI_TUTTE" | head -80)
          N_TUTTE=$(printf '%s\n' "$ROSSI_TUTTE" | grep -c . || true)
          if [ "${N_TUTTE:-0}" -gt 80 ]; then
            ROSSI="${ROSSI}
          … elenco tagliato: altre $((N_TUTTE - 80)) righe di test rossi stanno nel registro di questa esecuzione (Actions)"
          fi
          TAIL=$(tail -c 2500 unit.log 2>/dev/null || echo "(nessun output)")
          TESTO="${PREMESSA}

          Test rossi:
          ${ROSSI:-(nessuna riga not ok: guarda la coda)}


          ${TAIL}"
          node scripts/build-alarm.mjs "Controlli automatici rossi: nessuna versione pubblicata" "$TESTO" || echo "::warning::allarme non consegnato"
          exit 1

      - name: Incastona le chiavi di default nel build (bake)
        # Chiede al server di sicurezza l'override admin più recente (con una
        # parola d'ordine che apre SOLO quello) oppure usa i secret
        # FILO_DEFAULT_* del job, e scrive il file
        # generato che finisce dentro l'eseguibile. La chiave OpenRouter NON
        # c'è più (#598): ogni utente riceve la sua dal server, col tetto pari
        # ai suoi crediti. Nemmeno quella di Gemini (#581): l'applicazione non
        # la legge, quindi finiva nell'installer senza servire a niente e per
        # giunta bastava lei a far passare il cancello qui sotto. Qui restano
        # solo i servizi di contorno. Così la rotazione chiavi
        # dell'admin si propaga a TUTTI gli utenti al prossimo build, anche senza
        # login. Non stampa mai i valori (solo presente/assente).
        #
        # È anche un CANCELLO: se non trova nessuna chiave da nessuna fonte si
        # ferma, perché una versione senza chiavi arriva agli utenti muta e
        # nessuno se ne accorge finché non prova a usarla. Per questo sta PRIMA
        # del bump, come l'altro cancello: un giro fermato non deve consumare un
        # numero di versione né lasciare sul ramo principale un "release: vX"
        # che non corrisponde a niente di pubblicato.
        if: steps.check.outputs.should_release == 'true'
        env:
          # Parola d'ordine che apre SOLO le chiavi di default, e nient'altro.
          # Prima qui c'era il token dell'account robot: una credenziale piena,
          # con cui si arrivava alle chiavi API a pagamento dell'owner.
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
          # #581: da quando config/secrets e' leggibile solo dall'admin, questa
          # e' l'unica strada per far arrivare la chiave Safe Browsing agli
          # utenti. Se il server la restituisce gia', questo secret non serve.
          FILO_DEFAULT_SAFEBROWSING_KEY: ${{ secrets.FILO_DEFAULT_SAFEBROWSING_KEY }}
        run: node scripts/bake-default-config.mjs

      # ─── IL NUMERO DI VERSIONE LO SCRIVE IL SERVER ───────────────────────
      # Prima qui si faceva `npm version patch` + `git push origin HEAD:main`.
      # Su `main` adesso scrive solo l'identità del server (ruleset), e questo
      # lavoro non deve poterci scrivere: chiede, e basta.
      #
      # Il server legge il manifesto vero su `main`, calcola lui il numero
      # successivo e scrive lui il commit `release: vX.Y.Z [skip ci]`. Da qui
      # non parte nessun numero e nessun contenuto.
      #
      # Codici d'uscita dello script: 0 fatto · 2 rifiutato (freno anti-raffica,
      # parola d'ordine, manifesto) · 3 server non raggiungibile. In tutti e tre
      # i casi diversi da zero il lavoro si ferma: costruire senza sapere quale
      # numero è su `main` pubblicherebbe sopra una release già esistente.
      - name: Chiedi al server il numero della versione nuova
        if: steps.check.outputs.should_release == 'true'
        id: bump
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          set -e
          VERSION=$(node scripts/release-bump.mjs)
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      # La copia di lavoro è rimasta a prima del commit del server: senza questa
      # lettura, electron-builder costruirebbe col numero VECCHIO e pubblicherebbe
      # sopra una release già esistente. È una lettura e basta — nessuna scrittura
      # su main parte da qui.
      - name: Allinea la copia di lavoro a main (lettura)
        if: steps.check.outputs.should_release == 'true'
        id: allinea
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          LOCALE=$(node -p "require('./package.json').version")
          ATTESA="${{ steps.bump.outputs.version }}"
          if [ "v${LOCALE}" != "$ATTESA" ]; then
            echo "::error::il manifesto qui dice v${LOCALE}, il server ha scritto ${ATTESA}: non costruisco alla cieca."
            exit 1
          fi
          # Sotto il commit di release del server deve esserci ESATTAMENTE il
          # commit che la suite ha provato: fra il controllo di prima e il
          # numero di versione passano minuti, e una fusione in quei minuti
          # farebbe costruire codice mai provato. Qui un numero di versione
          # e' gia' stato consumato: resta un buco nella numerazione, che
          # non fa male; pubblicare codice mai provato si'.
          PROVATO="${{ needs.suite.outputs.sha }}"
          SOTTO=$(git rev-parse HEAD~1)
          if [ "$SOTTO" != "$PROVATO" ]; then
            echo "::error::su main e' entrato altro fra la suite e il numero di versione (provato ${PROVATO:-(niente)}, sotto la release c'e' ${SOTTO}): non costruisco codice mai provato. La prossima corsa riprova."
            {
              echo "## Pubblicazione ferma: main si e' mosso fra la suite e il numero di versione"
              echo ""
              echo "La suite ha provato \`${PROVATO:-(niente)}\`; sotto il commit di release c'e' \`$SOTTO\`."
              echo "Il numero ${ATTESA} resta consumato (un buco nella numerazione, che non fa male); la prossima corsa riprova."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Il commit ESATTO che si sta costruendo. Serve alla meta' Mac, che
          # deve partire dallo stesso codice: il tag della release nasce solo
          # alla pubblicazione e punta a dove sta `main` in QUEL momento, che
          # dopo un merge nel frattempo non e' piu' questo commit.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Si costruisce ${ATTESA} da $(git rev-parse HEAD)."

      - name: Build e upload su GitHub Releases (come bozza)
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # app non firmata: salta la ricerca certificati
        run: npm run release

      - name: Pubblica la release (da bozza a pubblicata)
        # electron-builder crea la release come DRAFT. La rendiamo pubblica solo
        # ORA, a build+upload finiti, cosi' l'auto-update non vede mai una
        # release con asset incompleti. La marchiamo anche come "latest" perche'
        # l'URL .../releases/latest/download/Filo-Setup.exe punti a questa.
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release edit "${{ steps.bump.outputs.version }}" --draft=false --latest

      - name: Riepilogo
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: echo "Pubblicata ${{ steps.bump.outputs.version }}"

  # ─── SECONDA META': LA VERSIONE PER MAC ──────────────────────────────────
  # Un pacchetto per Mac lo puo' costruire SOLO un Mac (serve `lipo` per fondere
  # Intel e Apple Silicon in un file solo, e gli strumenti di firma di Apple):
  # per questo e' un lavoro a se', su una macchina Apple, e non un passo in piu'
  # di quello per Windows.
  #
  # Parte DOPO che la versione per Windows e' stata pubblicata, e si attacca
  # alla STESSA pubblicazione: stesso numero di versione, stessa pagina di
  # download, due file. Cosi' il collegamento "Scarica per Mac" del sito
  # (.../releases/latest/download/Filo-Mac.dmg) punta sempre all'ultima
  # versione, come quello per Windows.
  #
  # DUE COSE DA SAPERE
  #   1. Costruisce lo STESSO commit che ha costruito Windows (`needs...sha`),
  #      non il tag: il tag nasce alla pubblicazione e punta a dove sta `main`
  #      in quel momento — se nel frattempo e' entrato un merge, non e' piu' il
  #      codice pubblicato per Windows, e i due file avrebbero lo stesso numero
  #      di versione con dentro codice diverso.
  #   2. Per una decina di minuti — il tempo di questa meta' — la release e'
  #      gia' pubblicata ma il file per Mac non c'e' ancora: in quella finestra
  #      il collegamento del sito risponde 404. E' il prezzo di non far
  #      aspettare Windows, ed e' voluto.
  #
  # Se questa meta' fallisce, quella per Windows resta pubblicata e valida: e'
  # marcata `continue-on-error` apposta: un problema sui Mac non deve togliere
  # l'aggiornamento a chi e' su Windows.
  release-mac:
    needs: release
    if: needs.release.outputs.should_release == 'true' && needs.release.outputs.version != ''
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout dello stesso commit costruito per Windows
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        id: dipendenze
        run: npm ci

      # Guardia: se il manifesto qui non dice il numero che il server ha
      # scritto, si sta costruendo un codice diverso da quello pubblicato per
      # Windows. Meglio fermarsi che allegare alla release un pacchetto Mac che
      # non corrisponde.
      - name: Stesso numero di versione della meta' Windows
        id: versione
        shell: bash
        run: |
          set -e
          LOCALE=$(node -p "require('./package.json').version")
          ATTESA="${{ needs.release.outputs.version }}"
          if [ "v${LOCALE}" != "$ATTESA" ]; then
            echo "::error::qui il manifesto dice v${LOCALE}, la release e' ${ATTESA}: non allego un pacchetto sbagliato."
            exit 1
          fi

      # Stesso passo dell'altra meta', e per lo stesso motivo: senza le chiavi
      # incastonate l'app arriva muta. Va rifatto qui perche' il file generato
      # non sta nel repo: vive solo dentro la macchina che costruisce.
      - name: Incastona le chiavi di default nel build (bake)
        id: bake
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
          # #581: da quando config/secrets e' leggibile solo dall'admin, questa
          # e' l'unica strada per far arrivare la chiave Safe Browsing agli
          # utenti. Se il server la restituisce gia', questo secret non serve.
          FILO_DEFAULT_SAFEBROWSING_KEY: ${{ secrets.FILO_DEFAULT_SAFEBROWSING_KEY }}
        run: node scripts/bake-default-config.mjs

      # Senza certificato Apple lo strumento di impacchettamento salta la firma
      # del tutto: ci pensa scripts/after-pack-mac.js a metterne una locale, che
      # sui Mac con chip Apple e' obbligatoria perche' l'app parta.
      #
      # EP_GH_IGNORE_TIME: la release esiste gia' (l'ha pubblicata la meta'
      # Windows). Lo strumento, per prudenza, si rifiuta di allegare file a una
      # release pubblicata da piu' di due ore; qui il ritardo e' di minuti, ma
      # se la meta' Windows e' stata lenta il rifiuto arriverebbe come un
      # semplice avviso, con il lavoro verde e nessun file allegato.
      - name: Build e upload sulla release esistente
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: "true"
        run: npm run release:mac

      # Il passo sopra puo' finire verde senza aver allegato niente (lo
      # strumento, quando decide di non pubblicare, si limita a un avviso).
      # Qui si guarda la release VERA: se i file che il sito e l'aggiornamento
      # automatico si aspettano non ci sono, il lavoro e' rosso.
      - name: I file per Mac sono davvero nella release?
        id: controllo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          ELENCO=$(gh release view "${{ needs.release.outputs.version }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name')
          echo "Allegati nella release:"
          echo "$ELENCO"
          # I file attesi stanno in UN posto solo (lo script dell'allarme): qui
          # si chiedono, cosi' il controllo e il testo del feedback non divergono.
          ATTESI=$(node scripts/release-platform-alarm.mjs --attesi Mac)
          MANCANTI=""
          for ATTESO in $ATTESI; do
            echo "$ELENCO" | grep -qx "$ATTESO" || MANCANTI="${MANCANTI}${ATTESO} "
          done
          # Si elencano TUTTI i mancanti, non solo il primo: chi prende il
          # feedback deve sapere quanto manca, non scoprirlo un file alla volta.
          echo "mancanti=${MANCANTI% }" >> "$GITHUB_OUTPUT"
          if [ -n "$MANCANTI" ]; then
            echo "::error::mancano nella release ${{ needs.release.outputs.version }}: ${MANCANTI% }"
            exit 1
          fi

      # `continue-on-error` sul lavoro tiene in piedi la release Windows, e fin
      # qui e' giusto; il prezzo era il silenzio: dal 20/09 al 26/09 nessuno si
      # e' accorto che Filo per Linux non usciva (#733). Da qui il guasto
      # diventa un feedback in coda, con la stessa credenziale e la stessa
      # strada della suite rossa. La release Windows non si tocca.
      - name: Fallito - apri un feedback (la release Windows resta)
        if: failure()
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          PIATTAFORMA: Mac
          VERSIONE: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Quale passo si e' fermato lo dicono gli esiti dei passi con un id.
          ESITI: ${{ toJSON(steps) }}
          MANCANTI: ${{ steps.controllo.outputs.mancanti }}
        shell: bash
        run: node scripts/release-platform-alarm.mjs || echo "::warning::allarme non consegnato"

      - name: Riepilogo
        run: echo "Aggiunto il pacchetto Mac a ${{ needs.release.outputs.version }}"

  # ─── TERZA META': LA VERSIONE PER LINUX ──────────────────────────────────
  # Stessa forma del lavoro per Mac, e per gli stessi motivi: parte DOPO che la
  # versione per Windows e' stata pubblicata e si attacca alla STESSA
  # pubblicazione, cosi' il collegamento "Scarica per Linux" del sito
  # (.../releases/latest/download/Filo-Linux.AppImage) punta sempre all'ultima
  # versione. Il nome del file e' FISSO: il sito ha un collegamento solo e non
  # sa che numero di versione sia uscito.
  #
  # Perche' un lavoro a se' e non un passo in piu' di quello Windows: l'AppImage
  # si costruisce solo su Linux (serve il runtime AppImage e gli strumenti che
  # electron-builder scarica per quella piattaforma).
  #
  # Se questa meta' fallisce, quella per Windows resta pubblicata e valida
  # (`continue-on-error`): un problema su Linux non deve togliere
  # l'aggiornamento a chi e' su Windows. Vale anche al contrario per il Mac:
  # i due lavori sono indipendenti e girano in parallelo.
  release-linux:
    needs: release
    if: needs.release.outputs.should_release == 'true' && needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout dello stesso commit costruito per Windows
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        id: dipendenze
        run: npm ci

      # Stessa guardia della meta' Mac: se il manifesto qui non dice il numero
      # che il server ha scritto, si sta costruendo un codice diverso da quello
      # pubblicato per Windows. Meglio fermarsi che allegare alla release un
      # pacchetto Linux che non corrisponde.
      - name: Stesso numero di versione della meta' Windows
        id: versione
        shell: bash
        run: |
          set -e
          LOCALE=$(node -p "require('./package.json').version")
          ATTESA="${{ needs.release.outputs.version }}"
          if [ "v${LOCALE}" != "$ATTESA" ]; then
            echo "::error::qui il manifesto dice v${LOCALE}, la release e' ${ATTESA}: non allego un pacchetto sbagliato."
            exit 1
          fi

      # Senza le chiavi incastonate l'app arriva muta. Va rifatto anche qui
      # perche' il file generato non sta nel repo: vive solo dentro la macchina
      # che costruisce.
      - name: Incastona le chiavi di default nel build (bake)
        id: bake
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
          FILO_DEFAULT_SAFEBROWSING_KEY: ${{ secrets.FILO_DEFAULT_SAFEBROWSING_KEY }}
        run: node scripts/bake-default-config.mjs

      # EP_GH_IGNORE_TIME: la release esiste gia' (l'ha pubblicata la meta'
      # Windows) e lo strumento, per prudenza, si rifiuta di allegare file a una
      # release pubblicata da piu' di due ore. Qui il ritardo e' di minuti, ma
      # se la meta' Windows e' stata lenta il rifiuto arriverebbe come un
      # semplice avviso, con il lavoro verde e nessun file allegato.
      - name: Build e upload sulla release esistente
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: "true"
        run: npm run release:linux

      # LE ISTRUZIONI DEL PRIMO AVVIO, ALLEGATE A PARTE
      #   Su Linux l'utente si blocca PRIMA di aver visto Filo, e per due
      #   motivi che valgono per chiunque scarichi. Un file scaricato da un
      #   browser arriva senza il permesso di essere eseguito, e senza quel
      #   permesso il doppio clic non lo avvia. E un AppImage, per montarsi,
      #   apre libfuse.so.2, che Ubuntu dalla 22.04, Debian 12 e le Fedora
      #   recenti non installano piu' di serie: dove manca, il doppio clic
      #   muore con un errore che a un utente non dice niente.
      #
      #   E' lo stesso problema del Mac senza certificato Apple, dove il
      #   foglietto sta dentro il disco che l'utente ha appena aperto. Un
      #   AppImage e' un file solo e non ha un "dentro": il foglietto sale
      #   come allegato a se', con un nome FISSO, cosi' il sito puo' metterlo
      #   accanto al bottone "Scarica per Linux" con un collegamento che non
      #   cambia mai
      #   (.../releases/latest/download/Se-Filo-non-si-apre-Linux.txt).
      - name: Allega le istruzioni del primo avvio
        id: istruzioni
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          gh release upload "${{ needs.release.outputs.version }}" \
            "build/Se-Filo-non-si-apre-Linux.txt" \
            --repo "${{ github.repository }}" --clobber

      # Come per il Mac: il passo sopra puo' finire verde senza aver allegato
      # niente. Qui si guarda la release VERA. `latest-linux.yml` e' il file che
      # l'aggiornamento automatico legge su Linux: senza, chi ha scaricato
      # l'AppImage resta fermo a quella versione per sempre.
      - name: I file per Linux sono davvero nella release?
        id: controllo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          ELENCO=$(gh release view "${{ needs.release.outputs.version }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name')
          echo "Allegati nella release:"
          echo "$ELENCO"
          # I file attesi stanno in UN posto solo (lo script dell'allarme): qui
          # si chiedono, cosi' il controllo e il testo del feedback non divergono.
          ATTESI=$(node scripts/release-platform-alarm.mjs --attesi Linux)
          MANCANTI=""
          for ATTESO in $ATTESI; do
            echo "$ELENCO" | grep -qx "$ATTESO" || MANCANTI="${MANCANTI}${ATTESO} "
          done
          # Si elencano TUTTI i mancanti, non solo il primo: chi prende il
          # feedback deve sapere quanto manca, non scoprirlo un file alla volta.
          echo "mancanti=${MANCANTI% }" >> "$GITHUB_OUTPUT"
          if [ -n "$MANCANTI" ]; then
            echo "::error::mancano nella release ${{ needs.release.outputs.version }}: ${MANCANTI% }"
            exit 1
          fi

      # `continue-on-error` sul lavoro tiene in piedi la release Windows, e fin
      # qui e' giusto; il prezzo era il silenzio: dal 20/09 al 26/09 nessuno si
      # e' accorto che Filo per Linux non usciva (#733). Da qui il guasto
      # diventa un feedback in coda, con la stessa credenziale e la stessa
      # strada della suite rossa. La release Windows non si tocca.
      - name: Fallito - apri un feedback (la release Windows resta)
        if: failure()
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          PIATTAFORMA: Linux
          VERSIONE: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Quale passo si e' fermato lo dicono gli esiti dei passi con un id.
          ESITI: ${{ toJSON(steps) }}
          MANCANTI: ${{ steps.controllo.outputs.mancanti }}
        shell: bash
        run: node scripts/release-platform-alarm.mjs || echo "::warning::allarme non consegnato"

      - name: Riepilogo
        run: echo "Aggiunto il pacchetto Linux a ${{ needs.release.outputs.version }}"
