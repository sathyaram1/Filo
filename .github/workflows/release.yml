# Release automatica di Filo (Windows + Mac + Linux).
#
# COSA FA
#   Ogni sei ore (cron) il job `scegli` prende il commit PIU' NUOVO di `main`
#   la cui suite e' verde (Playwright su Linux e unit su Windows, a ogni fusione,
#   in suite.yml). Se e' piu' nuovo dell'ultima release: CHIEDE AL SERVER il
#   numero della versione nuova, builda ESATTAMENTE quel commit (installer NSIS
#   per Windows, poi Mac e Linux) e lo pubblica come nuova GitHub Release.
#   L'auto-update dentro Filo (electron-updater) la vede e aggiorna i tester.
#   Niente di verde e nuovo: non fa nulla; se dura da piu' di 48 ore apre un
#   feedback e la corsa e' rossa. Anche un verde che non esce (la meta'
#   Windows si ferma dopo la scelta) apre un feedback, passate le 48 ore.
#   Ogni meta' scrive nella pagina della versione la sezione «Verifica» (commit,
#   corsa, SHA-256 dei suoi file): scripts/release-impronte.mjs.
#
# DUE CANALI (SPEC-DOMANDE.md §4.2)
#   Veloce: la patch delle sei ore, qui sopra. Stabile: una MINOR il lunedi'
#   alle 00:00 di Roma (il secondo cron, alle 22 e alle 23 UTC della domenica:
#   una delle due e' mezzanotte a Roma, con e senza ora legale). Se sia dovuta
#   lo dice il server: lunedi' a Roma, non ancora uscita, nessun feedback di
#   sicurezza a priorita' 3 aperto. Ogni corsa del lunedi' lo chiede, cosi' una
#   corsa persa la recupera la successiva; la settimana saltata la registra il
#   server, e non si ritenta. L'app sul canale stabile installa solo le X.Y.0.
#
# QUESTO LAVORO NON SCRIVE SU `main` (SPEC-RIDISEGNO-MAX.md §10)
#   Fino al 18/08/2026 alzava la patch version da sé e la pushava. Su `main`
#   adesso scrive UNA SOLA identità, quella del server di sicurezza: la ruleset
#   non lascia passare nessun altro, e questo lavoro gira su una macchina
#   qualunque con un token che eredita chiunque ci passi.
#   Quindi il numero lo chiede: `scripts/release-bump.mjs` bussa al server, che
#   legge il manifesto vero su `main`, calcola lui il numero successivo e
#   scrive lui il commit. Da qui non parte nessun `git push`, e non deve
#   tornarci: se un giorno serve cambiare qualcosa su `main`, si aggiunge al
#   server, non qui.
#
# AUTENTICAZIONE
#   · I segreti stanno nell'ambiente `rilascio`, aperto al solo `main`: ogni
#     job che ne legge uno lo dichiara, cosi' un workflow spinto su un ramo
#     non li vede (#1073, tests/unit/catenaPubblicazione.test.mjs).
#   · GITHUB_TOKEN effimero di Actions: crea la bozza e allega i file. I
#     permessi li dichiara questo file: le impostazioni del repo possono
#     restare su sola lettura.
#   · L'app di pubblicazione, se nell'ambiente c'e' la variabile
#     `FILO_PUBLISH_APP_ID` (chiave privata nel segreto `FILO_PUBLISH_APP_KEY`):
#     i nomi che la guida fa creare all'owner, li segue il codice (#1406).
#     Rende pubblica la bozza, il passo che crea il tag v*, e la regola su
#     TUTTI i tag lascia passare solo lei: il download del sito prende la
#     release piu' recente qualunque tag abbia (l'app rifiuta un tag che non
#     sia v<versione>, il sito no). Senza variabile resta il GITHUB_TOKEN.
#   · FILO_BUILD_PASSPHRASE: la parola d'ordine di scopo `build`, la stessa che
#     apre le chiavi di default e l'allarme. Apre SOLO quelle tre cose, e
#     l'aumento di versione non accetta da qui nessun numero e nessun
#     contenuto: li decide il server.
#
# AVVIO MANUALE
#   Si puo' lanciare a mano dalla tab "Actions" del repo (Run workflow),
#   utile per pubblicare subito senza aspettare il cron. Attenzione: il server
#   ha un freno anti-raffica sull'aumento di versione (un aumento ogni ~20
#   minuti, al massimo 12 al giorno), quindi due avvii a mano ravvicinati
#   trovano un rifiuto — voluto, non un guasto.

name: Release Filo (Windows + Mac + Linux)

on:
  schedule:
    - cron: '0 */6 * * *'   # ogni 6 ore (UTC); modificabile
    - cron: '0 22,23 * * 0' # la minor del canale stabile: lunedi' 00:00 a Roma (la stessa stringa in `scegli`)
  workflow_dispatch:         # pulsante "Run workflow" manuale
    inputs:
      # RIMETTERE I FILE DI UNA PIATTAFORMA SU UNA VERSIONE GIA' USCITA
      #   Se la meta' Mac o Linux fallisce, la release esce senza i suoi file e
      #   il collegamento del sito risponde 404. Rilanciare la pubblicazione non
      #   li rimette: decide se pubblicare contando i commit dopo l'ultimo tag,
      #   e senza commit nuovi non fa niente. Con queste caselle si ricostruisce
      #   il codice DI QUELLA versione (il tag) e si allegano i suoi file alla
      #   release che c'e' gia'. Non pubblica niente di nuovo e non fa girare la
      #   suite: il pacchetto e' quello di una versione gia' provata.
      ripubblica_mac:
        description: "Rimetti i file per Mac su una versione gia' uscita"
        type: boolean
        default: false
      ripubblica_linux:
        description: "Rimetti i file per Linux su una versione gia' uscita"
        type: boolean
        default: false
      ripubblica_versione:
        description: 'La versione a cui riattaccarli, per esempio v0.2.229'
        type: string
        default: ''

permissions:
  contents: write            # creare e pubblicare la Release (non serve piu' per scrivere su main)

concurrency:
  group: filo-release
  cancel-in-progress: false  # non interrompere un publish a meta'

jobs:
  # ─── PRIMA DI TUTTO: QUALE COMMIT SI PUBBLICA ──────────────────────────────
  # La suite gira a ogni fusione (suite.yml): la punta di main non e' quasi mai verde, il suo ultimo verde si'.
  # Ferma da piu' di 48 ore con codice nuovo: feedback, qualunque sia il motivo. Senza verdi la corsa e' rossa;
  # con un verde che da piu' di 12 ore non esce si prova lo stesso a pubblicarlo: il guasto a valle puo' essere passato.
  scegli:
    # Riallegare i file di una versione gia' uscita non sceglie niente: il
    # codice e' quello di un tag, gia' provato.
    if: ${{ !inputs.ripubblica_mac && !inputs.ripubblica_linux }}
    runs-on: ubuntu-latest
    environment: rilascio
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.scelta.outputs.sha }}
      stabile: ${{ steps.minor.outputs.stabile }}
    steps:
      - name: Checkout di main (con storia e tag completi)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Il server non risponde: questa corsa resta sul canale veloce, la minor la recupera la corsa dopo.
      - name: La minor del canale stabile e' dovuta?
        id: minor
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          STABILE=false
          REGISTRO="${RUNNER_TEMP}/minor.log"
          if DOVUTA=$(node scripts/release-bump.mjs --controlla-minor 2> "$REGISTRO"); then
            [ "$DOVUTA" = "si" ] && STABILE=true
          else
            echo "::warning::controllo della minor non riuscito: $(cat "$REGISTRO")"
          fi
          echo "stabile=$STABILE" >> "$GITHUB_OUTPUT"
          { echo "## Canale stabile"; echo; cat "$REGISTRO"; } >> "$GITHUB_STEP_SUMMARY"

      # La corsa della minor non pubblica una patch: se la minor non e' dovuta, non sceglie niente.
      - name: L'ultimo commit di main con la suite verde
        id: scelta
        if: steps.minor.outputs.stabile == 'true' || github.event.schedule != '0 22,23 * * 0'
        env:
          GH_TOKEN: ${{ github.token }}
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          STABILE: ${{ steps.minor.outputs.stabile }}
        shell: bash
        run: node scripts/ultima-suite-verde.mjs $([ "$STABILE" = "true" ] && echo --stabile)

  release:
    needs: scegli
    # Solo se `scegli` ha trovato un commit verde piu' nuovo dell'ultima versione;
    # `success()` per esteso: con `scegli` rosso qui non si parte.
    if: ${{ success() && needs.scegli.outputs.sha != '' }}
    runs-on: windows-latest
    environment: rilascio
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.applica.outputs.sha }}
    steps:
      - name: Checkout del commit provato dalla suite (con storia e tag completi)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.scegli.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: C'e' qualcosa di nuovo da rilasciare?
        id: check
        shell: bash
        run: |
          # Senza lo sha scelto il checkout sarebbe caduto sul ramo di
          # default: si pubblicherebbe codice mai provato.
          PROVATO="${{ needs.scegli.outputs.sha }}"
          QUI=$(git rev-parse HEAD)
          if [ -z "$PROVATO" ] || [ "$QUI" != "$PROVATO" ]; then
            echo "::error::nessun commit con la suite verde scelto (${PROVATO:-niente}), qui c'e' $QUI: non pubblico codice mai provato."
            exit 1
          fi
          git fetch --tags --force
          # La minor del canale stabile esce anche senza codice nuovo: e' la versione della settimana.
          if [ "${{ needs.scegli.outputs.stabile }}" = "true" ]; then
            echo "Minor del canale stabile -> si rilascia."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "Nessun tag precedente -> si rilascia."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            # Il tag sta sul commit provato e pubblicato; il commit del numero
            # di versione che il server scrive dopo non e' codice nuovo.
            AHEAD=$(git rev-list --count --invert-grep --grep='^release: v[0-9]' "${LAST_TAG}..HEAD")
            echo "Commit dopo $LAST_TAG: $AHEAD"
            if [ "$AHEAD" -gt 0 ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Il commit provato dalla suite può essere più vecchio dello script che ritenta: lì resta il `npm ci` semplice.
      - name: Install dipendenze
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: if [ -f scripts/npm-ci-ritenta.mjs ]; then node scripts/npm-ci-ritenta.mjs; else npm ci; fi

      # ─── CANCELLO PRIMA DELLA PUBBLICAZIONE ──────────────────────────────
      # Fino al 2026-08-07 questo lavoro prendeva il ramo principale COSI' COM'E'
      # ogni 6 ore, lo costruiva e lo pubblicava agli utenti SENZA eseguire un
      # solo test. Qualunque errore — di una routine o di una sessione locale —
      # arrivava a tutti senza incontrare nessun controllo lungo la strada; e
      # siccome le modifiche atterrano sul ramo principale una per una, la
      # fotografia poteva cogliere un lavoro a meta'.
      #
      # Gira PRIMA del bump di versione: se e' rosso non si consuma un numero di
      # versione e non si sporca la storia.
      - name: Controlli automatici (cancello di pubblicazione)
        if: steps.check.outputs.should_release == 'true'
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          node scripts/unit-con-riprova.mjs --registro unit.log
          echo "unit_ok=1" >> "$GITHUB_OUTPUT"

      # Rosso = NON si pubblica, e il guasto diventa un feedback in coda: al
      # prossimo giro una routine lo prende in carico come qualsiasi altro
      # lavoro, capisce cosa non funziona e lo risolve. Senza questo passo un
      # fallimento si limiterebbe a bloccare le pubblicazioni in silenzio.
      - name: Controlli falliti - apri un feedback e fermati
        if: steps.check.outputs.should_release == 'true' && steps.gate.outcome == 'failure'
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          echo "::error::Controlli automatici rossi: pubblicazione annullata."
          # Il commit provato e' l'ultimo di main con la suite verde, a volte giorni indietro: se ogni rosso e' gia' verde
          # sulla punta, il feedback chiederebbe un lavoro fatto e si riaprirebbe a ogni chiusura (#1185). Nel dubbio si apre.
          PROVATO=$(git rev-parse --short HEAD)
          GIA_VERDI=""
          # La copia della punta sta dentro il repo: i suoi test trovano node_modules risalendo.
          if git fetch --quiet origin main && [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ] \
            && git worktree add --quiet --detach .punta-main FETCH_HEAD; then
            PUNTA=$(git rev-parse --short FETCH_HEAD)
            if GIA_VERDI=$(node .punta-main/scripts/rossi-sulla-punta.mjs unit.log); then
              git worktree remove --force .punta-main || true
              echo "::warning::I rossi del commit provato ${PROVATO} sono gia' verdi sulla punta di main (${PUNTA}): nessun feedback. La versione esce col primo commit di main con la suite verde."
              { echo "## Rossi gia' corretti su main"; echo; echo "Rossi su ${PROVATO}, verdi sulla punta ${PUNTA}:"; printf -- '- %s\n' $GIA_VERDI; } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git worktree remove --force .punta-main || true
          fi
          SULLA_PUNTA=""
          if [ -n "$GIA_VERDI" ]; then
            SULLA_PUNTA="
          Gia' verdi sulla punta di main, da non correggere: $(echo $GIA_VERDI)"
          fi
          PREMESSA="Il cancello prima della pubblicazione ha trovato dei controlli automatici falliti su Windows sul commit ${PROVATO} (il piu nuovo di main con la suite verde, non la punta di main): la nuova versione NON e stata pubblicata e gli utenti restano sull ultima buona. La suite di quel commit aveva gia passato gli stessi test su Windows: se ora sono rossi, di norma il test dipende dai tempi o dalla macchina. Capisci perche e sistemalo; se invece il controllo e diventato obsoleto rispetto a come funziona oggi l app, aggiorna il controllo. Coda dell ultima esecuzione:"
          # I test rossi stanno all'INIZIO del log (una riga «not ok» per
          # ciascuno), la coda porta solo il riepilogo: prima si elencano
          # quelli, poi la coda. Un allarme con la sola coda non diceva quali
          # test erano rossi, e chi lo prendeva doveva rifare tutta la suite.
          # La riga «not ok» porta il nome del test ma non il file (o, a
          # seconda della versione di Node, il file ma non il test, rientrata):
          # si prende con qualunque rientro, e con la riga «location:» che la
          # segue, che dice file e riga. Senza, con più di cento file di test,
          # chi prendeva l'allarme cercava il test per nome.
          # L'elenco ha un tetto (il testo dell'allarme viaggia in un feedback),
          # ma il taglio si DICE: un elenco mozzato senza avviso fa credere di
          # avere tutti i rossi, e con un modulo condiviso rotto sono cento.
          ROSSI_TUTTE=$(grep -E '^[[:space:]]*(not ok|location:)' unit.log 2>/dev/null || true)
          ROSSI=$(printf '%s\n' "$ROSSI_TUTTE" | head -80)
          N_TUTTE=$(printf '%s\n' "$ROSSI_TUTTE" | grep -c . || true)
          if [ "${N_TUTTE:-0}" -gt 80 ]; then
            ROSSI="${ROSSI}
          … elenco tagliato: altre $((N_TUTTE - 80)) righe di test rossi stanno nel registro di questa esecuzione (Actions)"
          fi
          TAIL=$(tail -c 2500 unit.log 2>/dev/null || echo "(nessun output)")
          TESTO="${PREMESSA}

          Commit provato: ${PROVATO}, l'ultimo di main con la suite verde.${SULLA_PUNTA}

          Test rossi:
          ${ROSSI:-(nessuna riga not ok: guarda la coda)}


          ${TAIL}"
          # Una chiave per file di test rosso (`unit:<file>`): un guasto gia' in coda non riapre un feedback.
          node scripts/build-alarm.mjs "Controlli automatici rossi: nessuna versione pubblicata" "$TESTO" --chiavi-unit unit.log || echo "::warning::allarme non consegnato"
          exit 1

      - name: Incastona le chiavi di default nel build (bake)
        # Chiede al server di sicurezza l'override admin più recente (con una
        # parola d'ordine che apre SOLO quello) oppure usa i secret
        # FILO_DEFAULT_* del job, e scrive il file
        # generato che finisce dentro l'eseguibile. La chiave OpenRouter NON
        # c'è più (#598): ogni utente riceve la sua dal server, col tetto pari
        # ai suoi crediti. Nemmeno quella di Gemini (#581): l'applicazione non
        # la legge, quindi finiva nell'installer senza servire a niente e per
        # giunta bastava lei a far passare il cancello qui sotto. Qui restano
        # solo i servizi di contorno. Così la rotazione chiavi
        # dell'admin si propaga a TUTTI gli utenti al prossimo build, anche senza
        # login. Non stampa mai i valori (solo presente/assente).
        #
        # È anche un CANCELLO: se non trova nessuna chiave da nessuna fonte si
        # ferma, perché una versione senza chiavi arriva agli utenti muta e
        # nessuno se ne accorge finché non prova a usarla. Per questo sta PRIMA
        # del bump, come l'altro cancello: un giro fermato non deve consumare un
        # numero di versione né lasciare sul ramo principale un "release: vX"
        # che non corrisponde a niente di pubblicato.
        if: steps.check.outputs.should_release == 'true'
        env:
          # Parola d'ordine che apre SOLO le chiavi di default, e nient'altro.
          # Prima qui c'era il token dell'account robot: una credenziale piena,
          # con cui si arrivava alle chiavi API a pagamento dell'owner.
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
          # #581: da quando config/secrets e' leggibile solo dall'admin, questa
          # e' l'unica strada per far arrivare la chiave Safe Browsing agli
          # utenti. Se il server la restituisce gia', questo secret non serve.
          FILO_DEFAULT_SAFEBROWSING_KEY: ${{ secrets.FILO_DEFAULT_SAFEBROWSING_KEY }}
        run: node scripts/bake-default-config.mjs

      # Prima del numero, come i cancelli: un'app configurata male ferma il giro
      # senza consumare una versione. Il token vale un'ora, e la build parte
      # subito dopo. Mac e Linux allegano a una release che c'e' gia', senza
      # creare tag: a loro basta il GITHUB_TOKEN.
      - name: Token dell'app di pubblicazione (se configurata)
        id: app
        if: steps.check.outputs.should_release == 'true' && vars.FILO_PUBLISH_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FILO_PUBLISH_APP_ID }}
          private-key: ${{ secrets.FILO_PUBLISH_APP_KEY }}
          permission-contents: write

      # ─── IL NUMERO DI VERSIONE LO SCRIVE IL SERVER ───────────────────────
      # Prima qui si faceva `npm version patch` + `git push origin HEAD:main`.
      # Su `main` adesso scrive solo l'identità del server (ruleset), e questo
      # lavoro non deve poterci scrivere: chiede, e basta.
      #
      # Il server legge il manifesto vero su `main`, calcola lui il numero
      # successivo e scrive lui il commit `release: vX.Y.Z [skip ci]`. Da qui
      # non parte nessun numero e nessun contenuto.
      #
      # Codici d'uscita dello script: 0 fatto · 2 rifiutato (freno anti-raffica,
      # parola d'ordine, manifesto) · 3 server non raggiungibile. In tutti e tre
      # i casi diversi da zero il lavoro si ferma: costruire senza sapere quale
      # numero è su `main` pubblicherebbe sopra una release già esistente.
      - name: Chiedi al server il numero della versione nuova
        if: steps.check.outputs.should_release == 'true'
        id: bump
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
        shell: bash
        run: |
          set -e
          if [ "${{ needs.scegli.outputs.stabile }}" = "true" ]; then
            # Lo script di questa corsa: il commit provato puo' essere piu' vecchio della minor.
            mkdir -p "${RUNNER_TEMP}/bump"
            git show "${GITHUB_SHA}:scripts/release-bump.mjs" > "${RUNNER_TEMP}/bump/release-bump.mjs"
            git show "${GITHUB_SHA}:scripts/build-alarm.mjs" > "${RUNNER_TEMP}/bump/build-alarm.mjs"
            VERSION=$(node "${RUNNER_TEMP}/bump/release-bump.mjs" --minor)
          else
            VERSION=$(node scripts/release-bump.mjs)
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Si costruisce il commit PROVATO, non la punta di main (#641): il numero
      # che il server ha appena scritto su main si applica qui, in locale, al
      # manifesto di questo albero, e non si spinge niente. Le fusioni entrate
      # dopo il commit verde escono quando la loro suite e' verde.
      - name: Applica il numero al commit provato (in locale)
        if: steps.check.outputs.should_release == 'true'
        id: applica
        shell: bash
        run: |
          set -e
          PROVATO="${{ needs.scegli.outputs.sha }}"
          ATTESA="${{ steps.bump.outputs.version }}"
          node scripts/release-apply-version.mjs "$ATTESA"
          QUI=$(git rev-parse HEAD)
          if [ "$QUI" != "$PROVATO" ]; then
            echo "::error::qui c'e' $QUI, la suite ha provato ${PROVATO:-(niente)}: non costruisco codice mai provato."
            exit 1
          fi
          echo "sha=$QUI" >> "$GITHUB_OUTPUT"
          echo "Si costruisce ${ATTESA} da ${QUI}."
          # Solo una nota: se la lettura di main non riesce, si pubblica lo stesso.
          if git fetch --quiet origin main 2>/dev/null; then
            MAIN_ORA=$(git rev-parse FETCH_HEAD)
            DOPO=$(git rev-list --count --invert-grep --grep='^release: v[0-9]' "${PROVATO}..${MAIN_ORA}" 2>/dev/null || echo "?")
            if [ "$DOPO" != "0" ]; then
              {
                echo "## main si e' mosso dopo il commit verde: si pubblica comunque il commit provato"
                echo ""
                echo "La suite ha provato \`${PROVATO}\`, pubblicato come ${ATTESA}; main ora e' a \`${MAIN_ORA}\`."
                echo "Commit entrati dopo, non in questa versione: ${DOPO}. Escono a una corsa successiva, quando la loro suite e' verde."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Build e upload su GitHub Releases (come bozza)
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # app non firmata: salta la ricerca certificati
        run: npm run release

      # Le pagine web girano in sandbox col preload impacchettato (src/main/preloadPacchetto.js, scritto da
      # build.beforePack): senza quel file nell'asar, o con uno vecchio, ogni sito resterebbe senza Filo. La bozza
      # allora non si pubblica. Un commit di prima della sandbox non ha il file da confrontare, e passa.
      - name: Il pacchetto per Windows porta il preload delle pagine web?
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          set -e
          if [ ! -f src/main/preloadPacchetto.js ]; then echo "versione senza preload impacchettato: niente da controllare"; exit 0; fi
          ARCHIVIO=$(find dist -path '*win-unpacked/resources/app.asar' -print -quit)
          test -n "$ARCHIVIO" || { echo "::error::nel pacchetto per Windows non trovo app.asar: non pubblico la bozza"; exit 1; }
          node -e "
            const asar = require('@electron/asar');
            const { componi } = require('./src/main/preloadPacchetto.js');
            let dentro = '';
            try { dentro = asar.extractFile(process.argv[1], 'generato/page-preload.js').toString('utf8'); } catch (_) {
              console.log('::error::nel pacchetto manca generato/page-preload.js: le pagine web resterebbero senza Filo'); process.exit(1);
            }
            if (dentro !== componi().codice) { console.log('::error::il preload nel pacchetto non è quello dei sorgenti'); process.exit(1); }
            console.log('preload delle pagine web nel pacchetto:', dentro.length, 'byte');
          " "$ARCHIVIO"

      # Il passo sopra puo' finire verde senza aver caricato niente (lo
      # strumento, quando decide di non pubblicare, si limita a un avviso).
      # Si guarda la bozza VERA prima di renderla pubblica: senza l'installer
      # il sito risponde 404, senza latest.yml l'aggiornamento automatico tace.
      - name: I file per Windows sono davvero nella bozza?
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eo pipefail
          # tr: una riga con \r in coda non passerebbe grep -x, e bloccherebbe ogni versione.
          ELENCO=$(gh release view "${{ steps.bump.outputs.version }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | tr -d '\r')
          echo "Allegati nella bozza:"
          echo "$ELENCO"
          for ATTESO in Filo-Setup.exe latest.yml; do
            echo "$ELENCO" | grep -qx "$ATTESO" || {
              echo "::error::manca $ATTESO nella bozza ${{ steps.bump.outputs.version }}: non la pubblico."
              {
                echo "## Pubblicazione ferma: manca $ATTESO"
                echo ""
                echo "La bozza ${{ steps.bump.outputs.version }} resta non pubblicata e invisibile agli utenti; il numero resta consumato."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
          done

      # Le impronte entrano nella bozza prima che diventi pubblica: nessuna versione esce senza «Verifica».
      # Lo strumento e' quello di questa corsa: il commit provato puo' essere piu' vecchio di lui.
      - name: Impronte dei file nella sezione Verifica
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          VERSIONE: ${{ steps.bump.outputs.version }}
          COMMIT: ${{ steps.applica.outputs.sha }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -e
          git show "${GITHUB_SHA}:scripts/release-impronte.mjs" > "${RUNNER_TEMP}/release-impronte.mjs"
          node "${RUNNER_TEMP}/release-impronte.mjs" --piattaforma Windows --cartella dist \
            --versione "$VERSIONE" --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --corsa "$CORSA"

      - name: Pubblica la release (da bozza a pubblicata)
        # electron-builder crea la release come DRAFT. La rendiamo pubblica solo
        # ORA, a build+upload finiti, cosi' l'auto-update non vede mai una
        # release con asset incompleti. La marchiamo anche come "latest" perche'
        # l'URL .../releases/latest/download/Filo-Setup.exe punti a questa.
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        # --target: il tag nasce sul commit costruito, non sulla punta di main
        # al momento della pubblicazione (il confronto "c'e' qualcosa di nuovo"
        # conta da li').
        run: gh release edit "${{ steps.bump.outputs.version }}" --draft=false --latest --target "${{ steps.applica.outputs.sha }}"

      - name: Riepilogo
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: echo "Pubblicata ${{ steps.bump.outputs.version }}$([ "${{ needs.scegli.outputs.stabile }}" = "true" ] && echo ', minor del canale stabile')"

  # ─── SECONDA META': LA VERSIONE PER MAC ──────────────────────────────────
  # Un pacchetto per Mac lo puo' costruire SOLO un Mac (serve `lipo` per fondere
  # Intel e Apple Silicon in un file solo, e gli strumenti di firma di Apple):
  # per questo e' un lavoro a se', su una macchina Apple, e non un passo in piu'
  # di quello per Windows.
  #
  # Parte DOPO che la versione per Windows e' stata pubblicata, e si attacca
  # alla STESSA pubblicazione: stesso numero di versione, stessa pagina di
  # download, due file. Cosi' il collegamento "Scarica per Mac" del sito
  # (.../releases/latest/download/Filo-Mac.dmg) punta sempre all'ultima
  # versione, come quello per Windows.
  #
  # DUE COSE DA SAPERE
  #   1. Costruisce lo STESSO commit che ha costruito Windows (`needs...sha`,
  #      cioe' quello provato dalla suite) e gli applica in locale lo stesso
  #      numero di versione: quel commit sul repo porta ancora il numero
  #      vecchio, il nuovo sta solo nel commit del server sulla punta di main.
  #   2. Per una decina di minuti — il tempo di questa meta' — la release e'
  #      gia' pubblicata ma il file per Mac non c'e' ancora: in quella finestra
  #      il collegamento del sito risponde 404. E' il prezzo di non far
  #      aspettare Windows, ed e' voluto.
  #
  # Se questa meta' fallisce, quella per Windows resta pubblicata e valida: e'
  # marcata `continue-on-error` apposta: un problema sui Mac non deve togliere
  # l'aggiornamento a chi e' su Windows.
  release-mac:
    needs: release
    # Due strade per arrivare qui: la pubblicazione appena uscita, oppure un
    # avvio a mano per rimettere i file su una versione gia' uscita. Sulla
    # seconda il lavoro Windows non gira nemmeno, e senza `!cancelled()` questo
    # verrebbe saltato con lui.
    if: ${{ !cancelled() && (inputs.ripubblica_mac || (needs.release.result == 'success' && needs.release.outputs.should_release == 'true' && needs.release.outputs.version != '')) }}
    runs-on: macos-latest
    environment: rilascio
    continue-on-error: true
    outputs:
      allarme: ${{ steps.allarme.outputs.esito }}
      finito: ${{ steps.riepilogo.outputs.finito }}
    steps:
      # ─── L'AVVISO DEVE POTER PARLARE PRIMA DI TUTTO IL RESTO ─────────────
      #   Lo strumento che apre il feedback vive nel codice del progetto, e la
      #   copia di lavoro qui sotto diventa quella della versione a cui ci si
      #   attacca: un tag vecchio, che quello strumento non ce l'ha, o niente
      #   affatto se il prelievo fallisce. Finche' l'avviso dipendeva da quella
      #   copia, un guasto nei primi passi lo lasciava muto e la corsa verde —
      #   lo stesso silenzio del #733. Qui si prende il codice di QUESTA corsa e
      #   lo si mette al riparo fuori dalla copia di lavoro; con lui l'installazione
      #   che ritenta, che un tag vecchio non ha.
      - name: Il codice di questa corsa (porta lo strumento dell'avviso)
        id: strumento
        uses: actions/checkout@v4

      - name: Gli strumenti di questa corsa al riparo dalla copia di lavoro
        id: riparo
        shell: bash
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/allarme/scripts" "${{ runner.temp }}/strumenti"
          cp scripts/release-platform-alarm.mjs scripts/build-alarm.mjs scripts/release-impronte.mjs "${{ runner.temp }}/allarme/scripts/"
          cp scripts/npm-ci-ritenta.mjs "${{ runner.temp }}/strumenti/"
          cp scripts/release-impronte.mjs "${{ runner.temp }}/strumenti/"

      # Il numero della versione e il codice da costruire vengono da due posti
      # diversi a seconda della strada. Appena uscita: li passa la meta'
      # Windows, e il codice e' il COMMIT che ha costruito lei, non il tag (il
      # tag nasce alla pubblicazione e punta a dove sta main in quel momento).
      # A mano: il numero lo scrive chi avvia, e il codice e' quel tag, che e'
      # esattamente quello che gli utenti hanno gia'.
      - name: A quale versione ci si attacca
        id: bersaglio
        shell: bash
        env:
          A_MANO: ${{ inputs.ripubblica_mac }}
          VERSIONE_A_MANO: ${{ inputs.ripubblica_versione }}
          VERSIONE_APPENA_USCITA: ${{ needs.release.outputs.version }}
          COMMIT_APPENA_USCITO: ${{ needs.release.outputs.sha }}
        run: |
          set -e
          if [ "$A_MANO" = "true" ]; then
            # Il numero lo scrive una persona in una casella: spazi incollati
            # per sbaglio e la "v" dimenticata non devono costare un giro a
            # vuoto (il tag e' sempre vX.Y.Z).
            CHIESTA=$(printf '%s' "$VERSIONE_A_MANO" | tr -d '[:space:]')
            case "$CHIESTA" in v*) ;; ?*) CHIESTA="v${CHIESTA}" ;; esac
            # Senza numero non si sa dove attaccare: fermarsi e' meglio che
            # allegare i file alla versione sbagliata.
            if [ -z "$CHIESTA" ]; then
              echo "::error::avvio a mano senza il numero della versione: scrivilo nella casella (per esempio v0.2.229)."
              exit 1
            fi
            VERSIONE="$CHIESTA"
            CODICE="$CHIESTA"
          else
            VERSIONE="$VERSIONE_APPENA_USCITA"
            CODICE="$COMMIT_APPENA_USCITO"
          fi
          echo "versione=${VERSIONE}" >> "$GITHUB_OUTPUT"
          echo "codice=${CODICE}" >> "$GITHUB_OUTPUT"
          echo "Ci si attacca a ${VERSIONE}, costruendo ${CODICE}."

      - name: Checkout del codice di questa versione
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.bersaglio.outputs.codice }}

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        id: dipendenze
        shell: bash
        run: node "${{ runner.temp }}/strumenti/npm-ci-ritenta.mjs"

      # Guardia: se qui non c'e' il codice che il server ha scritto per questa
      # versione, si sta costruendo un codice diverso da quello pubblicato per
      # Windows. Meglio fermarsi che allegare alla release un pacchetto Mac che
      # non corrisponde.
      - name: Il codice qui e' davvero quello di questa versione
        id: versione
        shell: bash
        run: |
          set -e
          ATTESA="${{ steps.bersaglio.outputs.versione }}"
          CODICE="${{ steps.bersaglio.outputs.codice }}"
          # Il commit provato dalla suite porta ancora il numero vecchio: il
          # nuovo sta solo nel commit del server sulla punta di main (#641), e
          # si applica qui in locale. Lo script si ferma se non e' piu' alto.
          LOCALE=$(node -p "require('./package.json').version")
          if [ "v${LOCALE}" != "$ATTESA" ]; then
            node scripts/release-apply-version.mjs "$ATTESA"
          fi
          if [ -z "$CODICE" ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse "${CODICE}^{commit}")" ]; then
            echo "::error::qui non c'e' il codice di ${ATTESA} (${CODICE:-niente}): non allego un pacchetto sbagliato."
            exit 1
          fi

      # Stesso passo dell'altra meta', e per lo stesso motivo: senza le chiavi
      # incastonate l'app arriva muta. Va rifatto qui perche' il file generato
      # non sta nel repo: vive solo dentro la macchina che costruisce.
      - name: Incastona le chiavi di default nel build (bake)
        id: bake
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
          # #581: da quando config/secrets e' leggibile solo dall'admin, questa
          # e' l'unica strada per far arrivare la chiave Safe Browsing agli
          # utenti. Se il server la restituisce gia', questo secret non serve.
          FILO_DEFAULT_SAFEBROWSING_KEY: ${{ secrets.FILO_DEFAULT_SAFEBROWSING_KEY }}
        run: node scripts/bake-default-config.mjs

      # Senza certificato Apple lo strumento di impacchettamento salta la firma
      # del tutto: ci pensa scripts/after-pack-mac.js a metterne una locale, che
      # sui Mac con chip Apple e' obbligatoria perche' l'app parta.
      #
      # EP_GH_IGNORE_TIME: la release esiste gia' (l'ha pubblicata la meta'
      # Windows). Lo strumento, per prudenza, si rifiuta di allegare file a una
      # release pubblicata da piu' di due ore; qui il ritardo e' di minuti, ma
      # se la meta' Windows e' stata lenta il rifiuto arriverebbe come un
      # semplice avviso, con il lavoro verde e nessun file allegato.
      - name: Build e upload sulla release esistente
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: "true"
        run: npm run release:mac

      # Il passo sopra puo' finire verde senza aver allegato niente (lo
      # strumento, quando decide di non pubblicare, si limita a un avviso).
      # Qui si guarda la release VERA: se i file che il sito e l'aggiornamento
      # automatico si aspettano non ci sono, il lavoro e' rosso.
      - name: I file per Mac sono davvero nella release?
        id: controllo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLARME: ${{ runner.temp }}/allarme/scripts
        shell: bash
        run: |
          set -e
          ELENCO=$(gh release view "${{ steps.bersaglio.outputs.versione }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name')
          echo "Allegati nella release:"
          echo "$ELENCO"
          # I file attesi stanno in UN posto solo (lo script dell'allarme): qui
          # si chiedono, cosi' il controllo e il testo del feedback non divergono.
          ATTESI=$(node "$ALLARME/release-platform-alarm.mjs" --attesi Mac)
          MANCANTI=""
          for ATTESO in $ATTESI; do
            echo "$ELENCO" | grep -qx "$ATTESO" || MANCANTI="${MANCANTI}${ATTESO} "
          done
          # Si elencano TUTTI i mancanti, non solo il primo: chi prende il
          # feedback deve sapere quanto manca, non scoprirlo un file alla volta.
          echo "mancanti=${MANCANTI% }" >> "$GITHUB_OUTPUT"
          if [ -n "$MANCANTI" ]; then
            echo "::error::mancano nella release ${{ steps.bersaglio.outputs.versione }}: ${MANCANTI% }"
            exit 1
          fi

      # Mac e Linux scrivono la stessa pagina in parallelo: --verifica-dopo la rilegge e rimette le righe se l'altro le ha coperte.
      - name: Impronte dei file nella sezione Verifica
        id: impronte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dall'ambiente e non scritta nel comando: sulla strada a mano la versione la scrive una persona.
          VERSIONE: ${{ steps.bersaglio.outputs.versione }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -e
          node "${{ runner.temp }}/strumenti/release-impronte.mjs" --piattaforma Mac --cartella dist \
            --versione "$VERSIONE" --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --corsa "$CORSA" --verifica-dopo 45

      # `continue-on-error` sul lavoro tiene in piedi la release Windows, e fin
      # qui e' giusto; il prezzo era il silenzio: dal 20/09 al 26/09 nessuno si
      # e' accorto che Filo per Linux non usciva (#733). Da qui il guasto
      # diventa un feedback in coda, con la stessa credenziale e la stessa
      # strada della suite rossa. La release Windows non si tocca.
      - name: Fallito - apri un feedback (la release Windows resta)
        if: failure()
        id: allarme
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          PIATTAFORMA: Mac
          VERSIONE: ${{ steps.bersaglio.outputs.versione }}
          REPO: ${{ github.repository }}
          # L'avviso legge le release: la pagina di questa versione dice cosa manca, l'ultima uscita per Mac fa la chiave.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Quale passo si e' fermato lo dicono gli esiti dei passi con un id.
          ESITI: ${{ toJSON(steps) }}
          MANCANTI: ${{ steps.controllo.outputs.mancanti }}
          ALLARME: ${{ runner.temp }}/allarme/scripts
        shell: bash
        # Il feedback e' l'UNICA cosa che fa sapere il guasto a qualcuno: il
        # lavoro e' continue-on-error, quindi la corsa resta verde comunque.
        # Prima un `|| echo` si mangiava l'esito e il passo finiva verde anche
        # quando l'avviso non partiva (#733, secondo giro di verifica): adesso
        # si riprova, e se non parte il passo e' rosso, il riepilogo lo dice e
        # il lavoro `avviso-mancato` fa diventare rossa la corsa.
        run: |
          # `set -e` e' acceso da GitHub: ogni comando che puo' uscire diverso
          # da zero sta dentro un `if`, o il passo muore prima di riprovare.
          ESITO=muto
          for ATTESA in 15 30 0; do
            if node "$ALLARME/release-platform-alarm.mjs"; then ESITO=aperto; break; fi
            if [ "$ATTESA" -gt 0 ]; then sleep "$ATTESA"; fi
          done
          echo "esito=${ESITO}" >> "$GITHUB_OUTPUT"
          if [ "$ESITO" = "aperto" ]; then exit 0; fi
          echo "::error::l'avviso per Mac non e' partito: il guasto non e' diventato un feedback."
          {
            echo "## L'avviso per Mac non e' partito"
            echo ""
            echo "Il lavoro e' fallito e il feedback NON si e' aperto: di questo guasto non sa niente nessuno, fuori da questa pagina."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Arriva qui solo un lavoro finito bene: `finito=si` e' l'unica prova che l'ultima rete accetta.
      - name: Riepilogo
        id: riepilogo
        shell: bash
        env:
          VERSIONE: ${{ steps.bersaglio.outputs.versione }}
        run: |
          echo "finito=si" >> "$GITHUB_OUTPUT"
          echo "Aggiunto il pacchetto Mac a $VERSIONE"

  # ─── TERZA META': LA VERSIONE PER LINUX ──────────────────────────────────
  # Stessa forma del lavoro per Mac, e per gli stessi motivi: parte DOPO che la
  # versione per Windows e' stata pubblicata e si attacca alla STESSA
  # pubblicazione, cosi' il collegamento "Scarica per Linux" del sito
  # (.../releases/latest/download/Filo-Linux.AppImage) punta sempre all'ultima
  # versione. Il nome del file e' FISSO: il sito ha un collegamento solo e non
  # sa che numero di versione sia uscito.
  #
  # Perche' un lavoro a se' e non un passo in piu' di quello Windows: l'AppImage
  # si costruisce solo su Linux (serve il runtime AppImage e gli strumenti che
  # electron-builder scarica per quella piattaforma).
  #
  # Se questa meta' fallisce, quella per Windows resta pubblicata e valida
  # (`continue-on-error`): un problema su Linux non deve togliere
  # l'aggiornamento a chi e' su Windows. Vale anche al contrario per il Mac:
  # i due lavori sono indipendenti e girano in parallelo.
  release-linux:
    needs: release
    # Due strade per arrivare qui: la pubblicazione appena uscita, oppure un
    # avvio a mano per rimettere i file su una versione gia' uscita. Sulla
    # seconda il lavoro Windows non gira nemmeno, e senza `!cancelled()` questo
    # verrebbe saltato con lui.
    if: ${{ !cancelled() && (inputs.ripubblica_linux || (needs.release.result == 'success' && needs.release.outputs.should_release == 'true' && needs.release.outputs.version != '')) }}
    runs-on: ubuntu-latest
    environment: rilascio
    continue-on-error: true
    outputs:
      allarme: ${{ steps.allarme.outputs.esito }}
      finito: ${{ steps.riepilogo.outputs.finito }}
    steps:
      # Stesso motivo della meta' Mac: lo strumento che apre il feedback deve
      # essere qui prima che la copia di lavoro diventi quella della versione a
      # cui ci si attacca, e prima di qualunque passo che possa fallire.
      - name: Il codice di questa corsa (porta lo strumento dell'avviso)
        id: strumento
        uses: actions/checkout@v4

      - name: Gli strumenti di questa corsa al riparo dalla copia di lavoro
        id: riparo
        shell: bash
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/allarme/scripts" "${{ runner.temp }}/strumenti"
          cp scripts/release-platform-alarm.mjs scripts/build-alarm.mjs scripts/release-impronte.mjs "${{ runner.temp }}/allarme/scripts/"
          cp scripts/npm-ci-ritenta.mjs "${{ runner.temp }}/strumenti/"
          cp scripts/release-impronte.mjs "${{ runner.temp }}/strumenti/"

      # Il numero della versione e il codice da costruire vengono da due posti
      # diversi a seconda della strada. Appena uscita: li passa la meta'
      # Windows, e il codice e' il COMMIT che ha costruito lei, non il tag (il
      # tag nasce alla pubblicazione e punta a dove sta main in quel momento).
      # A mano: il numero lo scrive chi avvia, e il codice e' quel tag, che e'
      # esattamente quello che gli utenti hanno gia'.
      - name: A quale versione ci si attacca
        id: bersaglio
        shell: bash
        env:
          A_MANO: ${{ inputs.ripubblica_linux }}
          VERSIONE_A_MANO: ${{ inputs.ripubblica_versione }}
          VERSIONE_APPENA_USCITA: ${{ needs.release.outputs.version }}
          COMMIT_APPENA_USCITO: ${{ needs.release.outputs.sha }}
        run: |
          set -e
          if [ "$A_MANO" = "true" ]; then
            # Il numero lo scrive una persona in una casella: spazi incollati
            # per sbaglio e la "v" dimenticata non devono costare un giro a
            # vuoto (il tag e' sempre vX.Y.Z).
            CHIESTA=$(printf '%s' "$VERSIONE_A_MANO" | tr -d '[:space:]')
            case "$CHIESTA" in v*) ;; ?*) CHIESTA="v${CHIESTA}" ;; esac
            # Senza numero non si sa dove attaccare: fermarsi e' meglio che
            # allegare i file alla versione sbagliata.
            if [ -z "$CHIESTA" ]; then
              echo "::error::avvio a mano senza il numero della versione: scrivilo nella casella (per esempio v0.2.229)."
              exit 1
            fi
            VERSIONE="$CHIESTA"
            CODICE="$CHIESTA"
          else
            VERSIONE="$VERSIONE_APPENA_USCITA"
            CODICE="$COMMIT_APPENA_USCITO"
          fi
          echo "versione=${VERSIONE}" >> "$GITHUB_OUTPUT"
          echo "codice=${CODICE}" >> "$GITHUB_OUTPUT"
          echo "Ci si attacca a ${VERSIONE}, costruendo ${CODICE}."

      - name: Checkout del codice di questa versione
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.bersaglio.outputs.codice }}

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dipendenze
        id: dipendenze
        shell: bash
        run: node "${{ runner.temp }}/strumenti/npm-ci-ritenta.mjs"

      # Stessa guardia della meta' Mac: se qui non c'e' il codice che il server
      # ha scritto per questa versione, si sta costruendo un codice diverso da
      # quello pubblicato per Windows. Meglio fermarsi che allegare alla release
      # un pacchetto Linux che non corrisponde.
      - name: Il codice qui e' davvero quello di questa versione
        id: versione
        shell: bash
        run: |
          set -e
          ATTESA="${{ steps.bersaglio.outputs.versione }}"
          CODICE="${{ steps.bersaglio.outputs.codice }}"
          # Il commit provato dalla suite porta ancora il numero vecchio: il
          # nuovo sta solo nel commit del server sulla punta di main (#641), e
          # si applica qui in locale. Lo script si ferma se non e' piu' alto.
          LOCALE=$(node -p "require('./package.json').version")
          if [ "v${LOCALE}" != "$ATTESA" ]; then
            node scripts/release-apply-version.mjs "$ATTESA"
          fi
          if [ -z "$CODICE" ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse "${CODICE}^{commit}")" ]; then
            echo "::error::qui non c'e' il codice di ${ATTESA} (${CODICE:-niente}): non allego un pacchetto sbagliato."
            exit 1
          fi

      # Senza le chiavi incastonate l'app arriva muta. Va rifatto anche qui
      # perche' il file generato non sta nel repo: vive solo dentro la macchina
      # che costruisce.
      - name: Incastona le chiavi di default nel build (bake)
        id: bake
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          FILO_DEFAULT_TAVILY_KEY: ${{ secrets.FILO_DEFAULT_TAVILY_KEY }}
          FILO_DEFAULT_SAFEBROWSING_KEY: ${{ secrets.FILO_DEFAULT_SAFEBROWSING_KEY }}
        run: node scripts/bake-default-config.mjs

      # EP_GH_IGNORE_TIME: la release esiste gia' (l'ha pubblicata la meta'
      # Windows) e lo strumento, per prudenza, si rifiuta di allegare file a una
      # release pubblicata da piu' di due ore. Qui il ritardo e' di minuti, ma
      # se la meta' Windows e' stata lenta il rifiuto arriverebbe come un
      # semplice avviso, con il lavoro verde e nessun file allegato.
      - name: Build e upload sulla release esistente
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: "true"
        run: npm run release:linux

      # LE ISTRUZIONI DEL PRIMO AVVIO, ALLEGATE A PARTE
      #   Su Linux l'utente si blocca PRIMA di aver visto Filo, e per due
      #   motivi che valgono per chiunque scarichi. Un file scaricato da un
      #   browser arriva senza il permesso di essere eseguito, e senza quel
      #   permesso il doppio clic non lo avvia. E un AppImage, per montarsi,
      #   apre libfuse.so.2, che Ubuntu dalla 22.04, Debian 12 e le Fedora
      #   recenti non installano piu' di serie: dove manca, il doppio clic
      #   muore con un errore che a un utente non dice niente.
      #
      #   E' lo stesso problema del Mac senza certificato Apple, dove il
      #   foglietto sta dentro il disco che l'utente ha appena aperto. Un
      #   AppImage e' un file solo e non ha un "dentro": il foglietto sale
      #   come allegato a se', con un nome FISSO, cosi' il sito puo' metterlo
      #   accanto al bottone "Scarica per Linux" con un collegamento che non
      #   cambia mai
      #   (.../releases/latest/download/Se-Filo-non-si-apre-Linux.txt).
      - name: Allega le istruzioni del primo avvio
        id: istruzioni
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          gh release upload "${{ steps.bersaglio.outputs.versione }}" \
            "build/Se-Filo-non-si-apre-Linux.txt" \
            --repo "${{ github.repository }}" --clobber

      # Come per il Mac: il passo sopra puo' finire verde senza aver allegato
      # niente. Qui si guarda la release VERA. `latest-linux.yml` e' il file che
      # l'aggiornamento automatico legge su Linux: senza, chi ha scaricato
      # l'AppImage resta fermo a quella versione per sempre.
      - name: I file per Linux sono davvero nella release?
        id: controllo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLARME: ${{ runner.temp }}/allarme/scripts
        shell: bash
        run: |
          set -e
          ELENCO=$(gh release view "${{ steps.bersaglio.outputs.versione }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name')
          echo "Allegati nella release:"
          echo "$ELENCO"
          # I file attesi stanno in UN posto solo (lo script dell'allarme): qui
          # si chiedono, cosi' il controllo e il testo del feedback non divergono.
          ATTESI=$(node "$ALLARME/release-platform-alarm.mjs" --attesi Linux)
          MANCANTI=""
          for ATTESO in $ATTESI; do
            echo "$ELENCO" | grep -qx "$ATTESO" || MANCANTI="${MANCANTI}${ATTESO} "
          done
          # Si elencano TUTTI i mancanti, non solo il primo: chi prende il
          # feedback deve sapere quanto manca, non scoprirlo un file alla volta.
          echo "mancanti=${MANCANTI% }" >> "$GITHUB_OUTPUT"
          if [ -n "$MANCANTI" ]; then
            echo "::error::mancano nella release ${{ steps.bersaglio.outputs.versione }}: ${MANCANTI% }"
            exit 1
          fi

      # Stesso passo della meta' Mac, che puo' scrivere la pagina nello stesso momento.
      - name: Impronte dei file nella sezione Verifica
        id: impronte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dall'ambiente e non scritta nel comando: sulla strada a mano la versione la scrive una persona.
          VERSIONE: ${{ steps.bersaglio.outputs.versione }}
          CORSA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -e
          node "${{ runner.temp }}/strumenti/release-impronte.mjs" --piattaforma Linux --cartella dist \
            --versione "$VERSIONE" --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --corsa "$CORSA" --verifica-dopo 45

      # `continue-on-error` sul lavoro tiene in piedi la release Windows, e fin
      # qui e' giusto; il prezzo era il silenzio: dal 20/09 al 26/09 nessuno si
      # e' accorto che Filo per Linux non usciva (#733). Da qui il guasto
      # diventa un feedback in coda, con la stessa credenziale e la stessa
      # strada della suite rossa. La release Windows non si tocca.
      - name: Fallito - apri un feedback (la release Windows resta)
        if: failure()
        id: allarme
        env:
          FILO_BUILD_PASSPHRASE: ${{ secrets.FILO_BUILD_PASSPHRASE }}
          PIATTAFORMA: Linux
          VERSIONE: ${{ steps.bersaglio.outputs.versione }}
          REPO: ${{ github.repository }}
          # L'avviso legge le release: la pagina di questa versione dice cosa manca, l'ultima uscita per Linux fa la chiave.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESECUZIONE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Quale passo si e' fermato lo dicono gli esiti dei passi con un id.
          ESITI: ${{ toJSON(steps) }}
          MANCANTI: ${{ steps.controllo.outputs.mancanti }}
          ALLARME: ${{ runner.temp }}/allarme/scripts
        shell: bash
        # Il feedback e' l'UNICA cosa che fa sapere il guasto a qualcuno: il
        # lavoro e' continue-on-error, quindi la corsa resta verde comunque.
        # Prima un `|| echo` si mangiava l'esito e il passo finiva verde anche
        # quando l'avviso non partiva (#733, secondo giro di verifica): adesso
        # si riprova, e se non parte il passo e' rosso, il riepilogo lo dice e
        # il lavoro `avviso-mancato` fa diventare rossa la corsa.
        run: |
          # `set -e` e' acceso da GitHub: ogni comando che puo' uscire diverso
          # da zero sta dentro un `if`, o il passo muore prima di riprovare.
          ESITO=muto
          for ATTESA in 15 30 0; do
            if node "$ALLARME/release-platform-alarm.mjs"; then ESITO=aperto; break; fi
            if [ "$ATTESA" -gt 0 ]; then sleep "$ATTESA"; fi
          done
          echo "esito=${ESITO}" >> "$GITHUB_OUTPUT"
          if [ "$ESITO" = "aperto" ]; then exit 0; fi
          echo "::error::l'avviso per Linux non e' partito: il guasto non e' diventato un feedback."
          {
            echo "## L'avviso per Linux non e' partito"
            echo ""
            echo "Il lavoro e' fallito e il feedback NON si e' aperto: di questo guasto non sa niente nessuno, fuori da questa pagina."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Arriva qui solo un lavoro finito bene: `finito=si` e' l'unica prova che l'ultima rete accetta.
      - name: Riepilogo
        id: riepilogo
        shell: bash
        env:
          VERSIONE: ${{ steps.bersaglio.outputs.versione }}
        run: |
          echo "finito=si" >> "$GITHUB_OUTPUT"
          echo "Aggiunto il pacchetto Linux a $VERSIONE"

  # ─── L'ULTIMA RETE: UNA META' NON FINITA SENZA FEEDBACK ───────────────────
  # Le due meta' di piattaforma sono `continue-on-error`, quindi un loro guasto
  # lascia la corsa verde. E' giusto finche' il guasto diventa un feedback: e'
  # quello, non il colore della corsa, a farlo sapere a qualcuno. Qui la corsa
  # diventa rossa quando una meta' che doveva girare non ha detto `finito=si` e
  # non ha detto `aperto`: fallita con l'avviso muto, ma anche stroncata dal
  # tetto di tempo o da una macchina persa, dove il passo dell'avviso non gira
  # affatto (#733.4). `always()` perche' quei lavori non finiscono in successo.
  avviso-mancato:
    needs: [release-mac, release-linux]
    if: ${{ always() && ((needs.release-mac.result != 'skipped' && needs.release-mac.outputs.finito != 'si' && needs.release-mac.outputs.allarme != 'aperto') || (needs.release-linux.result != 'skipped' && needs.release-linux.outputs.finito != 'si' && needs.release-linux.outputs.allarme != 'aperto')) }}
    runs-on: ubuntu-latest
    steps:
      - name: La corsa resta rossa perche' il guasto non e' diventato un feedback
        shell: bash
        env:
          MAC_LAVORO: ${{ needs.release-mac.result }}
          MAC_FINITO: ${{ needs.release-mac.outputs.finito }}
          MAC_AVVISO: ${{ needs.release-mac.outputs.allarme }}
          LINUX_LAVORO: ${{ needs.release-linux.result }}
          LINUX_FINITO: ${{ needs.release-linux.outputs.finito }}
          LINUX_AVVISO: ${{ needs.release-linux.outputs.allarme }}
        run: |
          stato() {
            if [ "$2" = "skipped" ]; then echo "$1: non doveva girare"
            elif [ "$3" = "si" ]; then echo "$1: finito"
            elif [ "$4" = "aperto" ]; then echo "$1: fallito, feedback aperto"
            elif [ "$4" = "muto" ]; then echo "$1: fallito, e il feedback NON si e' aperto"
            else echo "$1: non e' arrivato in fondo (tetto di tempo, macchina persa o corsa annullata) e non ha potuto avvisare"
            fi
          }
          MAC=$(stato Mac "$MAC_LAVORO" "$MAC_FINITO" "$MAC_AVVISO")
          LINUX=$(stato Linux "$LINUX_LAVORO" "$LINUX_FINITO" "$LINUX_AVVISO")
          echo "::error::una meta' di piattaforma non e' finita bene e nessun feedback lo dice. ${MAC}. ${LINUX}."
          {
            echo "## Una meta' di piattaforma non e' finita e il guasto non e' diventato un feedback"
            echo ""
            echo "- ${MAC}"
            echo "- ${LINUX}"
            echo ""
            echo "Apri il suo lavoro qui sopra. Se nella release manca un file, si rimette avviando a mano la pubblicazione con la casella della piattaforma e il numero della versione."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
