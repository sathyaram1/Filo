<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove — i nodi</title>
<style>
:root {
  --dash-paper: #f2ece0;
  --dash-card: #f7f2e8;
  --dash-ink: #221e19;
  --dash-ink-soft: #5b554b;
  --dash-ink-mute: #8c8273;
  --dash-line: rgba(34, 30, 25, 0.10);
  --dash-line-strong: rgba(34, 30, 25, 0.18);
  --dash-accent: #c0552b;
  --dash-altro: #8c8273;
}
body.scuro {
  --dash-paper: #1c1916;
  --dash-card: #25211c;
  --dash-ink: #ece6da;
  --dash-ink-soft: #b8b0a1;
  --dash-ink-mute: #7e7567;
  --dash-line: rgba(236, 230, 218, 0.10);
  --dash-line-strong: rgba(236, 230, 218, 0.20);
  --dash-altro: #8a8072;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--dash-paper); color: var(--dash-ink);
  font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  padding: 0 0 60px;
}

.barra {
  position: sticky; top: 0; z-index: 10; background: var(--dash-paper);
  border-bottom: 1px solid var(--dash-line);
  padding: 12px 26px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.barra h1 { font-size: 15px; font-weight: 600; margin: 0 12px 0 0; }
.cur { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dash-ink-soft); }
.cur input[type=range] { width: 120px; accent-color: var(--dash-accent); }
.cur output { font-variant-numeric: tabular-nums; min-width: 34px; color: var(--dash-ink-mute); }
.barra button {
  font: inherit; font-size: 12px; border: 1px solid var(--dash-line-strong);
  background: transparent; color: var(--dash-ink); border-radius: 16px;
  padding: 5px 12px; cursor: pointer;
}
.barra button:hover { background: var(--dash-ink); color: var(--dash-paper); }
.barra button.acceso { background: var(--dash-accent); border-color: var(--dash-accent); color: #fff; }
.barra label.spunta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dash-ink-soft); cursor: pointer; }
.barra input[type=checkbox] { accent-color: var(--dash-accent); }

main { padding: 22px 26px; }
section { margin-bottom: 30px; }
section > h2 {
  font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--dash-ink-mute); margin: 0 0 2px;
}
section > p.desc { font-size: 12.5px; color: var(--dash-ink-mute); margin: 0 0 14px; max-width: 720px; }
.fila { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.cella {
  background: var(--dash-card); border: 1px solid var(--dash-line); border-radius: 14px;
  padding: 10px 12px 8px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 6px; transition: border-color 160ms ease;
}
.cella:hover { border-color: var(--dash-line-strong); }
.cella .nome { font-size: 11.5px; color: var(--dash-ink-mute); text-align: center; max-width: 150px; }
.cella svg { display: block; overflow: visible; }
.filo { fill: none; stroke: var(--dash-accent); stroke-linecap: round; }
.guaina { fill: none; stroke: var(--dash-card); stroke-linecap: round; }
.altro { stroke: var(--dash-altro); }
</style>
</head>
<body>

<div class="barra">
  <h1>I nodi</h1>
  <div class="cur">grandezza <input type="range" id="zoom" min="0.4" max="2.6" step="0.05" value="1"><output id="ozoom"></output></div>
  <div class="cur">lentezza <input type="range" id="lento" min="1" max="12" step="0.5" value="3"><output id="olento"></output></div>
  <div class="cur">fotogramma <input type="range" id="scrub" min="0" max="1" step="0.005" value="1"><output id="oscrub"></output></div>
  <button id="riparti">↺ rigioca tutte</button>
  <button id="ferma">⏸ ferma sul fotogramma</button>
  <label class="spunta"><input type="checkbox" id="riposo"><span>solo lo stato finale</span></label>
  <label class="spunta"><input type="checkbox" id="tema"><span>scuro</span></label>
</div>

/* ————————————————————————————————————————————————————————
   Ogni nodo è una sequenza di fotogrammi chiave: percorsi
   disegnati nello stesso spazio (60 x 90, il filo a x=30).
   Fra un fotogramma e l'altro si interpola punto per punto,
   quindi la topologia diventa geometria e si può rallentare.

   `tagli` spezza il percorso in pezzi; `z` dice in che ordine
   disegnarli. Ogni pezzo ha sotto una guaina del colore della
   carta: è così che si vede chi passa sopra e chi sotto.
———————————————————————————————————————————————————————— */
var N = 140;
var mp = document.getElementById('misuraPath');
var cache = {};
function campiona(d) {
  if (cache[d]) return cache[d];
  mp.setAttribute('d', d);
  var L = mp.getTotalLength(), pts = [];
  for (var i = 0; i < N; i++) {
    var p = mp.getPointAtLength((i / (N - 1)) * L);
    pts.push([p.x, p.y]);
  }
  cache[d] = pts;
  return pts;
}
function fondi(a, b, t) {
  var out = [];
  for (var i = 0; i < N; i++) out.push([a[i][0] + (b[i][0] - a[i][0]) * t, a[i][1] + (b[i][1] - a[i][1]) * t]);
  return out;
}
function facile(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function dOf(pts, da, a) {
  var s = '';
  for (var i = da; i <= a && i < pts.length; i++) s += (i === da ? 'M' : 'L') + pts[i][0].toFixed(2) + ',' + pts[i][1].toFixed(2);
  return s;
}

var DRITTO = 'M30,-4 L30,94';
var MOZZO  = 'M30,-4 L30,46 C30,52 30,54 30,56';

var RICCIOLO     = 'M30,-4 L30,36 C30,44 14,43 14,51 C14,59 30,59 30,50 C30,43 30,45 30,42 L30,94';

/* ————————————— il gomitolo ————————————— */
var GOMITOLI = [
  { nome: 'a spirale, verso il centro', modo: 'dentro' },
  { nome: 'girando su sé stesso', modo: 'gira' },
  { nome: 'che cresce verso fuori', modo: 'fuori' },
  { nome: 'prima si affloscia, poi si raccoglie', modo: 'affloscia' },
];

var SPIRALE = (function () {
  var pts = [], s = 0, prev = null;
  for (var th = 0; th < Math.PI * 16; th += 0.03) {
    var r = 0.8 + 0.42 * th;
    var p = [Math.cos(th) * r, Math.sin(th) * r * 0.86];
    if (prev) s += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
    pts.push({ s: s, p: p });
    prev = p;
  }
  return pts;
})();
var SPIR_MAX = SPIRALE[SPIRALE.length - 1].s;
function puntoSpirale(s) {
  s = Math.max(0, Math.min(SPIR_MAX, s));
  var lo = 0, hi = SPIRALE.length - 1;
  while (lo < hi - 1) { var m = (lo + hi) >> 1; if (SPIRALE[m].s < s) lo = m; else hi = m; }
  return SPIRALE[lo].p;
}

/* ————————————— disegno ————————————— */
var SPESSORE = 3.2, GUAINA = 7.4;
var celle = [];

function nuovaCella(sezioneEl, v, alto) {
  var box = document.createElement('div');
  box.className = 'cella';
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 60 ' + (alto || 90));
  var nome = document.createElement('div');
  nome.className = 'nome';
  nome.textContent = v.nome;
  box.append(svg, nome);
  sezioneEl.append(box);
  var cella = { svg: svg, box: box, v: v, alto: alto || 90, t0: performance.now(), pezzi: [] };
  box.addEventListener('click', function () { cella.t0 = performance.now(); });
  celle.push(cella);
  return cella;
}

function ridimensiona() {
  var z = Number(document.getElementById('zoom').value);
  celle.forEach(function (c) {
    c.svg.setAttribute('width', (60 * z).toFixed(0));
    c.svg.setAttribute('height', (c.alto * z).toFixed(0));
  });
  document.getElementById('ozoom').textContent = z < 0.5 ? 'vera' : z.toFixed(1) + '×';
}

// Gli elementi si creano una volta sola: a ogni fotogramma cambia solo la
// `d`. Ricostruire l'SVG a ogni giro, con venticinque celle, non regge.
function pezziDi(v) {
  var lim = [0];
  (v.tagli || []).forEach(function (f) { lim.push(Math.round(f * (N - 1))); });
  lim.push(N - 1);
  var conf = [];
  for (var i = 0; i < lim.length - 1; i++) conf.push([lim[i], lim[i + 1]]);
  var ordine = (v.z && v.z.length === conf.length) ? v.z : conf.map(function (_, i) { return i; });
  return ordine.map(function (idx) { return conf[idx]; }).filter(Boolean);
}

function preparaCella(c) {
  var ns = 'http://www.w3.org/2000/svg';
  var v = c.v;
  c.altroPezzi = [];
  c.pezzi = [];
  function coppia(classe, spess) {
    var g = document.createElementNS(ns, 'path');
    g.setAttribute('class', 'guaina');
    g.setAttribute('stroke-width', GUAINA);
    var f = document.createElementNS(ns, 'path');
    f.setAttribute('class', 'filo ' + (classe || ''));
    f.setAttribute('stroke-width', spess || SPESSORE);
    c.svg.append(g, f);
    return { g: g, f: f };
  }
  if (c.gomitolo) {
    c.filoLungo = coppia('', SPESSORE * 0.62);
    c.nodiG = [0, 1, 2].map(function () {
      var el = document.createElementNS(ns, 'circle');
      el.setAttribute('fill', 'var(--dash-accent)');
      c.svg.append(el);
      return el;
    });
    return;
  }
  if (v.altro) {
    c.altroSeg = pezziDi(v.altro);
    c.altroPezzi = c.altroSeg.map(function () { return coppia('altro'); });
  }
  c.seg = pezziDi(v);
  c.pezzi = c.seg.map(function () { return coppia(''); });
  if (v.goccia) {
    c.gocciaEl = document.createElementNS(ns, 'circle');
    c.gocciaEl.setAttribute('cx', v.goccia[0]);
    c.gocciaEl.setAttribute('cy', v.goccia[1]);
    c.gocciaEl.setAttribute('fill', 'var(--dash-accent)');
    c.svg.append(c.gocciaEl);
  }
}

function statoNodo(v, p) {
  var f = v.fasi, n = f.length - 1;
  if (n <= 0) return campiona(f[0]);
  var x = Math.min(0.9999, Math.max(0, p)) * n;
  var i = Math.floor(x);
  return fondi(campiona(f[i]), campiona(f[i + 1]), facile(x - i));
}

function disegnaNodo(c, p) {
  var v = c.v;
  var pts = statoNodo(v, p);
  c.seg.forEach(function (sg, i) {
    var d = dOf(pts, sg[0], sg[1]);
    c.pezzi[i].g.setAttribute('d', d);
    c.pezzi[i].f.setAttribute('d', d);
  });
  if (v.altro) {
    var ap = statoNodo(v.altro, p);
    c.altroSeg.forEach(function (sg, i) {
      var d = dOf(ap, sg[0], sg[1]);
      c.altroPezzi[i].g.setAttribute('d', d);
      c.altroPezzi[i].f.setAttribute('d', d);
    });
  }
  if (c.gocciaEl) {
    var op = p > 0.75 ? Math.min(1, (p - 0.75) * 4) : 0;
    c.gocciaEl.setAttribute('r', (3.4 * op).toFixed(2));
  }
}

function disegnaGomitolo(c, p) {
  var H = 150, pts = [], lung = [0];
  var ora = performance.now();
  for (var i = 0; i < N; i++) {
    var y = (i / (N - 1)) * H;
    var vib = (1 - p) * Math.sin(y * 0.14 + ora / 260) * 1.4;
    pts.push([30 + vib, y]);
  }
  for (var j = 1; j < N; j++) lung.push(lung[j - 1] + Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]));
  var totale = lung[N - 1];

  var m = facile(Math.min(1, p)), giro = 0, verso = 1, cx = 30, cy = 18, slack = 0;
  if (c.v.modo === 'gira') giro = m * Math.PI * 3.2;
  if (c.v.modo === 'fuori') verso = -1;
  if (c.v.modo === 'affloscia') {
    m = p < 0.4 ? 0 : facile((p - 0.4) / 0.6);
    slack = Math.max(0, 1 - Math.abs(p - 0.4) / 0.4);
  }

  var out = [], d = '';
  for (var k = 0; k < N; k++) {
    var s = verso > 0 ? lung[k] : (totale - lung[k]);
    var sp = puntoSpirale(s);
    var rx = sp[0] * Math.cos(giro) - sp[1] * Math.sin(giro);
    var ry = sp[0] * Math.sin(giro) + sp[1] * Math.cos(giro);
    var px = pts[k][0] + slack * Math.sin(lung[k] * 0.06) * 7;
    var py = pts[k][1] + slack * 4;
    var pt = [px + (cx + rx - px) * m, py + (cy + ry - py) * m];
    out.push(pt);
    d += (k ? 'L' : 'M') + pt[0].toFixed(2) + ',' + pt[1].toFixed(2);
  }
  c.filoLungo.g.setAttribute('d', d);
  c.filoLungo.f.setAttribute('d', d);
  [0.28, 0.55, 0.82].forEach(function (f, i) {
    var idx = Math.round(f * (N - 1));
    c.nodiG[i].setAttribute('cx', out[idx][0].toFixed(2));
    c.nodiG[i].setAttribute('cy', out[idx][1].toFixed(2));
    c.nodiG[i].setAttribute('r', (2.6 * (1 - m * 0.4)).toFixed(2));
  });
}

/* ————————————— montaggio ————————————— */
var main = document.getElementById('main');
SEZIONI.forEach(function (s) {

  sec.append(h, p, fila);
  main.append(sec);
  s.varianti.forEach(function (v) { nuovaCella(fila, v); });
});
(function () {
  var sec = document.createElement('section');

  var p = document.createElement('p'); p.className = 'desc';
  p.textContent = 'Il filo che si avvolge a fine risposta. Sono gli stessi punti del filo mandati sulla spirale: i nodi ci girano dentro, e un lavoro lungo lascia un gomitolo più grosso.';
  var fila = document.createElement('div'); fila.className = 'fila';

/* ————————————— il tempo ————————————— */
var fermo = false, inCorso = false;
// Fermo o «solo lo stato finale»: si disegna una volta e ci si ferma. Un
// ciclo che gira a vuoto su trenta celle scalda il computer per niente.
function battito() {
  inCorso = false;
  var lento = Number(document.getElementById('lento').value);
  var durata = 900 * lento;
  var riposo = document.getElementById('riposo').checked;
  var scrub = Number(document.getElementById('scrub').value);
  var ora = performance.now();
  celle.forEach(function (c) {
    var p;
    if (riposo) p = 1;
    else if (fermo) p = scrub;
    else {
      var e = (ora - c.t0) % (durata + 900 * lento * 0.5);
      p = Math.min(1, e / durata);
    }
    var fermoQui = (riposo || fermo) && !c.gomitolo;
    if (fermoQui && c.ultimo === p) return;
    c.ultimo = p;
    if (c.gomitolo) disegnaGomitolo(c, p);
    else disegnaNodo(c, p);
  });
  if (!(riposo || fermo)) avvia();
}
function avvia() {
  if (inCorso) return;
  inCorso = true;
  requestAnimationFrame(battito);
}

document.getElementById('zoom').addEventListener('input', function () { ridimensiona(); avvia(); });
document.getElementById('lento').addEventListener('input', function (e) {
  document.getElementById('olento').textContent = '÷' + Number(e.target.value).toFixed(1);
});
document.getElementById('scrub').addEventListener('input', function (e) {
  fermo = true;
  document.getElementById('ferma').classList.add('acceso');
  document.getElementById('oscrub').textContent = Number(e.target.value).toFixed(2);
  avvia();
});
document.getElementById('ferma').addEventListener('click', function (e) {
  fermo = !fermo;
  e.target.classList.toggle('acceso', fermo);
  avvia();
});
document.getElementById('riparti').addEventListener('click', function () {
  fermo = false;
  document.getElementById('ferma').classList.remove('acceso');
  var ora = performance.now();
  celle.forEach(function (c) { c.t0 = ora; c.ultimo = -1; });
  avvia();
});
document.getElementById('tema').addEventListener('change', function (e) {
  document.body.classList.toggle('scuro', e.target.checked);
});
document.getElementById('riposo').addEventListener('change', avvia);

celle.forEach(preparaCella);
ridimensiona();
document.getElementById('olento').textContent = '÷3.0';
document.getElementById('oscrub').textContent = '1.00';
avvia();
</script>
